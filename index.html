000Z", "text": "Stagehand v4가 브라우저 자동화의 판도를 뒤엎은 이유:\n\n1. 화제의 'Jev' 지원 추가 (LLM 호출 97% 감소)\n- 최근 Jev 지원이 업데이트되면서 벤치마크 수치가 충격적인 수준으로 폭발함:\n  · act(자연어 동작): 4.3배 속도 향상, LLM 호출 97% 감소 (성공률 98.3%)\n  · observe(요소 탐색): 11.1배 속도 향상, 호출 69% 감소\n  · extract(데이터 추출): 8.7배 속도 향상, 호출 75% 감소\n- 반복 실행 시 캐싱과 경량화로 LLM 비용이 '사실상 0원'에 수렴함.\n\n2. 브라우저 내부 확장 프로그램 실행 (속도 2배)\n- 기존 Playwright는 동작마다 외부 스크립트-브라우저를 왕복하며 지연(Latency)이 심했음.\n- v4는 확장 프로그램이 브라우저 내부에서 직접 명령을 처리하고 배치(일괄) 실행하여 왕복 딜레이를 싹 제거함.\n\n3. 접근성 트리 가지치기로 토큰 80% 절감\n- 불필요한 HTML 노이즈를 걷어내고, LLM에 꼭 필요한 핵심 문맥만 '하이브리드 가지치기'로 전달함.\n- 동일 작업 기준 토큰 소비량이 80%나 급감해 API 비용을 극적으로 아낄 수 있음.\n\n4. 어디에 써먹을 수 있는가?\n① 네이버 블로그 자동화\n② 숏폼 (네이버TV, 틱톡 등 업로드 자동화)\n③ 개발 중인 서비스 유저 플로우별 테스트 및 QA\n④ 크롤링이나 스크래핑\n\n5. AI 코딩 에이전트 & MCP 완벽 연동\n- Python, TypeScript, Go 모두 지원하며 로컬 크롬에서도 즉시 구동 가능 (MIT 오픈소스).\n\n* 단, 인스타·스레드·X(트위터) 등의 소통 자동화는 행동 패턴 때문에 봇으로 감지되어 계정이 정지될 수 있으니 안 하는 것을 권장드림.\n\n🔗 벤치마크: http://stagehand.dev/evals\n🔗 깃허브: http://github.com/browserbase/stagehand", "quotes": [{"type": "replied_to", "text": "지금 전 세계 개발자 커뮤니티가 발칵 뒤집힌 이유.\n\nPlaywright 쓰던 사람들이 단체로 갈아탈 수밖에 없게 만든 오픈소스 'Stagehand v4'가 나옴.\n\n최근 화제인 Jev까지 붙으면서 LLM 호출 97% 삭감, 속도 11배 폭증.\n\n반복 실행 비용이 '0원'으로 수렴해버리는 미친 자동화의 비밀 👇 (타래) https://x.com/Dontgiveup_26/status/2102286564521111687/photo/1", "who": "@Dontgiveup_26", "url": "https://x.com/i/status/2102286564521111687"}], "likes": 374, "bm": 714, "url": "https://x.com/Dontgiveup_26/status/2102286567171932342"}, {"ty": "工具/项目", "tp": "AI Agent 与编程工具", "name": "Justin", "handle": "interjc", "date": "2026-09-21 15:18", "ts": "2026-09-21T06:18:15.000Z", "text": "在 Claude Code 或者 Codex 使用 Astra 或者 Fable 指挥 Gemini 3.8 Flash 干活是性价比之选\n\n只需要安装 agy staff plugin：https://github.com/keli-wen/agy-staff", "quotes": [], "likes": 406, "bm": 736, "url": "https://x.com/interjc/status/2101918912837468215"}, {"ty": "生活娱乐", "tp": "搞笑与影视", "name": "𑁍Güzel Sözler ོ", "handle": "Enes_Kerem_", "date": "2026-09-19 19:58", "ts": "2026-09-19T10:58:28.000Z", "text": "Keçi inadı 🥰 😅 🐐 🐾 https://x.com/Enes_Kerem_/status/2101264655226196031/video/1", "quotes": [], "likes": 3405, "bm": 159, "url": "https://x.com/Enes_Kerem_/status/2101264655226196031"}, {"ty": "深度文章", "tp": "Agent 工程", "name": "Jon Kelley", "handle": "jkelleyrtp", "date": "2026-09-20 02:35", "ts": "2026-09-19T17:35:25.000Z", "text": "Several months of work went into building Devin's Cloud Mac!\n\nWe had to rebuild its disk, networking, provisioning, VNC, and computer use from scratch, in Rust. \n\nRead my first X article about how it all works 😊 https://x.com/i/article/2101039266675793920", "quotes": [], "likes": 401, "bm": 609, "url": "https://x.com/jkelleyrtp/status/2101364551296143772"}, {"ty": "生活娱乐", "tp": "健身与健康", "name": "Daily Fitness", "handle": "DailyFitHQ", "date": "2026-09-19 21:28", "ts": "2026-09-19T12:28:11.000Z", "text": "2 Minutes Flat Stomach in 14 days Beginner Friendly. Do 5 rounds every Morning. https://x.com/DailyFitHQ/status/2101287233437200431/video/1", "quotes": [], "likes": 8756, "bm": 13078, "url": "https://x.com/DailyFitHQ/status/2101287233437200431"}, {"ty": "生活娱乐", "tp": "搞笑与影视", "name": "MONTEIRO 🇧🇷", "handle": "DOCENTEMONTEIRO", "date": "2026-09-20 04:58", "ts": "2026-09-19T19:58:20.000Z", "text": "Rindo até 2050 https://x.com/DOCENTEMONTEIRO/status/2101400520686702861/video/1", "quotes": [], "likes": 18218, "bm": 2661, "url": "https://x.com/DOCENTEMONTEIRO/status/2101400520686702861"}, {"ty": "教程/学习", "tp": "语言与学习方法", "name": "米开朗基杨", "handle": "CarsonYangk8s", "date": "2026-09-19 20:46", "ts": "2026-09-19T11:46:59.000Z", "text": "大部分人学了几十年英语，英语水平没有任何明显的提升，我说句不好听的话，甚至连英语的门都还没入，根本原因就是方法错了\n\n具体错在哪里呢？原因很简单：你在用脑子学英语\n\n举个例子，假设你听到一串声音，你先用脑子逆向这串声音，把它当成一个个单词通过所谓的连读和弱读组装起来的形式，最终反向拆解出一句由独立单词组成的句子文本，再根据这个文本翻译成中文，再理解这句中文的意思。整个过程你用到了分析、推导等一系列需要脑子的东西——这就是用脑子学英语。\n\n当然不排除有一些毅力惊人的同学，用了不太正确的方法，但持久力惊人，每天花费大量时间日复一日坚持了十几二十年，也会有一些比较明显的进步。但 99% 的人没有这么惊人的毅力，咱不必跟他们学。只要方法对了，不到半年基本上就能和美国人正常交流了，对毅力和持久力的要求没有那么高。\n\n正确的方法是把英语当成鸟语学，直接建立一段声音和语义的连接，音义之间走直线，声音转文字、文字翻母语这两道中间工序都省掉。\n\n那该如何做到直接建立声音和语义的连接呢？方法很简单：不要背单词，要背句型。不要背文本句型，要背声音句型。准确的说，不是背诵，而是模仿，至少 30 遍以上形成肌肉记忆。\n\n拿到一串声音句型之后，直接和它对齐颗粒度。什么叫对齐颗粒度？就是它怎么说你就怎么说。太快就降速，还跟不上就切开分段；降速和分段都是辅助手段，最终目的还是要和它一样，模仿得和这串声音一模一样。\n\n当我们和这串声音彻底对齐颗粒度之后，再去了解这段声音的语义。你可以直接拿着这段声音去问 AI，让它直接告诉你语义，最好别让 AI 透露这串声音对应的是哪几个单词。接下来你再听这串声音句型组成的句子，就能瞬间秒懂了。最后的最后，你再看这串声音对应的是哪几个单词——这一步最好放到最后，这样文字才不会对声音产生干扰。\n\n举个例子。有一串声音句型叫「薅马儿沟娜」，这个句型组装的例句是：「薅马儿沟娜」 make it。\n\n你需要做的是模仿这个声音句型，直到可以滚瓜烂熟、脱口而出「薅马儿沟娜」；最后再搞清楚这串声音的意思是「我将如何去怎么怎么样」；最后你再听例句「薅马儿沟娜」 make it，这时你会感觉这句话清晰无比，一点也不模糊。\n\n最后的最后，你再看一下「薅马儿沟娜」这串声音可以拆解成这几个单词：how am I going to。", "quotes": [], "likes": 30, "bm": 31, "url": "https://x.com/CarsonYangk8s/status/2101276864564383750"}, {"ty": "工具/项目", "tp": "模型与 AI 应用", "name": "雨夹雪❄️", "handle": "mizorewww", "date": "2026-09-20 09:48", "ts": "2026-09-20T00:48:33.000Z", "text": "介绍比Jev快50倍，在你设备上跑的laya-mlx!\n\n只在你的设备上占用最高1G内存\n\nLaya是一个开源的类似于Jev的,基于文本输出概率的分类系统\n\n我将其移植到MLX,并且做了一些性能优化!\n\n视频中就是这个模型在我的本地M3Max上玩贪吃蛇\n\n这个模型能够以每秒决策60次的速度玩贪吃蛇！\n\nhttps://github.com/mizorewww/laya-mlx https://x.com/mizorewww/status/2101473552956555427/video/1", "quotes": [], "likes": 14059, "bm": 17952, "url": "https://x.com/mizorewww/status/2101473552956555427"}, {"ty": "深度文章", "tp": "Agent 工程", "name": "unicode", "handle": "unicodef1wn", "date": "2026-09-19 19:57", "ts": "2026-09-19T10:57:48.000Z", "text": "Three SpaceX engineers streamed 72 hours of building a company from an empty repo. I turned those streams into a 24-page PDF.\n\nWhat's in the PDF:\n\n→ The full 3-day timeline, hour by hour, as one story\n→ Teammates, not tasks - the model that made the bots actually work\n→ Every antipattern that broke live, and the rule it produced\n→ Real economics - the costs they quoted on air, and where tokens go\n\nWhat's in the repo around it:\n\n→ AGENTS.md - drop it in your repo root, your agent stops guessing\n→ 69 bot roles, 9 playbooks, 40 antipatterns - one file each, paste and run\n\nWhere the PDF is:\n\nopen the repo → it's in the root → guide → grok-bot-guide-by-spacex-engineers.pdf → download raw\n\nhttp://github.com/unicodef1wn/grokbot-field-notes\n\nSave this and copy the engineers workflow later 👇", "quotes": [{"type": "quoted", "text": "Three xAI engineers built a company from an empty repo in 72 hours, live on stream. I turned all three streams into one GitHub repo.\n\n→ AGENTS.md - drop it in your repo root, your agent reads it and stops guessing\n→ 40 antipatterns - everything that broke on air, why, and the rule it produced\n→ 69 bot roles - ready job descriptions to paste, one file each\n→ 9 playbooks - eng, PM, founders, sales, SDR, support, post-sales, marketing\n→ Economics - every cost they quoted and where the tokens actually go\n→ 24-page PDF guide - the whole three days as one story\n\nNothing theoretical. Every rule came from something that failed live in front of an audience.\n\nhttp://github.com/unicodef1wn/grokbot-field-notes\n\nSave this and run Grok Bot the way the people who built it run it 👇", "who": "@unicodef1wn", "url": "https://x.com/i/status/2100884761124200798"}], "likes": 864, "bm": 1589, "url": "https://x.com/unicodef1wn/status/2101264490599686444"}, {"ty": "教程/学习", "tp": "AI 课程与指南", "name": "南晚Nanwan", "handle": "snwiki238337", "date": "2026-09-19 14:26", "ts": "2026-09-19T05:26:06.000Z", "text": "一个系统化的 Agent 工程学习路线图手册：Agentic Engineering Handbook。\n\n它把散落在 OpenAI 博客、Anthropic 工程文、SDK 文档、cookbook、论文里的 179 个精选资源，整成一份从\"手写 Agent Loop\"到\"生产落地/eval/安全\"的结构化学习路径。​ \n\n学习路径分 7 阶段（Phase 0–6）​：\n\nPhase 0：从零手写 Agent Loop（基于 shareAI-lab/mini-claude-code，给了 v0–v4 可跑 Python 代码：bash agent → 模型当 agent → 结构化规划 → 子代理 → skills）\n\nPhase 1：Agent 基础（该不该建 agent 的 4 问检查表、Building Effective Agents 等）\n\nPhase 2：MCP & 工具生态\n\nPhase 3：Context / Memory / Skills（含 Agent Skills 规范、上下文工程）\n\nPhase 4：Harness & 长程 Agent（mini coding harness 练习）\n\nPhase 5：Coding / Workspace Agents（Codex / Claude Code 风格工作流）\n\nPhase 6：Evals / Safety / Production（smoke/macro eval 套件练习）\n\n仓库：https://github.com/keyuchen21/agentic-engineering-handbook", "quotes": [], "likes": 344, "bm": 527, "url": "https://x.com/snwiki238337/status/2101181012894237034"}, {"ty": "生活娱乐", "tp": "健身与健康", "name": "Calisthenic Kyle", "handle": "CalisthenicKyle", "date": "2026-09-17 07:47", "ts": "2026-09-16T22:47:30.000Z", "text": "Mike Tyson Pushups are a great Total Body Builder… \n\nYou want to do these Explosively &amp; Controlled. https://x.com/CalisthenicKyle/status/2100355926608019688/video/1 https://twitter.com/Prince_Fynnd/status/2098718219749949597", "quotes": [{"type": "quoted", "text": "All men should do 200 Mike Tyson push ups, the change in one month will surprise you. 💪🔥 https://x.com/Prince_Fynnd/status/2098718219749949597/video/1", "who": "@?", "url": "https://x.com/i/status/2098718219749949597"}], "likes": 10140, "bm": 13225, "url": "https://x.com/CalisthenicKyle/status/2100355926608019688"}, {"ty": "Skill", "tp": "设计与 UI", "name": "Leon Lin", "handle": "LexnLin", "date": "2026-09-18 16:00", "ts": "2026-09-18T07:00:00.000Z", "text": "We built TasteSkill to help people create better frontends with AI.\n\nToday we're introducing TasteCode \n\nA desktop app for your coding agents, with a dedicated Design Mode that avoids slop and instead produces good UI\n\nIt is opensource and you can use it with your existing AI subscriptions!", "quotes": [], "likes": 1104, "bm": 1335, "url": "https://x.com/LexnLin/status/2100842256630534283"}, {"ty": "Skill", "tp": "编程与工程", "name": "Brais Moure", "handle": "MoureDev", "date": "2026-09-18 22:03", "ts": "2026-09-18T13:03:40.000Z", "text": "Cloudflare ha lanzado su propia skill completísima de auditorías de seguridad.\n\nEs la que utilizaban internamente en la empresa como sistema de detección de vulnerabilidades.\n\n→ https://github.com/cloudflare/security-audit-skill https://x.com/MoureDev/status/2100933777878884542/photo/1", "quotes": [], "likes": 2527, "bm": 3537, "url": "https://x.com/MoureDev/status/2100933777878884542"}, {"ty": "工具/项目", "tp": "桌面与效率软件", "name": "Geek", "handle": "geekbb", "date": "2026-09-18 21:08", "ts": "2026-09-18T12:08:25.000Z", "text": "在屏幕边缘固定一条可扩展的应用 dock，把应用、文件夹、文件和网站钉在一起，并用插件 tile 常驻显示时钟、系统、天气等动态信息。\n\nhttps://github.com/PleasePrompto/smabar https://x.com/geekbb/status/2100919870745612500/photo/1", "quotes": [], "likes": 13, "bm": 33, "url": "https://x.com/geekbb/status/2100919870745612500"}, {"ty": "Prompt", "tp": "编程与代码审查", "name": "踏雪寻仙", "handle": "TaXue2025", "date": "2026-09-18 22:57", "ts": "2026-09-18T13:57:00.000Z", "text": "/code-review 梳理一下这个XXX 的 skill ，保持优雅的工程质量、良好的可维护性和极佳的用户体验。以重新定义问题为导向，运用第一性原理与MECE原则、量化思维，驱动开发与测试的系统性优化。\n我最常用的是这个 skill  用来审核，还是很方便的，其出处是Cursor 后面被改名纳入grok-build 内置 skill当中 https://github.com/cursor/plugins/blob/main/thermos/skills/thermo-nuclear-code-quality-review/SKILL.md", "quotes": [{"type": "quoted", "text": "Q4：作为非工程师，怎么判断 Vibe Coding 出来的代码是否靠谱？比如 GPT 写的代码常有大量不必要的安全验证、过度防御。\n\n我的观点可能有争议，越是有编程经验的人可能越不认同，一年前的我也不会认同：不用太在意代码细节。整不整洁、有没有冗余、是否过度防御，都不是关键。\n\n你把自己当 QA，看三件事：\n1. 功能完不完整；\n2. 性能好不好，跑一下看 CPU 内存占用，我的 App 有段时间内存很高，就让 AI 去优化；\n3. 安全是最高优先级，SQL 注入、弱密码这类常识测试要做，拿不准找专业的人。\n\n其他实现细节没那么重要，就像高级语言编译成汇编你本来也看不懂，当黑盒就好。\n\n真正的重点在两头：\n\n一是拆分，拆成 Agent 刚好能处理的小模块，一次一个小模块，AI 的产出比绝大多数程序员的平均水平高；\n\n二是验收，功能、性能、安全把住，细节不用管。", "who": "@?", "url": "https://x.com/i/status/2100767963737727267"}], "likes": 39, "bm": 79, "url": "https://x.com/TaXue2025/status/2100947197332517017"}, {"ty": "工具/项目", "tp": "AI Agent 与编程工具", "name": "Shengzhe", "handle": "shengzheyao", "date": "2026-09-19 01:41", "ts": "2026-09-18T16:41:57.000Z", "text": "/remote-control in Antigravity CLI v1.2.6 is way too much fun!\n\nType /remote-control in any active CLI session (or launch `agy --remote-control`) and open the link in your browser or phone.\n\nBoth your terminal and the web UI stay in live sync. Prompt from the browser while grabbing coffee, watch your terminal stream it in real time, and reply from either screen whenever you want.\n\n`agy update` to try it out! Taking your terminal to the coffee line or the couch first? ☕️\n\nDemo: https://antigravity.google/assets/video/cli-remote-control-demo.mp4\nDocs: https://antigravity.google/docs/remote-control?tab=cli#tab-panel-101", "quotes": [], "likes": 378, "bm": 168, "url": "https://x.com/shengzheyao/status/2100988709558763938"}, {"ty": "深度文章", "tp": "纯链接（X 长文等）", "name": "Jason Young", "handle": "Jason_Young1231", "date": "2026-09-19 00:32", "ts": "2026-09-18T15:32:13.000Z", "text": "https://x.com/i/article/2100965705118318592", "quotes": [], "likes": 71, "bm": 96, "url": "https://x.com/Jason_Young1231/status/2100971161920368763"}, {"ty": "教程/学习", "tp": "语言与学习方法", "name": "Long | 科技与商业沉思录", "handle": "longgelongmei", "date": "2026-09-18 20:18", "ts": "2026-09-18T11:18:15.000Z", "text": "2020年，疫情被关在家中，偶然机会在B站看到了当时西安电子科技大学的于建国博士的学习观系列视频课程，彻底颠覆和重构了我对学习的认知，前几天在他的公众号看到出了纸质版书籍，立即下单，已经看了几页，非常值得阅读。尤其在当前的AI时代！ https://x.com/longgelongmei/status/2100907248222646729/photo/1", "quotes": [], "likes": 805, "bm": 836, "url": "https://x.com/longgelongmei/status/2100907248222646729"}, {"ty": "生活娱乐", "tp": "搞笑与影视", "name": "Tiraj", "handle": "tirajnews", "date": "2026-09-18 09:00", "ts": "2026-09-18T00:00:02.000Z", "text": "Güney Kore'de bir akvaryumda, mesai bitiminde oyuncaklarını toplayan su samuru yavruları, bakıcıları tarafından buzla ödüllendirildi. https://x.com/tirajnews/status/2100736567157354561/video/1", "quotes": [], "likes": 14666, "bm": 963, "url": "https://x.com/tirajnews/status/2100736567157354561"}, {"ty": "工具/项目", "tp": "桌面与效率软件", "name": "KeithMo", "handle": "HatarXx", "date": "2026-09-17 23:14", "ts": "2026-09-17T14:14:49.000Z", "text": "DeskPort\nMac OS/Linux(KDE)\niPad-only-client\n你的Mac mini 放在家里就好，完全不需要连接显示器，随时随地都可以直接进入Mac mini的桌面进行操作。\n也可以随时打开游戏电脑开启steam\nhttps://github.com/keithxc/deskport.git\n#DeskPort https://x.com/HatarXx/status/2100589295006621874/video/1", "quotes": [], "likes": 78, "bm": 132, "url": "https://x.com/HatarXx/status/2100589295006621874"}, {"ty": "工具/项目", "tp": "开发与基础设施", "name": "TechVerser", "handle": "realfxw", "date": "2026-09-18 14:20", "ts": "2026-09-18T05:20:02.000Z", "text": "Cloudflare 官方开源了一个堪称 Serverless 典范的神级项目：agentic-inbox —— 一个完全跑在 Cloudflare Workers 边缘网络上的自托管 AI 邮件客户端。\n\n以往自建邮件系统配置繁琐、运维头疼，而这个项目直接将邮件收发、数据存储、UI 界面与 AI Agent 全部打包进了 Cloudflare 生态：\n\n核心亮点\n\n纯边缘架构与数据隔离：接入 Cloudflare Email Routing 与 Email Service 搞定邮件收发；每个邮箱独立运行在一个 Durable Object (DO) 中，自带 SQLite 存储邮件，附件则无缝存入 R2，既实现了多租户隔离，又做到了免运维。\n\n原生 AI Email Agent：基于 Cloudflare Agents SDK 与 Workers AI 构建，内置 9 种邮件处理工具。收到新邮件时，Agent 会自动阅读上下文并起草回复，且严格保留人类确认环节，未经允许绝不私自发信。\n\n自带 MCP Server 支持：服务原生暴露 /mcp 端点，外部 AI 编程助手（如 Cursor、Claude Code）可以直接挂载该接口，跨工作流读取或处理邮件。\n\n生产级安全保障：默认集成 Cloudflare Access JWT 验证，防止个人邮箱系统暴露在公网，零配置实现企业级访问控制。\n\n技术栈速览\n\n前端：React 19、React Router v7、Tailwind CSS、TipTap 编辑器、Zustand\n\n后端与存储：Hono、Cloudflare Workers、Durable Objects (SQLite)、R2\n\nAI 驱动：Cloudflare Agents SDK (AIChatAgent)、AI SDK v6、Workers AI\n\n如果你正在探索 Workers 全家桶的工程化实践，或者想给自己的域名搭一个兼顾隐私与自动化能力的专属邮件中心，这个开源实现是极具参考价值的标杆案例。\n\n🔗 源码传送门：https://github.com/cloudflare/agentic-inbox", "quotes": [], "likes": 654, "bm": 1030, "url": "https://x.com/realfxw/status/2100817097563508967"}, {"ty": "深度文章", "tp": "纯链接（X 长文等）", "name": "Ivan Zhao", "handle": "ivanhzhao", "date": "2025-12-23 04:55", "ts": "2025-12-22T19:55:21.000Z", "text": "http://x.com/i/article/2003183155121963008", "quotes": [], "likes": 13521, "bm": 22171, "url": "https://x.com/ivanhzhao/status/2003192654545539400"}, {"ty": "Prompt", "tp": "沟通与写作", "name": "范凯说AI", "handle": "fankaishuoai", "date": "2026-09-18 00:05", "ts": "2026-09-17T15:05:45.000Z", "text": "如果你希望充分利用 ChatGPT 网页端的能力，其实不需要安装任何插件、 SKILL和软件，你只需要跟 Agent 说一句：\n\n打开浏览器，在 ChatGPT 的网页端， 把当前任务交给 ChatGPT，你再把它的执行结果汇总回来。\n\n任何 Agent 都可以这么搞，不仅限于 Codex。 https://x.com/fankaishuoai/status/2100602113361633495/photo/1", "quotes": [], "likes": 164, "bm": 253, "url": "https://x.com/fankaishuoai/status/2100602113361633495"}, {"ty": "工具/项目", "tp": "模型与 AI 应用", "name": "QuiverAI", "handle": "QuiverAI", "date": "2026-09-17 03:45", "ts": "2026-09-16T18:45:56.000Z", "text": "Introducing Arrow 2\n\nOur latest and most advanced models for generating precise, editable vector graphics.\n\nHigher quality. Faster outputs. Available now in App and API. https://x.com/QuiverAI/status/2100295136261349802/video/1", "quotes": [], "likes": 11166, "bm": 14078, "url": "https://x.com/QuiverAI/status/2100295136261349802"}, {"ty": "生活娱乐", "tp": "搞笑与影视", "name": "Maxinomics", "handle": "maxinomics", "date": "2026-09-14 05:43", "ts": "2026-09-13T20:43:14.000Z", "text": "China found something better than oil https://x.com/maxinomics/status/2099237489986912556/video/1", "quotes": [], "likes": 22510, "bm": 20005, "url": "https://x.com/maxinomics/status/2099237489986912556"}, {"ty": "工具/项目", "tp": "AI Agent 与编程工具", "name": "梭哈.AI", "handle": "SUOHA_AI", "date": "2026-09-18 01:51", "ts": "2026-09-17T16:51:59.000Z", "text": "Browser Use 接上 JEV 这速度太他妈吓人了吧？？\n\n过去大家看 GPT、Claude 操控浏览器，体验其实并不好，因为真的太慢了，中间还经常卡死...\n\n因为让大模型写一堆长篇大论去操作网页，本质上就是杀鸡用牛刀\n\n在网页上点按钮，本质上就是一个离散的多选题，根本不需要 AI 会写诗\n\nJEV 拿到 DOM 结构，以做分类题的速度毫秒级选出该点的元素，只有在需要打字输入时才偶尔回退给小模型\n\n黑客松冠军开发者 @gregpr07 刚刚拿 JEV 做了个开源的微型浏览器 Agent，让它自主打开网页查机票\n\n整个过程：\n• 耗时仅仅 7 秒\n• 成本只要 $0.0039（折合人民币不到 3 分钱）\n• 作者特意注明：演示视频是 1 倍速，没有任何加速剪辑\n\n这个老哥还开源了GitHub： https://github.com/browser-use/jev-ultrafast", "quotes": [{"type": "quoted", "text": "接下来请大家狠狠地关注JEV，真是惊艳啊\n\nMonad 团队的开发者 @jarrodwatts 把全网刷屏的 JEV，做成了一套纯 AI 原生的链上自动交易系统，并且把代码和前端全部开源了\n\n目前这个演示跑了14 个小时、亏了 300% 多🤣，但抛开实盘收益不谈，这套技术架构确实很惊艳\n\n过去大家拿 GPT、Claude 做自动化交易，最大的硬伤就是延迟和幻觉：\n\n你想让它判断个多空，它非得先在 API 里吐出 500 字的宏观研报，工程师还得苦哈哈写一堆正则从废话里抠 JSON 标签，等数据解析出来，盘口早插针爆仓了\n\n而 JEV 走了一条极其极端的路：它干脆把“说话”这个功能给物理阉割了\n\n它不生成任何人类可读的文字，只负责做纯粹的分类与概率预测：\n\n• 彻底干掉了 Tokenizer 瓶颈，输入每百万 Token 只要 4 分钱，输出直接免费\n\n• 推理速度比传统大模型快 20~200 倍，延迟压到毫秒级\n\n• 完美咬合 Monad 300ms 的出块节拍，行情进来秒级决策，直接打入 Kuru 链上订单簿撮合成交\n\nDemo 体验地址：https://jev-trader.vercel.app\n\nGithub 开源仓库：\nhttps://github.com/jarrodwatts/jev-trader", "who": "@SUOHA_AI", "url": "https://x.com/i/status/2100619720772694036"}], "likes": 1820, "bm": 2374, "url": "https://x.com/SUOHA_AI/status/2100628846240264348"}, {"ty": "工具/项目", "tp": "设计资源", "name": "Su", "handle": "Sukiea1008", "date": "2026-09-18 03:04", "ts": "2026-09-17T18:04:04.000Z", "text": "太牛了，那些我们说不清、道不明，称之为经验的审美\n\n这个网站全部都书面化了。变成可以附佣、可以学习的内容。\n\nhttps://github.mytemos.com/refactoring-ui-zh/", "quotes": [], "likes": 489, "bm": 1176, "url": "https://x.com/Sukiea1008/status/2100646987964219696"}, {"ty": "深度文章", "tp": "纯链接（X 长文等）", "name": "yibie", "handle": "yibie", "date": "2026-09-17 20:04", "ts": "2026-09-17T11:04:02.000Z", "text": "https://x.com/i/article/2100540824064847872", "quotes": [], "likes": 601, "bm": 1094, "url": "https://x.com/yibie/status/2100541283081023936"}, {"ty": "工具/项目", "tp": "AI Agent 与编程工具", "name": "Hamilton Ulmer", "handle": "hamiltonulmer", "date": "2026-09-17 08:45", "ts": "2026-09-16T23:45:38.000Z", "text": "I made a DuckDB extension where you can use @typesafeai 's Jev to do quick classification of rows in any csv/parquet file or duckdb table\n\nabout 10sec for 1k rows ~ better than using an LLM, way more ergonomic than a classifier\n\ngame-changing for data analysis! https://x.com/hamiltonulmer/status/2100370557405667768/photo/1", "quotes": [], "likes": 1484, "bm": 1195, "url": "https://x.com/hamiltonulmer/status/2100370557405667768"}, {"ty": "工具/项目", "tp": "桌面与效率软件", "name": "纯棉短裤", "handle": "gxjdian", "date": "2026-06-29 09:40", "ts": "2026-06-29T00:40:31.000Z", "text": "如果手里一堆eSIM，如何免手机收发短信&amp;保号办法⬇️\n\n在 Mac（Apple Silicon / Intel）上用 UTM 跑 Linux 虚拟机\n\n把大疆 4G 模块（EG25-G）伪装成移远 Quectel EC25 \n\n并部署 vohive 平台的完整步骤\n\nhttps://github.com/wlzh/dji-4g-vohive-mac", "quotes": [], "likes": 536, "bm": 999, "url": "https://x.com/gxjdian/status/2071393341250621787"}, {"ty": "工具/项目", "tp": "开发与基础设施", "name": "DuckDB", "handle": "duckdb", "date": "2026-09-17 07:49", "ts": "2026-09-16T22:49:59.000Z", "text": "More likely than not, you’ve been using AI tools such as Claude Code for day-to-day work.\n\nYou may have noticed that when AI needs to look at a data file, it makes use of Python, writes a small script, runs it, and then reads the output. It’s an approach that works most of the time, but it’s slow and not always accurate.\n\nThe duckdb-skills plugin gives Claude Code a growing number of skills that use the DuckDB CLI to read data files, run queries, convert formats, explore object storage, work with spatial data, search the documentation and recall earlier sessions.\n\nHere’s how you can get started with the new plugin: https://duckdb.org/2026/09/16/duckdb-skills?utm_source=x&utm_medium=social", "quotes": [], "likes": 324, "bm": 316, "url": "https://x.com/duckdb/status/2100356550699463165"}, {"ty": "工具/项目", "tp": "AI Agent 与编程工具", "name": "Meta for Developers", "handle": "MetaforDevs", "date": "2026-09-17 02:00", "ts": "2026-09-16T17:00:48.000Z", "text": "Muse Code from Meta is now available natively on Windows - no WSL required.\n\nIt’s PowerShell-fluent, sandboxed by default, native x64 and ARM64, and supports zero-admin install. Coming soon: intersession messaging.\n\nGet started: irm https://dev.meta.ai/install.ps1 | iex\n\nLearn more: https://bit.ly/3UZJhlA", "quotes": [], "likes": 1487, "bm": 514, "url": "https://x.com/MetaforDevs/status/2100268678583566691"}, {"ty": "工具/项目", "tp": "桌面与效率软件", "name": "Adib Hanna", "handle": "adibhanna", "date": "2026-09-16 01:21", "ts": "2026-09-15T16:21:13.000Z", "text": "ZenNotes 2.50.3 is out ✨\n\nMy favorite addition: hide the window decorations and give your notes more room. Especially nice for tiling setups like Hyprland.\n\nAlso: app links, Quick Capture over fullscreen macOS apps, and daily rollover fixes. https://x.com/adibhanna/status/2099896329912668392/video/1", "quotes": [], "likes": 28, "bm": 12, "url": "https://x.com/adibhanna/status/2099896329912668392"}, {"ty": "资讯", "tp": "模型与平台动态", "name": "Cosmo Du", "handle": "Answeror", "date": "2026-09-16 06:59", "ts": "2026-09-15T21:59:36.000Z", "text": "muse code subs update\n\ncontributor tier limits are now way way larger\nwe will reset usage today for all subs, everyone starts fresh https://x.com/Answeror/status/2099981484291690773/photo/1", "quotes": [], "likes": 722, "bm": 89, "url": "https://x.com/Answeror/status/2099981484291690773"}, {"ty": "工具/项目", "tp": "模型与 AI 应用", "name": "Tom Dörr", "handle": "tom_doerr", "date": "2026-09-16 21:13", "ts": "2026-09-16T12:13:08.000Z", "text": "Semantica ingests enterprise data to build context and knowledge graphs, enabling graph analytics and causal reasoning with full decision provenance.\n\nhttps://github.com/semantica-agi/semantica https://x.com/tom_doerr/status/2100196285873570001/photo/1", "quotes": [], "likes": 302, "bm": 427, "url": "https://x.com/tom_doerr/status/2100196285873570001"}, {"ty": "工具/项目", "tp": "设计资源", "name": "Enzo聊增长", "handle": "enzoflow0523", "date": "2026-09-16 12:45", "ts": "2026-09-16T03:45:42.000Z", "text": "给 AI 描述网页动效，终于不用只说“丝滑一点”了。\n我把 @AdrianPunk115 的动效词典上篇＋中篇做成了中文交互网站：\n46 个教学入口，237 个演示变体。\n能动手试，也能复制提示词、下载源码。\n磁吸按钮、视差滚动、文字解码……看到效果，再学它叫什么。\nhttps://vibe-dictionary.picamoji.com https://x.com/enzoflow0523/status/2100068583158026560/video/1 https://twitter.com/AdrianPunk115/status/2099772129478869309", "quotes": [{"type": "quoted", "text": "哈哈不好意思，因为内容太多，多出来一个中篇！ https://x.com/i/article/2099517692135034880", "who": "@AdrianPunk115", "url": "https://x.com/i/status/2099772129478869309"}], "likes": 49, "bm": 85, "url": "https://x.com/enzoflow0523/status/2100068583158026560"}, {"ty": "工具/项目", "tp": "模型与 AI 应用", "name": "张禹", "handle": "zyailive", "date": "2026-09-16 16:11", "ts": "2026-09-16T07:11:00.000Z", "text": "FileMarkd 正式开源！基于 MIT 协议，可自由使用、修改、分发和商用，无需额外授权。\r\rAI 驱动的文档转 Markdown 工具：PDF / Word / PPT / Excel / 图片 / EPUB / LaTeX / Jupyter 等 40+ 格式一键转干净 Markdown。自动识别文字、表格、公式和层级结构，带置信度评分、表格还原和智能页眉页脚剥离。\r\r完整可商用能力：登录、Stripe 订阅/积分、推广返利、推荐奖励、五语国际化、管理后台，Next.js 一键部署 Vercel。\r\r在线体验：https://filemarkd.com\r\rGitHub：https://github.com/ItusiAI/Open-FileMarkd", "quotes": [], "likes": 89, "bm": 138, "url": "https://x.com/zyailive/status/2100120247827341712"}, {"ty": "Prompt", "tp": "图像生成", "name": "Larus Canus", "handle": "MrLarus", "date": "2026-09-15 19:17", "ts": "2026-09-15T10:17:09.000Z", "text": "🤯 用 Images 2.5 做东方文化海报，大色域 + 微场景，高级感拉满！\n\n大片纸色负责构图，微型场景补足故事感，远看极简，近看全是细节\n\n1. 风起纸鸢，朱砂纸鸢 × 斜向飞升\n2. 竹间听琴，深绿纸层 × 月下雅集\n3. 秋日晒书，暖赭色域 × 晒书手作\n4. 溪上清集，青灰纸岸 × 留白成溪\n\n✨ 很适合文化活动、非遗手作、展览视觉和东方编辑设计参考！\n\nPrompt below 👇", "quotes": [{"type": "quoted", "text": "🤯 用 Image2 做极简风海报，大色域 + 微地景，氛围感十足！\n\n纸感色域压住主视觉，再用不同地景和构图方向拉开变化，远看极简，近看细节很丰富。\n\n1. 灯火沿江而下：陶土红 × 斜向江岸\n2. 风过芦洲：鼠尾草绿 × 横向风场\n3. 夜渡：深靛夜色 × 横向长桥\n4. 雪后见山门：冰蓝灰 × 负空间雪路\n\n🌟 很适合展览海报、文化视觉、书籍封面和东方编辑设计参考！\n\nPrompt below 👇", "who": "@MrLarus", "url": "https://x.com/i/status/2095508847376863251"}], "likes": 227, "bm": 184, "url": "https://x.com/MrLarus/status/2099804706801369428"}, {"ty": "Prompt", "tp": "图像生成", "name": "Larus Canus", "handle": "MrLarus", "date": "2026-09-15 19:17", "ts": "2026-09-15T10:17:52.000Z", "text": "提示词：\n\n【主题 / 活动名称】\n【主色域】\n【微场景】\n【文化元素】\n【标题文字】\n【辅助信息】\n【画幅比例】\n\n设计一张具有现代东方编辑美学的文化活动海报，核心视觉采用「大色域 + 微场景」的构成方式，并加入明显但克制的纸本拼贴与水彩材质语言。\n\n画面以大面积低饱和色块作为第一视觉主体，使用【主色域】建立强烈、完整的大形关系。色块可以通过撕纸、叠层、遮挡、围合、穿插、悬挂、斜向延伸或留白负空间构成山势、水岸、庭院、工坊、纸鸢、染布等抽象空间，但不要直接画成普通写实场景。远看首先看到清晰的大色域构图，缩略图状态下仍具有明显识别度。\n\n所有色块具有丰富真实的手工纸、水彩纸浆和矿物颜料质感，可见天然纸纤维、颜料沉积、轻微压痕、擦印、自然浓淡变化与不规则撕纸边缘。材质细腻丰富但保持干净完整，不做脏旧、黄斑、严重破损、强颗粒或廉价复古滤镜。整体呈现哑光、自然、有呼吸感的纸本触觉。\n\n在大片色域之间加入一个尺度非常小但内容完整的【微场景】。人物与道具整体只占画面约 2%–5%，人物正在真实地做一件事情，而不是站立摆拍。通过动作、器物和空间关系讲清一个小故事，例如放飞、弹琴、饮茶、拓印、晒书、染布、制陶等。人物服装自然克制，与整体文化主题统一，不抢夺大色域的第一视觉。\n\n微场景可以加入少量【文化元素】，但控制数量和信息密度。道具自然散落或参与人物动作，不做商品陈列，不堆满画面。可以设置一个面积很小的暖色节点、朱红印记、灯火、月亮或器物色彩作为点睛，通常控制在画面 1%–3%。\n\n排版采用克制的东方编辑设计语言。主标题【标题文字】使用精致的中文宋体、明朝体或具有出版感的现代字体，字号不要过大，保持充足留白，让文字成为第二视觉层级，而不是用巨大 Typography 压住画面。辅助英文、日期、地点和活动信息采用更小字号，形成清楚的信息层级。所有文字必须有真实意义，不使用 RANDOM、DESIGN、ART、STUDIO 等无意义占位词。\n\n构图避免机械居中和规则 PPT 网格，优先使用不对称布局、大面积留白、色块错位、前后遮挡和疏密反差。让画面形成“远看简洁、有大形；近看有材质、有场景、有故事”的阅读体验。\n\n整体风格应呈现现代东方文化海报、纸本拼贴、水彩材质、编辑设计与微型叙事融合的视觉效果，高级、自然、克制、有文化气质，同时具备真实专业海报的完成度。\n\n避免：书籍封面既视感、巨大标题、传统水墨画、普通国风插画、写实摄影背景、PPT式排版、商业广告感、元素堆砌、过度装饰、脏旧纸张、随机噪点、塑料感、3D CGI、玻璃材质、霓虹色、Logo、水印、编号、星芒装饰。", "quotes": [{"type": "replied_to", "text": "🤯 用 Images 2.5 做东方文化海报，大色域 + 微场景，高级感拉满！\n\n大片纸色负责构图，微型场景补足故事感，远看极简，近看全是细节\n\n1. 风起纸鸢，朱砂纸鸢 × 斜向飞升\n2. 竹间听琴，深绿纸层 × 月下雅集\n3. 秋日晒书，暖赭色域 × 晒书手作\n4. 溪上清集，青灰纸岸 × 留白成溪\n\n✨ 很适合文化活动、非遗手作、展览视觉和东方编辑设计参考！\n\nPrompt below 👇", "who": "@MrLarus", "url": "https://x.com/i/status/2099804706801369428"}], "likes": 24, "bm": 28, "url": "https://x.com/MrLarus/status/2099804888003662308"}, {"ty": "工具/项目", "tp": "开发与基础设施", "name": "Matt", "handle": "codermatt", "date": "2026-09-16 07:16", "ts": "2026-09-15T22:16:49.000Z", "text": "We rewrote Cellar in GPUI\n\nOpen-source database client for Mac.\n\n30x faster grid scroll. Half the memory.\n\nAnnoucing Cellar 1.0.0 🎉 https://x.com/codermatt/status/2099985815954923793/photo/1", "quotes": [], "likes": 328, "bm": 267, "url": "https://x.com/codermatt/status/2099985815954923793"}, {"ty": "工具/项目", "tp": "设计资源", "name": "Adrian Punk", "handle": "AdrianPunk115", "date": "2026-09-15 17:07", "ts": "2026-09-15T08:07:42.000Z", "text": "哈哈不好意思，因为内容太多，多出来一个中篇！ https://x.com/i/article/2099517692135034880", "quotes": [], "likes": 238, "bm": 441, "url": "https://x.com/AdrianPunk115/status/2099772129478869309"}, {"ty": "工具/项目", "tp": "AI Agent 与编程工具", "name": "Jakku | 彼岸樱 🇭🇰🏳️‍⚧️", "handle": "JakkuSakura", "date": "2026-09-11 13:54", "ts": "2026-09-11T04:54:45.000Z", "text": "预告一下，我们在做一个「屎山梳理工具」。\n\n它能让你清晰、准确地看到代码真正的逻辑和架构，同时把这些信息变成 AI 的编码约束。\n\n以后不是 AI 看见代码就乱改，而是先理解架构，再遵循架构写代码。\n\n目标：让 AI 帮你消灭屎山，而不是制造更大的屎山。 https://x.com/JakkuSakura/status/2098274023725838761/photo/1", "quotes": [], "likes": 41, "bm": 30, "url": "https://x.com/JakkuSakura/status/2098274023725838761"}, {"ty": "工具/项目", "tp": "AI Agent 与编程工具", "name": "TechVerser", "handle": "realfxw", "date": "2026-09-16 09:48", "ts": "2026-09-16T00:48:22.000Z", "text": "Jack Dorsey（前 Twitter CEO、Block 创始人）刚刚开源了一个重磅项目：用于构建“纯 AI Agent 协作运营团队”的底层通信框架 block/buzz。该项目在 GitHub 上迅速斩获超过 3 万颗星，采用完全开放的 Apache 2.0 协议。\n\n很多团队在尝试“多智能体（Multi-Agent）协作”时，最棘手的问题往往不是单体模型的能力，而是机器人之间散落的 Token 混乱、上下文孤岛与失控风险。Buzz 将整个沟通系统重构为一个蜂巢网络（Hive Mind）：\n\n将 Agent 视为团队正式成员：无需为每个脚本写复杂的黏合层，直接像邀请同事一样把 AI 智能体拉入对应频道。\n\n精细化权限与审计追踪：为每个 Agent 配置独立的访问范围与操作身份，支持检索数月历史记录与行动凭据，拒绝黑盒式自动化。\n\n统一的工作流底座：在同一套自建服务内无缝串联 Git 代码库、频道讨论、全局搜索与自动化任务，兼顾自主执行与人机协同。\n\n极简部署三步法\n\n克隆仓库：拉取开源项目代码并在私有环境部署。\n\n启动通信中枢：一键跑起承载频道、搜索与自动化调度的独立服务器。\n\n分配角色与权限：按业务需求接入 Agent（如 Bug 分流、代码审查、运营支持），绑定专属密钥并设定干预边界。\n\n给实践者的落地建议\n\n千万不要一开始就盲目追求“100% 全无人托管”。最务实的路径是做受控的最小可行性验证（MVP）：实时监测单项任务的 Token 开销与人工接管率，并在权限告警或异常时具备一键暂停的兜底机制。比起市面上各类按席位每月收费数十美元的闭源包装工具，这套无限制的开源底层架构，正在让原本类似玩具的多智能体实验变成真正可落地的组织运作原型。\n\n直达链接：https://github.com/block/buzz", "quotes": [], "likes": 62, "bm": 129, "url": "https://x.com/realfxw/status/2100023956002517273"}, {"ty": "深度文章", "tp": "纯链接（X 长文等）", "name": "Viv", "handle": "Vtrivedy10", "date": "2026-07-23 02:04", "ts": "2026-07-22T17:04:58.000Z", "text": "http://x.com/i/article/2079797742168150017", "quotes": [], "likes": 897, "bm": 2370, "url": "https://x.com/Vtrivedy10/status/2079976006644072796"}, {"ty": "Skill", "tp": "设计与 UI", "name": "Su", "handle": "Sukiea1008", "date": "2026-09-16 02:20", "ts": "2026-09-15T17:20:44.000Z", "text": "非常牛逼的一篇文章\n\n就这么说吧，光这篇文章你都可以把它拿去喂 AI 炼个 4A 广告公司的审美 Skill 出来。\n\n不含风格化审美内容，但正因如此易于迁移\n\n不说了我已经完成第一步把原文和图片完整复制下来了 搓 skill 去了 https://x.com/Sukiea1008/status/2099911306338091289/photo/1 https://twitter.com/Sisymithus/status/2099827668686659989", "quotes": [{"type": "quoted", "text": "https://x.com/i/article/2099654486855925760", "who": "@Sisymithus", "url": "https://x.com/i/status/2099827668686659989"}], "likes": 507, "bm": 815, "url": "https://x.com/Sukiea1008/status/2099911306338091289"}, {"ty": "深度文章", "tp": "纯链接（X 长文等）", "name": "西西米修斯", "handle": "Sisymithus", "date": "2026-09-15 20:48", "ts": "2026-09-15T11:48:23.000Z", "text": "https://x.com/i/article/2099654486855925760", "quotes": [], "likes": 339, "bm": 733, "url": "https://x.com/Sisymithus/status/2099827668686659989"}, {"ty": "工具/项目", "tp": "模型与 AI 应用", "name": "Diogo Almeida", "handle": "CompleteSkeptic", "date": "2026-09-16 03:17", "ts": "2026-09-15T18:17:54.000Z", "text": "Extraordinary claims require extraordinary evidence so check out our release blog for more technical info: https://typesafe.ai/blog/introducing-system-one-models-and-jev\n\nJoin our waitlist for early access: https://typesafe.ai/\n\nHave technical chats and meme with us on Discord (rumors are good memers skip the line): https://discord.gg/WUujKYBp8s\n\nWe are so pumped this is in the hands of developers now, and we are just getting started!!!", "quotes": [{"type": "replied_to", "text": "Game: race from one Wikipedia page to another using only links\n\nChallenge: choosing between hundreds to thousands of links\n\nShows not just intelligence-per-second, but also the compounding benefits of not hallucinating with high-cardinality choices https://x.com/CompleteSkeptic/status/2099925688925184171/video/1", "who": "@CompleteSkeptic", "url": "https://x.com/i/status/2099925688925184171"}], "likes": 3885, "bm": 3114, "url": "https://x.com/CompleteSkeptic/status/2099925690682630371"}, {"ty": "工具/项目", "tp": "模型与 AI 应用", "name": "Evan (Yifeng) Wang", "handle": "ewind_dev", "date": "2026-09-16 07:59", "ts": "2026-09-15T22:59:59.000Z", "text": "太牛逼了，这个相当于有前沿智能的纯分类器，凡是需要理解输入然后纯粹做判断的场景都可以换成它，极快极便宜，0 输出 token……\n\n这样至少在 workflow 编排和 E2E 测试里都会特别有用呀\n\n以及 TypeSafe 这公司名字真有 taste 啊！🌝 https://twitter.com/completeskeptic/status/2099925682726002904", "quotes": [{"type": "quoted", "text": "After co-inventing ChatGPT, I kept asking myself: why have superhuman chat models not led to AGI?\n\nI’ve spent the last 2 years in stealth building a new way to train models (RLCD), and a new type of frontier AI model that we are releasing today: Jev\n\n• 20-200x faster\n• 40-400x cheaper (w/ output tokens free)\n• Frontier composable intelligence optimized for decisions\n\nAFAICT the shortest path to AI-based economic revolution", "who": "@CompleteSkeptic", "url": "https://x.com/i/status/2099925682726002904"}], "likes": 185, "bm": 191, "url": "https://x.com/ewind_dev/status/2099996679848214919"}, {"ty": "工具/项目", "tp": "桌面与效率软件", "name": "Lex Tang", "handle": "lexrus", "date": "2026-09-15 09:58", "ts": "2026-09-15T00:58:36.000Z", "text": "Tinycast: 120MB\nRaycast: 291+280+195+25+10+... 🧐\nhttps://github.com/abue-ammar/tinycast\nI'm not that worried about the memory usage. But if the free, open-source Tinycast already has 90% of the features I need, and it requires less memory, why would I pay for Raycast? https://x.com/lexrus/status/2099664144203133238/photo/1", "quotes": [], "likes": 414, "bm": 306, "url": "https://x.com/lexrus/status/2099664144203133238"}, {"ty": "工具/项目", "tp": "设计资源", "name": "赵纯想", "handle": "chunxiangai", "date": "2026-09-15 18:56", "ts": "2026-09-15T09:56:32.000Z", "text": "不要再用 “弹窗”、“下拉菜单”、“闪光加载”、“菜单栏”来和 AI 交流 UIUX 开发了。有时候，命名正确，交流更顺畅，更容易一发命中。你会第一时间看到更符合心意的东西。这个网站可以帮助你学习这些经典组件的名称。\nhttps://component.gallery/ https://x.com/chunxiangai/status/2099799518011343144/photo/1", "quotes": [], "likes": 758, "bm": 1144, "url": "https://x.com/chunxiangai/status/2099799518011343144"}, {"ty": "资讯", "tp": "模型与平台动态", "name": "Qoder", "handle": "qoder_ai_ide", "date": "2026-09-15 14:30", "ts": "2026-09-15T05:30:50.000Z", "text": "Yesterday's teaser? Meet Sonus. 🔑\n\nThe SOTA daily reset is live. 500 Credits/day. 5 days. Sep 15–19.\n\nClaim at 12:00 (UTC+8) daily on Qoder IDE, CLI, Desktop, or JetBrains. Expires next day. No rollover. No makeup.\n\nCredits are ready. Bring the hard ones.→https://docs.qoder.com/events/sotafree", "quotes": [], "likes": 69, "bm": 36, "url": "https://x.com/qoder_ai_ide/status/2099732653343944905"}, {"ty": "工具/项目", "tp": "AI Agent 与编程工具", "name": "ZEN", "handle": "supezen", "date": "2026-09-15 18:39", "ts": "2026-09-15T09:39:43.000Z", "text": "我终于可以在一个 Pi 看板上同时开发多个项目\n\n添加了全部 AI 订阅，连上了mac笔记本和吃灰的云主机，让它们物尽其用\n\n开发效率拉满，资源使用率也拉满了哈哈 https://x.com/supezen/status/2099795288076743160/photo/1", "quotes": [], "likes": 67, "bm": 85, "url": "https://x.com/supezen/status/2099795288076743160"}, {"ty": "工具/项目", "tp": "模型与 AI 应用", "name": "Atria ASI", "handle": "AtriaASI", "date": "2026-09-14 22:30", "ts": "2026-09-14T13:30:14.000Z", "text": "Introducing Atria Dawn Preview:\nFrom Research Questions to Verifiable Results.\n\nAtria Dawn Preview is an agentic foundation model built for long-horizon tasks, helping researchers and engineers turn open-ended questions into executable, verifiable, and reproducible outcomes.\n\nExplore Atria Dawn Preview:\n🌐 Website: https://atria-asi.ai/\n💻 GitHub: https://github.com/atria-asi/Atria-Dawn-Preview\n🤗 Hugging Face: https://huggingface.co/internlm/Atria-Dawn-Preview\n🤖 ModelScope: https://www.modelscope.cn/models/Shanghai_AI_Laboratory/Atria-Dawn-Preview\n🚀 Try Atria:\nEN：https://api.atria-asi.ai/\nZH：https://discovery.intern-ai.org.cn/token-plan/home?tabIndex=0", "quotes": [], "likes": 2328, "bm": 1213, "url": "https://x.com/AtriaASI/status/2099490911822794901"}, {"ty": "深度文章", "tp": "AI 编程实践", "name": "Gangqiang Yao", "handle": "yaogangqiang", "date": "2026-09-15 16:09", "ts": "2026-09-15T07:09:01.000Z", "text": "上一条说，只靠测试不能保证软件质量。这条先聊也应该怎么写测试，因为这是基础。下次聊关键设计，以及 review 应该看什么。\n\n针对业务项目，我的理解大概是这么几条：\n\n1 测试行为，不测试实现。比如重复下单不会重复扣款，而不是某个方法调用了几次。业务没变，重构一下测试就碎一地，那多半写错了。AI 特别容易写这种测试。\n\n2 用 BDD，先写验收场景，再写代码。测试描述统一用 user 开头，用 Given / When / Then 描述，用户和 PM 也能看懂。别让 AI 写完代码，再照着自己的实现证明自己没错。\n\n3 禁止 mock。Redis、PostgreSQL 能用真的就用真的，外部系统不好接就注入 fake，但要校验它和真实系统的契约。时间逻辑用 fake timer，别 sleep 几秒再祈祷。AI 真的太喜欢随手 mock 了。\n\n4 我倾向大部分写 E2E，从用户入口走到可见结果，外部依赖可以 fake，实在不合适再写其他测试。测试多了就分级，按改动和依赖关系精准测试，定期完整跑。别改两行代码，等 CI 半天。\n\n5 前面做好了，再看分支覆盖率，先定个 90%。但重点是剩下的为什么没测，尤其是失败路径，别让 AI 为了凑数字再写一堆垃圾测试。\n\n6 前边的规则尽量都写成 lint", "quotes": [{"type": "quoted", "text": "随着 vibe coding 产出大量代码，大部分项目质量并没有提高。整个软件研发历史里，写代码一直是最容易的环节，有了 AI 之后，只是让这个环节变得更容易了。\n\n我甚至听到某创业公司的人因为 bug 太多，跟我说：「我觉得可能人肉写写代码，稍微长期来看，速度更快，因为现在天天修 bug。」\n\n有很多人说：那你让 AI 写测试啊。 现实是，如果不做任何调教，AI 写出来的全都是充满 mock 的、测试实现细节的脆弱测试，而不是验证行为的测试。此外更残酷的是：即使你教会了 AI 写对测试，照样不能保证软件的质量。\n\n因为测试从来不是高质量软件的关键，Quality is designed in, not tested in.", "who": "@yaogangqiang", "url": "https://x.com/i/status/2099403258045538435"}], "likes": 326, "bm": 537, "url": "https://x.com/yaogangqiang/status/2099757363519709283"}, {"ty": "深度文章", "tp": "纯链接（X 长文等）", "name": "yibie", "handle": "yibie", "date": "2026-09-14 20:23", "ts": "2026-09-14T11:23:49.000Z", "text": "https://x.com/i/article/2099458759722508288", "quotes": [], "likes": 45, "bm": 102, "url": "https://x.com/yibie/status/2099459095153594692"}, {"ty": "工具/项目", "tp": "AI Agent 与编程工具", "name": "shadcn", "handle": "shadcn", "date": "2026-09-15 01:22", "ts": "2026-09-14T16:22:22.000Z", "text": "Introducing shadcn/lint. An agent-first linter for Tailwind design systems.\n\nYou define what’s allowed. When an agent breaks a rule, the error explains what’s wrong and how to fix it using your components, variants and theme.\n\nThere’s a lot you can do with this. Let me show you ↓\n\nhttps://github.com/shadcn-ui/lint", "quotes": [], "likes": 6578, "bm": 6526, "url": "https://x.com/shadcn/status/2099534231114314145"}, {"ty": "工具/项目", "tp": "模型与 AI 应用", "name": "徹言", "handle": "iamcheyan", "date": "2026-09-14 22:16", "ts": "2026-09-14T13:16:01.000Z", "text": "一个挺有意思的输入法，RUST的，内置了一个 50 MB 级别的 decoder-only Transformer 语言模型，作为本地的候选词重排序器：拼音/双拼输入 → 生成候选词 → 本地 Transformer 结合上下文给候选打分 → 重新排列候选顺序。\nhttps://qingjian.app https://x.com/iamcheyan/status/2099487333288661119/photo/1", "quotes": [], "likes": 296, "bm": 401, "url": "https://x.com/iamcheyan/status/2099487333288661119"}, {"ty": "资讯", "tp": "模型与平台动态", "name": "Gorden Sun", "handle": "Gorden_Sun", "date": "2026-09-14 09:37", "ts": "2026-09-14T00:37:07.000Z", "text": "本月最值得订阅的是20美元的Devin Pro，SWE2 30天免费用，能力比Grok 4.6强。", "quotes": [], "likes": 38, "bm": 22, "url": "https://x.com/Gorden_Sun/status/2099296351939080666"}, {"ty": "工具/项目", "tp": "AI Agent 与编程工具", "name": "idoubi", "handle": "idoubicc", "date": "2026-09-14 13:44", "ts": "2026-09-14T04:44:29.000Z", "text": "https://termany.sh ships Bot Mode — put your local agents together and let them collaborate on tasks.\n\nCheck it out.👇 https://x.com/idoubicc/status/2099358601731256371/video/1", "quotes": [], "likes": 75, "bm": 121, "url": "https://x.com/idoubicc/status/2099358601731256371"}, {"ty": "深度文章", "tp": "AI 编程实践", "name": "lauren", "handle": "poteto", "date": "2026-09-10 02:02", "ts": "2026-09-09T17:02:13.000Z", "text": "Part 2 is here! Let's learn the art of supervising someone smarter than you. https://x.com/i/article/2094940651607715840", "quotes": [], "likes": 6040, "bm": 11438, "url": "https://x.com/poteto/status/2097732320606507506"}, {"ty": "工具/项目", "tp": "模型与 AI 应用", "name": "WeChat", "handle": "Weixin_WeChat", "date": "2026-09-14 19:29", "ts": "2026-09-14T10:29:00.000Z", "text": "Put your team’s knowledge to work.\n\nDeveloped by Tencent’s Weixin team, WeKnora is an open-source, LLM-powered knowledge framework built for enterprise-grade document understanding, semantic retrieval, and autonomous reasoning.\n\nBuild assistants that find answers in your docs, show their sources and use skills to create files you can preview and download.\n\nKeep useful context across chats with opt-in long-term memory. You approve suggested memories before they’re used. Self-host it and run skills in a sandbox with network limits you set.\n\nExplore WeKnora: https://github.com/Tencent/WeKnora\n\nHave a project in mind? Join our community to share ideas and build with us: https://github.com/Tencent/WeKnora/issues/274", "quotes": [], "likes": 552, "bm": 720, "url": "https://x.com/Weixin_WeChat/status/2099445303934112180"}, {"ty": "深度文章", "tp": "纯链接（X 长文等）", "name": "yibie", "handle": "yibie", "date": "2026-09-14 20:21", "ts": "2026-09-14T11:21:49.000Z", "text": "https://x.com/i/article/2099458242338258947", "quotes": [], "likes": 115, "bm": 252, "url": "https://x.com/yibie/status/2099458595150528543"}, {"ty": "工具/项目", "tp": "设计资源", "name": "chengyongru", "handle": "chengyongru", "date": "2026-09-14 11:27", "ts": "2026-09-14T02:27:45.000Z", "text": "ok, 世界上最好的design skill， 就是这个（我这算说个暴论吗？）\n\n`https://developer.apple.com/design/`", "quotes": [], "likes": 2131, "bm": 3604, "url": "https://x.com/chengyongru/status/2099324192235868478"}, {"ty": "工具/项目", "tp": "AI Agent 与编程工具", "name": "Jayesh Shinde", "handle": "jayesssssh", "date": "2026-09-14 02:44", "ts": "2026-09-13T17:44:30.000Z", "text": "https://px0.ai is really fast.\n\nThe way I'm gonna use it is pretty simple, quickly checking files without opening the actual IDE.\n\nEspecially files like pubspec.yaml and package.json.\n\nthanks @arpit_bhayani !! https://x.com/jayesssssh/status/2099192509897556236/photo/1", "quotes": [], "likes": 275, "bm": 166, "url": "https://x.com/jayesssssh/status/2099192509897556236"}, {"ty": "工具/项目", "tp": "AI Agent 与编程工具", "name": "Rahul", "handle": "sairahul1", "date": "2026-09-13 20:41", "ts": "2026-09-13T11:41:00.000Z", "text": "Codex tip: A cost-efficient DeepSeek V4.1 Flash agents, orchestrated by Astra.\n\nAstra handles planning and review. Flash handles almost everything else at a fraction of the cost.\n\nHand this to Codex to set it up 👇 https://x.com/sairahul1/status/2099101032529957226/photo/1 https://twitter.com/sairahul1/status/2098699529487028643", "quotes": [{"type": "quoted", "text": "DeepSeek just launched V4.1 Flash.\n\n98% of GPT-6 Astra’s score at 1.4% of the cost.\n\nWith GPT-6 Astra + DeepSeek V4.1 Flash, you can build an AI workforce that works 24/7 for around $50/month.\n\nFull setup: https://x.com/i/article/2098666092315222016", "who": "@sairahul1", "url": "https://x.com/i/status/2098699529487028643"}], "likes": 1063, "bm": 1568, "url": "https://x.com/sairahul1/status/2099101032529957226"}, {"ty": "工具/项目", "tp": "设计资源", "name": "沐阳", "handle": "yyyole", "date": "2026-09-14 15:21", "ts": "2026-09-14T06:21:47.000Z", "text": "以前怎么没发现这个栏目！\nhttps://developer.apple.com/design/", "quotes": [{"type": "replied_to", "text": "设计标杆！苹果官方教程的含金量！！！\n不用到处复刻“苹果风设计”了！\n苹果官方直接把设计指南、模板、工具和视频教程都整理好了，有适合小白的，也有适合专业开发者的，真的太全面了！！\n\n里面有个视频教程叫《设计基础：从创意到界面》，从信息结构、导航、内容，一直讲到视觉设计。\n其中提到一个特别实用的思路：\n用户打开你的 App，应该需要很容易搞清楚：自己现在在哪、这里能做什么、接下来能去哪。\n这几个问题看起来很简单，像是基本功，但其实很多APP、网页，都没有做到位。\n\n要么就是标题层级有点乱，要么就是功能入口藏太深。\n苹果直接用一个管理黑胶唱片的 App 案例，把这些问题讲清楚。\n更贴心的是，学完还有官方素材提供，可以接着练！！\n此外，还提供了 Figma、Sketch 的界面套件，还有 App 图标模板、颜色指南、字体等资源。\n\n以后，用AI做苹果风格APP会更简单了，直接把功能需求说清楚，然后让它参考 Apple 官方设计指南，自己选择合适的组件。\n另外，官网还整理了 Liquid Glass、新设计系统和 App 图标的讲解视频，SF Symbols 符号库、Icon Composer 图标工具也都有。\n\n链接放下面了，建议收藏，有时间学习学习！\n不做产品，就算提高审美，也是有必要的！", "who": "@yyyole", "url": "https://x.com/i/status/2099383087020839254"}], "likes": 21, "bm": 33, "url": "https://x.com/yyyole/status/2099383089898385731"}, {"ty": "工具/项目", "tp": "设计资源", "name": "沐阳", "handle": "yyyole", "date": "2026-09-14 15:21", "ts": "2026-09-14T06:21:47.000Z", "text": "设计标杆！苹果官方教程的含金量！！！\n不用到处复刻“苹果风设计”了！\n苹果官方直接把设计指南、模板、工具和视频教程都整理好了，有适合小白的，也有适合专业开发者的，真的太全面了！！\n\n里面有个视频教程叫《设计基础：从创意到界面》，从信息结构、导航、内容，一直讲到视觉设计。\n其中提到一个特别实用的思路：\n用户打开你的 App，应该需要很容易搞清楚：自己现在在哪、这里能做什么、接下来能去哪。\n这几个问题看起来很简单，像是基本功，但其实很多APP、网页，都没有做到位。\n\n要么就是标题层级有点乱，要么就是功能入口藏太深。\n苹果直接用一个管理黑胶唱片的 App 案例，把这些问题讲清楚。\n更贴心的是，学完还有官方素材提供，可以接着练！！\n此外，还提供了 Figma、Sketch 的界面套件，还有 App 图标模板、颜色指南、字体等资源。\n\n以后，用AI做苹果风格APP会更简单了，直接把功能需求说清楚，然后让它参考 Apple 官方设计指南，自己选择合适的组件。\n另外，官网还整理了 Liquid Glass、新设计系统和 App 图标的讲解视频，SF Symbols 符号库、Icon Composer 图标工具也都有。\n\n链接放下面了，建议收藏，有时间学习学习！\n不做产品，就算提高审美，也是有必要的！", "quotes": [], "likes": 299, "bm": 307, "url": "https://x.com/yyyole/status/2099383087020839254"}, {"ty": "Skill", "tp": "编程与工程", "name": "karminski-牙医", "handle": "karminski3", "date": "2026-09-14 15:22", "ts": "2026-09-14T06:22:54.000Z", "text": "传统文档大多数时间只是【代码】或【数据】其中的一种. 而skill能实现代码与数据同构的特性.\n\n比如写一个处理发票的skill, 大部分人只会写:\n\n\"帮我按照下面的格式提取发票日期, 金额\"\n\n万一遇到个skill中没有的格式就炸了. 这其实就是把skill写成了文档.  \n\n而理解了skill的同构性就能玩元编程: \n\n\"分析这张发票的排版拓扑和命名惯例, 不要直接输出 JSON 结果, 动态生成一个专用的skill(Micro-Skill)并运行它来提取配置, 包括:\n哪些字段可以通过正则表达式确定性提取(编译为传统代码).\n哪些歧义字段需要 LLM 提取, 并生成一份不超过 50 字的超精简 Prompt.\n生成严格验证该格式的 Pydantic 校验类(简单harness, 类似含税金额 == 不含税金额 + 税额). \"\n\n这样这个skill只要模型够聪明就不用管了.", "quotes": [{"type": "quoted", "text": "再次发问：所谓的 #skill 和一个认真写清楚的 #markdown文档 有啥区别呀？", "who": "@?", "url": "https://x.com/i/status/2099368418839576806"}], "likes": 126, "bm": 110, "url": "https://x.com/karminski3/status/2099383368999965122"}, {"ty": "Prompt", "tp": "沟通与写作", "name": "WeZZard", "handle": "realWeZZard", "date": "2026-09-14 12:53", "ts": "2026-09-14T03:53:32.000Z", "text": "最近使用 AI 都在有意识地要求自己像一个管理者而并不是高级工程师，目前有些心得可以分享一下：\n\n今天设计一个方案时牵扯到一些技术细节。把最关键的部分讨论完后还有些剩余问题，于是我问了下\n\n「剩下还有什么没决定的问题？」\n\n这是非常经典的 AI 管理 bad case 起手式 -- AI 永远比你更了解技术。所以，除非你是这个领域的专家，或者真的在挑战一个技术细节问题，否则，AI 的回答大概率你看不懂或者不想看 (P1)。另外，如果相关领域的问题你真的不熟悉，那一个一个学习完然后掌握，也不是一个有效的管理手段。\n\n于是我马上将重点引向了这些「没决定的问题」到底是在关心什么 (P1 下半部分 + P2 上半部分)。\n\n但是这还不够，AI 的回答还是不够结构化，看起来还是太费眼睛了。于是我继续细化了回答所需的格式 (P2 下半部分)。\n\n这下 AI 终于给出了简单易读、我又好判断的问题。\n\n所以加起来可以总结为以下公式：\n\n关注目的 + 约束输出格式\n\n我们也可以看到这个会比较类似于所谓 context over control 以及日常公司经营中的有格式的汇报。\n\n而这个方法能成是因为目前的模型能力在智能水平上其实已经远超了个人，我们相信在 context 给足的情况下，AI 可以做出比人更好的决策。这样做能让 AI 更高效地 drive 你，而不是停留在一个 babysitter。", "quotes": [], "likes": 52, "bm": 62, "url": "https://x.com/realWeZZard/status/2099345781404885174"}, {"ty": "工具/项目", "tp": "设计资源", "name": "𝐍𝐨𝐚𝐡", "handle": "noahelhadedy", "date": "2026-09-13 14:59", "ts": "2026-09-13T05:59:55.000Z", "text": "DESIGN.md Websites.\n\n1. https://typeui.sh\n2. https://designmd.me\n3. https://designmd.supply\n4. https://styles.refero.design\n5. getdesign.md\n6. https://collectui.com\n7. https://designmd-store.com\n\nWhat did I miss? https://x.com/noahelhadedy/status/2099015197302071364/video/1", "quotes": [], "likes": 1806, "bm": 3199, "url": "https://x.com/noahelhadedy/status/2099015197302071364"}, {"ty": "工具/项目", "tp": "AI Agent 与编程工具", "name": "Arpit Bhayani", "handle": "arpit_bhayani", "date": "2026-09-13 22:14", "ts": "2026-09-13T13:14:06.000Z", "text": "I hate when VS Code eats up 1GB and takes 7 seconds to start, so I built https://px0.ai, which does the same things in 20MB of RAM and starts in 1ms.\n\nThe last time we edited code in an IDE was in 2025, so our IDEs should become read-only but fast.\n\nGive it a shot.", "quotes": [], "likes": 4118, "bm": 1890, "url": "https://x.com/arpit_bhayani/status/2099124464365756672"}, {"ty": "深度文章", "tp": "AI 编程实践", "name": "Viking", "handle": "vikingmute", "date": "2026-09-13 21:33", "ts": "2026-09-13T12:33:53.000Z", "text": "为啥不用 agent 做？脚本自己写吗？那要多大工作量，可以看下之前写的我做 TinyShip 的 e2e 的经验：\n\nhttps://vikingz.me/ai-e2e/\n\nAI 视觉流程确认用 agent-browser，节省上下文和 Token，都是使用语义化 精简的 Accessibility Tree  简洁引用，别直接用传统的 Playwright 或 Puppeteer \n\n写新特性的时候核心思路是先想清楚要测什么，再写代码，然后用 agent-browser 走一遍视觉确认，最后写 Playwright 测试。文章里面写的很清楚的，感兴趣的朋友可以看一下，TinyShip http://tinyship.cn 后面的十几次迭代都是这个流程，我觉得还是很好用的。", "quotes": [], "likes": 138, "bm": 266, "url": "https://x.com/vikingmute/status/2099114341165629549"}, {"ty": "资讯", "tp": "福利与优惠", "name": "Justin3go", "handle": "Justin1024go", "date": "2026-09-13 17:55", "ts": "2026-09-13T08:55:02.000Z", "text": "看到了不少人推荐command code，感谢大家 https://x.com/Justin1024go/status/2099059265906610307/photo/1 https://twitter.com/Justin1024go/status/2098820243993059507", "quotes": [{"type": "quoted", "text": "除了opencode go，还有哪些计划能买到大量的deepseek的token吗，有推友用过好用的计划推荐吗", "who": "@Justin1024go", "url": "https://x.com/i/status/2098820243993059507"}], "likes": 117, "bm": 92, "url": "https://x.com/Justin1024go/status/2099059265906610307"}, {"ty": "资讯", "tp": "模型与平台动态", "name": "indigo", "handle": "indigox", "date": "2026-09-13 14:11", "ts": "2026-09-13T05:11:23.000Z", "text": "给 Grok Bot 的虚拟电脑装上了 tailscale！现在它加入了我的本地 Agent Device Network 了🛜 这台虚拟机不错，8 核 Intel Xeon，16G 内存、128G 硬盘，可以当一个低配版 mac mini 来用。你所有的 Grok Bots 都共享这一台虚拟机和 Workspace 目录，但他们有自己的 Profile 和配置\n\n这样可以直接把它当 Web server 用，让 Grok Bot 写程序做可以交互的 Web App，你就可以在接入了 tailscale 的任何设备上访问；也可以让 Grok Bot 使用 Claude Fable 还有 GPT-6 Astra 模型，通过 API 就行（烧钱🔥）；我现在让我的“主编” Bot 用 Gemini 润色写作，非常溜😁", "quotes": [], "likes": 87, "bm": 112, "url": "https://x.com/indigox/status/2099002981702377570"}, {"ty": "深度文章", "tp": "纯链接（X 长文等）", "name": "Chasen", "handle": "chasen_liao", "date": "2026-08-27 22:11", "ts": "2026-08-27T13:11:07.000Z", "text": "https://x.com/i/article/2090655519673626624", "quotes": [], "likes": 683, "bm": 1406, "url": "https://x.com/chasen_liao/status/2092963119337476137"}, {"ty": "深度文章", "tp": "设计", "name": "Viking", "handle": "vikingmute", "date": "2026-09-13 23:04", "ts": "2026-09-13T14:04:30.000Z", "text": "假如是工程师的想快速提升一下的话 可以看 tailwind.css 作者的 《Refactoring UI》那本书 ，里面大多数都是实操，里面图很多，半天能看完，做做笔记几天就能差不多学习理解完，算是一个捷径：https://www.goodreads.com/en/book/show/43190966-refactoring-ui\n如果想整体提升设计的认知或者对美的感知，那么可以看原推的这本。 https://twitter.com/xiqingongzi/status/2098985621360640068", "quotes": [{"type": "quoted", "text": "昨天看到又有人在推荐设计的 Skill。诚然，设计 Skill 是有用的；但是，如果你想做出来一个好的东西，至少看起来不丑气的东西。请先看这本书。\nhttps://www.ituring.com.cn/book/1757\n这本书我是看的实体书。\n\n你先看一遍，至少知道什么是「美」；什么是「不美」，再看去很多设计，用很多 Skill，才是「如有神助」。不然，拼接一堆 Skill，也不过是东施效颦，很丑。", "who": "@?", "url": "https://x.com/i/status/2098985621360640068"}], "likes": 539, "bm": 924, "url": "https://x.com/vikingmute/status/2099137148071055449"}, {"ty": "工具/项目", "tp": "桌面与效率软件", "name": "Joel", "handle": "joelbqz", "date": "2026-09-13 14:07", "ts": "2026-09-13T05:07:31.000Z", "text": "I know a lightweight and open source alternative to Obsidian\n\n- it's fast\n- has a proper sidebar\n- works with local files\n \nhttps://writer.computer https://x.com/joelbqz/status/2099002011089768478/video/1 https://twitter.com/yitong/status/2098848727196979677", "quotes": [{"type": "quoted", "text": "It's crazy to me that I still can't find note taking app with \n\n1. the speed &amp; ux of ia writer\n2. a proper sidebar to get organized\n3. local file support\n\nif you know anything like it, would love the recommendation!", "who": "@?", "url": "https://x.com/i/status/2098848727196979677"}], "likes": 644, "bm": 924, "url": "https://x.com/joelbqz/status/2099002011089768478"}, {"ty": "工具/项目", "tp": "AI Agent 与编程工具", "name": "RiverAi7z", "handle": "RiverAi7z", "date": "2026-09-13 22:13", "ts": "2026-09-13T13:13:15.000Z", "text": "我就说多看 Pi 的作者的 github 能发现好东西吧 \n\n他给 Pi 写的 control.ts 能让Pi 在不同终端里的 coding agent 可以直接互相发消息。\n\n 用 pi --session-control 启动后，agent 就能发现其他在线会话、发送任务、查询回复，还能等待对方完成一轮工作。底层是本机 Unix socket，不需要额外部署\n 服务 https://x.com/RiverAi7z/status/2099124247667044548/video/1", "quotes": [], "likes": 862, "bm": 1017, "url": "https://x.com/RiverAi7z/status/2099124247667044548"}, {"ty": "深度文章", "tp": "AI 编程实践", "name": "GlowJames 追光🐬", "handle": "jameszz343698", "date": "2026-09-13 21:11", "ts": "2026-09-13T12:11:21.000Z", "text": "这条帖子说的不是「让 Agent 自己点浏览器做 E2E」，而是反过来：**Agent 只负责写可重复跑的 Node.js + Playwright 脚本，真正执行测试交给 Playwright，不要让 Agent 用浏览器工具/MCP 一轮轮点页面。**\n\n核心对比很简单：\n\n- Agent 自己测：看截图 → 思考 → 点一下 → 再看截图，token 贵、慢、不稳定，测完也留不下资产\n- Playwright 测：写一次脚本，`npx playwright test` 几秒跑完，稳定、可回归、几乎不花 token\n\n下面是可以落地的做法。\n\n## 1. 在项目里先把 Playwright 装好\n\n```bash\nnpm init playwright@latest\n# 或\npnpm create playwright\n```\n\n常见结构：\n\n```text\ntests/\n  auth.spec.ts\n  checkout.spec.ts\nplaywright.config.ts\n```\n\n`playwright.config.ts` 里让它自己起本地服务，例如：\n\n```ts\nimport { defineConfig } from '@playwright/test';\n\nexport default defineConfig({\n  testDir: './tests',\n  use: {\n    baseURL: 'http://localhost:3000',\n    trace: 'on-first-retry',\n    screenshot: 'only-on-failure',\n  },\n  webServer: {\n    command: 'pnpm dev',\n    url: 'http://localhost:3000',\n    reuseExistingServer: !http://process.env.CI,\n  },\n});\n```\n\n## 2. 把规则写进 AGENTS.md / CLAUDE.md / .cursorrules\n\n这是这条推特真正要你「怎么做」的部分。可以直接贴类似规则：\n\n```md\n## 测试规则\n\n1. 禁止给 UI 写单元测试（按钮渲染、className、快照这类）。\n2. 禁止用 browser MCP / Playwright MCP / computer use 自己点页面做 E2E。\n   原因：浪费 token、速度慢、结果不稳定。\n3. 任何新功能或 bugfix，必须同时补 Node.js Playwright 脚本（tests/**/*.spec.ts）。\n4. 验证方式只能是：\n   - npx playwright test\n   - 或跑指定文件：npx playwright test tests/xxx.spec.ts\n5. 测试失败时：\n   - 先保证脚本能稳定复现问题\n   - 再给页面/接口加日志、把步骤拆小\n   - 然后改业务代码，直到脚本变绿\n6. 选择器优先用 getByRole / getByTestId，不要用脆弱的 CSS 层级。\n```\n\n对应原帖语境：\n\n- @meetqy：禁止 UI 单测，只列出受影响 UI + Todo，人来验\n- @supezen：不要让 Agent 主动做 E2E\n- @xicilion：E2E 用 Node.js + Playwright；并且**每个功能和修复都要写脚本**。脚本能复现后，Agent 自己加日志、拆步骤、修到过。\n\n## 3. 让 Agent 写的是这种脚本，不是「自己去点」\n\n比如登录：\n\n```ts\nimport { test, expect } from '@playwright/test';\n\ntest('用户可以登录并进入工作台', async ({ page }) => {\n  await page.goto('/login');\n\n  await page.getByLabel('邮箱').fill('demo@example.com');\n  await page.getByLabel('密码').fill('password123');\n  await page.getByRole('button', { name: '登录' }).click();\n\n  await expect(page).toHaveURL(/\\/dashboard/);\n  await expect(page.getByRole('heading', { name: '工作台' })).toBeVisible();\n});\n```\n\n复杂交互也一样，写成确定步骤，不要让模型现场探索页面。\n\n前端最好补稳定锚点：\n\n```tsx\n<button data-testid=\"checkout-submit\">提交订单<\/button>\n```\n\n测试里：\n\n```ts\nawait page.getByTestId('checkout-submit').click();\n```\n\n## 4. 实际工作流（这就是「具体怎么做」）\n\n1. 你提需求：加一个「忘记密码」功能。\n2. Agent 改业务代码，同时新建 `tests/forgot-password.spec.ts`。\n3. 你或 Agent 只跑命令：\n\n```bash\nnpx playwright test tests/forgot-password.spec.ts\n```\n\n4. 失败了，不要让它开浏览器 MCP 瞎点。\n   正确做法是让它：\n   - 看 Playwright 失败截图 / trace\n   - 给关键请求、状态、时序打日志\n   - 把一个大测试拆成更小步骤\n   - 修代码后再跑同一条脚本\n\n这就是他后一条说的：\n\n> 以前手测，回归一堆细节问题，复杂 UI 时序几乎没法迭代。后来要求 Agent 任何功能和修复都必须写 Node.js Playwright 脚本；只要能复现，它就会自己加日志、拆分，最后修好，人不用参与。\n\n## 5. 和「Playwright Agents」区分开\n\nPlaywright 新版本有 Planner / Generator / Healer 这类 Agent，那是「帮你生成/修复测试代码」。\n\n这条推特反对的是另一件事：\n\n- 让编码 Agent **当场扮演测试员**，用工具一轮轮操作真实页面来验证\n\n你要的是：\n\n- Agent = 写测试代码 + 改产品代码\n- Playwright runner = 执行测试\n\n## 6. 一个可直接用的提示词\n\n下次让 Agent 开工，可以在需求后面加上：\n\n```text\n不要自己打开页面点来点去验证。\n请直接写 Playwright 测试到 tests/ 目录，用 npx playwright test 验证。\n如果失败，先让脚本稳定复现，再加日志/拆步骤，然后修代码，直到测试通过。\n不要写 UI 单元测试。\n```\n\n一句话总结：**别让模型当点击员，让它当测试脚本作者。** 脚本能复现，后续修复、回归、CI 就都便宜且稳定了。", "quotes": [], "likes": 144, "bm": 263, "url": "https://x.com/jameszz343698/status/2099108669967507536"}, {"ty": "Skill", "tp": "写作与效率", "name": "谁是专家", "handle": "dboy_yi2025", "date": "2026-09-13 23:07", "ts": "2026-09-13T14:07:13.000Z", "text": "以下文章由我实验中的skill「辞达」，将Anthropic的一份文件 《Claude-eBook-Zero-Trust-for-AI-Agents-05182026》，翻译、转化、改写而成。请君共赏。\n\n我没有二次加工，想保留最原始的效果给大家阅读。\n\nPS.不用检测AI味道。去除AI味道，不是「辞达」的目标。 https://x.com/i/article/2099136211407511553", "quotes": [], "likes": 26, "bm": 45, "url": "https://x.com/dboy_yi2025/status/2099137830480216442"}, {"ty": "教程/学习", "tp": "AI 课程与指南", "name": "李大歌", "handle": "lidageai", "date": "2026-09-13 07:43", "ts": "2026-09-12T22:43:19.000Z", "text": "https://cursor.com/cn/learn/how-ai-models-work", "quotes": [{"type": "replied_to", "text": "我见过写的最好的Ai coding教程：\n\n来自cursor官方学习文档，从Ai基本原理的概念名词到代码agent最佳实践，一层一层逐步深入讲解，看完感觉酣畅淋漓，没有一句废话，我一个小时就看完了。\n\n我觉得，x上看100个零碎Ai使用技巧，不如静下心来看看这份文档！\n\n文档链接我放在评论区了： https://x.com/lidageai/status/2098905186282656143/photo/1", "who": "@lidageai", "url": "https://x.com/i/status/2098905186282656143"}], "likes": 71, "bm": 154, "url": "https://x.com/lidageai/status/2098905325223162177"}, {"ty": "教程/学习", "tp": "AI 课程与指南", "name": "李大歌", "handle": "lidageai", "date": "2026-09-13 07:42", "ts": "2026-09-12T22:42:46.000Z", "text": "我见过写的最好的Ai coding教程：\n\n来自cursor官方学习文档，从Ai基本原理的概念名词到代码agent最佳实践，一层一层逐步深入讲解，看完感觉酣畅淋漓，没有一句废话，我一个小时就看完了。\n\n我觉得，x上看100个零碎Ai使用技巧，不如静下心来看看这份文档！\n\n文档链接我放在评论区了： https://x.com/lidageai/status/2098905186282656143/photo/1", "quotes": [], "likes": 853, "bm": 1320, "url": "https://x.com/lidageai/status/2098905186282656143"}, {"ty": "深度文章", "tp": "AI 编程实践", "name": "Meathill", "handle": "meathill1", "date": "2026-09-13 15:20", "ts": "2026-09-13T06:20:00.000Z", "text": "https://meathill.com/posts/tech/my-great-ai-workflow-with-different-ai-models\n详细分享一下我的工作流和我的思考过程。\n这篇草稿已经里停放 N 久。不过几个月时间过去，我反而对这篇文章越发有自信了。我的诸多项目正是在这个工作流之下保持着高强度开发节奏，还能高质量高效率工作。希望我的思考和结论对大家有帮助，有启发。", "quotes": [], "likes": 107, "bm": 126, "url": "https://x.com/meathill1/status/2099020253183488167"}, {"ty": "Skill", "tp": "编程与工程", "name": "南晚Nanwan", "handle": "snwiki238337", "date": "2026-09-13 17:28", "ts": "2026-09-13T08:28:00.000Z", "text": "OpenAI发布了一套方法论，主要是关于如何评测skill效果的。对于做skill的人还是值得一看，而且github也找到一个理念很相近的skill评测器：agent-skills-eval，不过是个人维护的，非官方。\n\n先定义成功，再写 skill。OpenAI把检查项分为了这四个点：\nOutcome（任务完成没）、Process（调了预期的 skill/步骤没）、Style（产物符合团队规范没）、Efficiency（有没有瞎折腾/烧 token）。\n没这个定义，skill 就只是个更长的 prompt；有了它，才能进版本管理 + 回归测试 + CI。\n负样本比正样本更关键。博客里 test-04：用户只是想给现有项目\"加 Tailwind\"，skill 却新建了一整个 demo app。这种误触发比不触发更危险——因为它会动你的工作区。这是 agent 产品里最容易被忽略的验收口径。\nTrace 是第一性证据。用 codex exec --json 抓 JSONL 事件流，确定性检查（跑没跑 npm install？package.json 生成没？）直接读事件，快、可解释、能进 CI；模型裁判（rubric grading）只做第二层\"质量\"补充，不替代规则。\n小样本（10–20 条）起步：显式触发 / 隐式触发（不提 skill 名，靠 description 命中）/ 上下文触发 / 负向控制，各放几条。\n它的主张我认为非常好：Agent 开发正从 prompt craft 走向 behavior engineering——skill 不该只是写给模型看的说明书，而该是可测、可评分、可回归的类似一个Agent的可复现测试的单元。\n\n原文：https://developers.openai.com/blog/eval-skills\n仓库：https://github.com/darkrishabh/agent-skills-eval", "quotes": [], "likes": 685, "bm": 957, "url": "https://x.com/snwiki238337/status/2099052462653002157"}, {"ty": "深度文章", "tp": "纯链接（X 长文等）", "name": "酱紫表", "handle": "pengchujin", "date": "2026-06-15 12:20", "ts": "2026-06-15T03:20:03.000Z", "text": "http://x.com/i/article/2066330635216752640", "quotes": [], "likes": 560, "bm": 1276, "url": "https://x.com/pengchujin/status/2066360058498498727"}, {"ty": "深度文章", "tp": "设计", "name": "Adham Dannaway", "handle": "AdhamDannaway", "date": "2026-09-12 23:25", "ts": "2026-09-12T14:25:00.000Z", "text": "🔥 My breakdown of the best design systems out there right now.\n\nFrom Adobe to Atlassian, I dive into how they actually handle things like elevation tokens, transparency, and components, so you can learn from the best.\n\n→ https://www.adhamdannaway.com/blog/design-systems/design-system-examples https://x.com/AdhamDannaway/status/2098779917043257790/photo/1", "quotes": [], "likes": 305, "bm": 502, "url": "https://x.com/AdhamDannaway/status/2098779917043257790"}, {"ty": "深度文章", "tp": "纯链接（X 长文等）", "name": "Jingchao", "handle": "alswl", "date": "2026-09-13 01:33", "ts": "2026-09-12T16:33:17.000Z", "text": "https://x.com/i/article/2098796812668993536", "quotes": [], "likes": 165, "bm": 376, "url": "https://x.com/alswl/status/2098812199578005644"}, {"ty": "教程/学习", "tp": "语言与学习方法", "name": "goDavi（狗大V国际版）", "handle": "corndogjpn2", "date": "2026-09-12 15:23", "ts": "2026-09-12T06:23:20.000Z", "text": "笑了，哈哈哈 https://x.com/corndogjpn2/status/2098658703943889278/photo/1 https://twitter.com/cuixr1314/status/2097971496652276008", "quotes": [{"type": "quoted", "text": "连续爆肝了一整周，终于把《English Through Pictures》这套 70 年前公认的零基础入门天花板神作搞出来了！\n\n这套书封神的原因就两点：\n- 看图学英语：不讲枯燥的语法公式，全靠极简火柴人把情景画出来，一眼就能看懂\n- 250个词讲透底层逻辑：第一册全书仅仅用了约 250 个核心基础词，就把方位、人称、动作、时态全串透了。学英语从来不是盲目堆单词，而是把这几百个核心词彻底用活\n\n但这套原版书在今天看，有几个很明显的缺点：\n- 全都是静止的画面，很多动作全靠脑补\n- 而且它不能发音，更没法进行练习\n很多人买回去看几页就放在那吃灰了\n\n为了让这套经典神作彻底活过来，光是为了让动作足够流畅、动画细节足够自然，就反复调试打磨了无数遍，终于把第一册完整重制成了 84 节动态情景动画\n\n 现在全部放到了「句乐部」的练习系统里，你可以：\n - 反复看动画：火柴人真正动起来了，情景一目了然\n - 听写盲填：戴上耳机听原声打字，死磕听力与拼写\n - 中译英跟练：快速唤醒输出记忆，练成肌肉反射\n\n不仅解决了发音和静止的问题，学习效率比单看纸质书高得多\n\n课程一共 84 节，每天跟着练一组就行\n把这 84 节课的动作和句型在句乐部里练成肌肉记忆，到那时候，英语的语感和底层逻辑就算真踏进去了\n\n不管是给孩子做启蒙，还是你自己学了很久依然找不到门道，这套课都会给你完全不一样的感觉。\n\n如果你学英语一直很痛苦、脑子里永远在硬翻中文，一定一定要来试试这门课，学过之后你一定会回来感谢我\n\n来看看视频感受感受玩法，学英语就是这么有趣好玩👇\n\n练习地址在评论区！！！", "who": "@?", "url": "https://x.com/i/status/2097971496652276008"}], "likes": 133, "bm": 198, "url": "https://x.com/corndogjpn2/status/2098658703943889278"}, {"ty": "工具/项目", "tp": "设计资源", "name": "Abraham John 🦄🦓", "handle": "Abmankendrick", "date": "2026-09-12 17:34", "ts": "2026-09-12T08:34:41.000Z", "text": "UI/UX Designers, this might be one of the cleanest color palette generators I’ve seen lately.\n\nKigen is a color generator that helps you quickly create beautiful palettes for your UI projects, making it easier to pick colors that actually work well together instead of guessing.\n\nBookmark it for later 💜", "quotes": [], "likes": 1535, "bm": 1860, "url": "https://x.com/Abmankendrick/status/2098691759538680144"}, {"ty": "工具/项目", "tp": "模型与 AI 应用", "name": "Tom Dörr", "handle": "tom_doerr", "date": "2026-09-12 13:09", "ts": "2026-09-12T04:09:11.000Z", "text": "OpenUI is a generative UI framework utilizing a compact, streaming-first language that consumes up to 67% fewer tokens than JSON for structuring interface components.\n\nhttps://github.com/thesysdev/openui https://x.com/tom_doerr/status/2098624943218913364/photo/1", "quotes": [], "likes": 558, "bm": 707, "url": "https://x.com/tom_doerr/status/2098624943218913364"}, {"ty": "工具/项目", "tp": "开发与基础设施", "name": "lencx", "handle": "lencx_", "date": "2026-09-12 10:07", "ts": "2026-09-12T01:07:49.000Z", "text": "#开源推荐 TanStack Markdown：面向博客、文档站的轻量开源 Markdown 解析渲染库，解析器 gzip 后仅约 5 KB，零运行时依赖。核心亮点是同一份可序列化 AST 支持 HTML、React、Octane 渲染，兼顾小体积与输出一致性；还可按需开启 AI 流式渲染、文档扩展和外部代码高亮，默认转义原始 HTML、过滤可执行 URL。做博客、文档站或 AI 对话界面，可关注此项目。https://github.com/TanStack/markdown", "quotes": [], "likes": 14, "bm": 28, "url": "https://x.com/lencx_/status/2098579301755232273"}, {"ty": "生活娱乐", "tp": "健身与健康", "name": "RRT(라미 구조대)", "handle": "kingwest0219", "date": "2026-09-12 09:13", "ts": "2026-09-12T00:13:09.000Z", "text": "와... 진짜 개소름 돋네 😍\n수건 잡고 휙 당기는 순간 \n등 뒤에서 \n'우두둑' 소리 나면서 눈 번쩍 뜨임;;;\n도수치료 1회 15만원짜리 효과 ㄷㄷ\n개이득 😃", "quotes": [], "likes": 30235, "bm": 44426, "url": "https://x.com/kingwest0219/status/2098565544345805067"}, {"ty": "工具/项目", "tp": "设计资源", "name": "Dhruv", "handle": "dhruvtwt_", "date": "2026-09-12 03:25", "ts": "2026-09-11T18:25:43.000Z", "text": "An open-source icon library where every glyph comes in five styles: outline, duotone, fill, pixelated, and glass.\n\nLink : https://runeicons.com https://x.com/dhruvtwt_/status/2098478108257185798/photo/1 https://twitter.com/nexvyn/status/2098050463820353924", "quotes": [{"type": "quoted", "text": "Rune Icons is live. \n\n900+ icons, each in 5 styles: outline, duotone, fill, pixel, and glass. \n\nYou can reshape any path in the browser and copy it as SVG or JSX.\n\nFree, open source, no sign-up.   runeicons{.}com https://x.com/nexvyn/status/2098050463820353924/video/1 https://twitter.com/nexvyn/status/2097920522164285665", "who": "@?", "url": "https://x.com/i/status/2098050463820353924"}], "likes": 1515, "bm": 2266, "url": "https://x.com/dhruvtwt_/status/2098478108257185798"}, {"ty": "工具/项目", "tp": "设计资源", "name": "Willie Liu", "handle": "Willie4624", "date": "2026-09-11 00:30", "ts": "2026-09-10T15:30:13.000Z", "text": "可变字体 #络纬 展示网页初步完成\n\n因为目前字体还没设计拉丁，所以顺理成章地用全汉字表达了\n\n网页里能交互的地方不少，推荐使用电脑端打开，当然手机和触屏也都做了适配 https://luowei.atelier-anchor.com/", "quotes": [], "likes": 196, "bm": 173, "url": "https://x.com/Willie4624/status/2098071555028996250"}, {"ty": "生活娱乐", "tp": "健身与健康", "name": "New Artemis🌙✨", "handle": "NewArtemis22", "date": "2026-09-11 04:37", "ts": "2026-09-10T19:37:59.000Z", "text": "Este vídeo es increíblemente hipnótico y me ha ayudado a entender porqué me duele siempre la espalda en ese punto.\n\nHe hecho el movimiento que hace ella y alivio instantáneo, qué locura. https://x.com/NewArtemis22/status/2098133907812036669/video/1", "quotes": [], "likes": 12519, "bm": 19029, "url": "https://x.com/NewArtemis22/status/2098133907812036669"}, {"ty": "Skill", "tp": "设计与 UI", "name": "GitHub AI Projects Community 🇯🇵", "handle": "trendtech33566", "date": "2026-09-11 19:00", "ts": "2026-09-11T10:00:14.000Z", "text": "AIにUIを作らせると「なんか微妙」になる人へ👀\n\nskills、⭐️約3.7万。Vercel・Linear経験者のデザイン知識をAIに与えるskill集。\n\n何がいいかというと👇\n・UIアニメーションの曲線や速度を最適化\n・Web/React Native/Swiftの設計に対応\n・既存UIを監査して改善案を出せる\n・AIの量産型デザインを防ぐ\n\n「動くけどダサい」を卒業したいデザイナー・開発者に刺さります。\n\nhttps://github.com/emilkowalski/skills", "quotes": [], "likes": 1478, "bm": 2454, "url": "https://x.com/trendtech33566/status/2098350898732990886"}, {"ty": "工具/项目", "tp": "设计资源", "name": "gimu", "handle": "gimu_ai", "date": "2026-09-11 21:43", "ts": "2026-09-11T12:43:17.000Z", "text": "OpenAI公式が、Astraで生成した作品集を公開してるの知らなかった。しかも全部クオリティ高いし。めっちゃ勉強になる。\nhttps://developers.openai.com/showcase/games", "quotes": [], "likes": 2787, "bm": 4395, "url": "https://x.com/gimu_ai/status/2098391932955459743"}, {"ty": "深度文章", "tp": "纯链接（X 长文等）", "name": "蓝哥AI", "handle": "0xlangeai", "date": "2026-09-10 09:07", "ts": "2026-09-10T00:07:10.000Z", "text": "https://x.com/i/article/2097616542217482240", "quotes": [], "likes": 308, "bm": 745, "url": "https://x.com/0xlangeai/status/2097839261039153381"}, {"ty": "Prompt", "tp": "设计与前端", "name": "米开朗基杨", "handle": "CarsonYangk8s", "date": "2026-09-04 16:00", "ts": "2026-09-04T07:00:03.000Z", "text": "前苹果团队主管教你怎么用 AI 设计出高大上的网站！\n换更贵的模型并不能让 AI 做好 UI 设计，核心秘诀是想办法打碎 Token 预测的平庸惯性，用外部随机熵破局、用顶配大模型当挑刺总监、用视频模型做物理转场，最后用苹果式的克制无情砍掉无用修饰 https://x.com/i/article/2095729059137495040", "quotes": [], "likes": 243, "bm": 564, "url": "https://x.com/CarsonYangk8s/status/2095768840005439592"}, {"ty": "深度文章", "tp": "行业与观点", "name": "0xroot", "handle": "0xrootRE", "date": "2026-09-10 22:26", "ts": "2026-09-10T13:26:40.000Z", "text": "通过安全分析发现：特斯拉的核心是一条以硬件熔丝（/sys/firmware/oem/eom）为根锚点的信任链：未熔断/已熔断决定车辆是否处于工厂可开发状态，is-development-car（基于 Tesla 私有 PKI 证书链）和 is-fused 两条判据共同决定 is-in-factory/is-factory-gated 这层工厂门控状态，进而级联影响 is_customer_car（客户车辆）、GUI_serviceMode（服务模式）、Dyno Mode（测功机模式）、Swan Mode/Transport Mode（运输模式）等一系列 UI 覆盖状态和权限开关。每一种模式都不是孤立开关，而是通过 use-factory-odin-config、ssh-config、DisplayOverlayMessage 等多处消费方共同引用同一个上游信号，构成一棵完整的信任树。\n\n真正让我印象深刻的，是这条链路把\"不可逆的物理熔丝烧录\"作为唯一的、硬件级的根信任锚点，而不是依赖某个可被篡改的软件标志位——这次分析里可以绕过的所有软件层判定（VIN隐私、is-development-car证书检查、/var/etc/in-factory哨兵文件、lockdown脚本），最终追根溯源都会撞回同一个物理熔丝寄存器，而这个寄存器本身在真实硬件上是不可逆写入的。这是一种非常克制、非常经典的安全工程哲学：软件层的判定可以有无数个（甚至可以被合理地绕过用于调试），但只要根信任锚点是硬件级、不可逆的，整套系统的安全边界就始终有兜底——这次分析里能够安全地做各种\"熔丝状态实验\"而不担心真正破坏车辆安全性，恰恰是因为这个设计本身经得起研究者的反复拆解。\n\n这套体系从工厂根密钥注入、熔丝烧录、到 BLE 手机钥匙的 ECDH+白名单协议、再到 UDS 诊断通道与密钥保管服务 vaultd 的多层隔离——每一处都能看到\"纵深防御\"和\"最小信任\"被认真落地。作为一次完整的安全架构学习案例，Tesla 在这套系统里展现出的工程严谨度，值得所有做安全设计的人认真学习。向 Tesla 的工程团队致以敬意。", "quotes": [{"type": "quoted", "text": "Spent 24 hours getting a real Tesla Model 3 infotainment eMMC dump to boot under QEMU.\n\nLUKS/TPM? Bypassed.\nMesa/DRI ABI mismatch? Fixed.\nAppArmor denial? Tracked down.\nXorg assertion crash? Crushed.\nThen came the final boss: the host NVIDIA driver choking on virtio-gpu 3D acceleration.\nSo I gave up on GL, dropped GPU acceleration entirely, and switched to pure 2D scanout.\nAnd finally…\n\nThe Tesla Model 3 UI is alive inside QEMU.\n\nMany thanks to @vessial   He’s been a huge help throughout the process. His technical expertise, problem-solving skills, and willingness to share his knowledge are truly impressive. I’ve learned a lot from his guidance.", "who": "@0xrootRE", "url": "https://x.com/i/status/2097688866715324673"}], "likes": 635, "bm": 408, "url": "https://x.com/0xrootRE/status/2098040461000638817"}, {"ty": "深度文章", "tp": "行业与观点", "name": "西西米修斯", "handle": "Sisymithus", "date": "2026-09-10 22:27", "ts": "2026-09-10T13:27:10.000Z", "text": "教你套利 如何 免费搞到iPhone\n还是那句话：赚钱有时候真不看你创造了多少价值，\n而看你拥有什么。\niPhone Duo 的价格直接劝退年轻人，学生党，\n但我的 iPhone、iPad、Mac mini、iMac，基本都可以理解成库克送的\n方法甚非常简单\n这源于我商科毕业论文（论周期性）\n当时写的就是苹果，导师要我那道10年证据再说\n\n每年 WWDC前，1—5 月找机会买 AAPL，\n这个窗口里只看“相对强弱”单一指标就行，\n找低点买，如果你迷茫，不会判断，也没关系\n最迟拖到 5 月15逼着眼睛买入就好\n（为什么是5月15别问，说起来话太多）\n\n然后以下操作非常关键：\n通常，一台顶配iphoen pro max 按 $1300计算\n包括 applcare，手机壳和iclaoud的钱都在里面了\n直接设置止盈条件，收益 11%，\n别问为什么是11%，解释起来太多（期权反推）\n然后推出你需要多少本金，\n$1300这届设置11%止盈，\n然后把股票app关掉，别看，通常6-9月左右，\n一部iphone就生出来\n核心是别看 股价\n\n关键其实只有两个：\n第一，理解苹果产品和供应链的周期。\n第二，卖股票之前先知道自己为什么卖\n\n“我要赚很多钱”几乎没法执行\n“我只赚一台 iPhone”，反而特别清楚\n\n这个操作我执行了6年，没有失手\n失手也就多放一放 毕竟是苹果 怕啥\n\n今年是第七年，我4月7日买入 10 股苹果，有发推文\n因为只准备换耳机，目前已经盈利$706, \n可以买2个耳机还多，几乎能买个入门款17了\n如果目标是一台 Duo，今年行情好，\n只要30股AAPL，如果你像我一样再$245买入\n现在就能免费长出一部 iPhone Duo\n需要本金约合5万RMB，这个压岁钱攒一攒，\n平时拼命存一存，普通人还是够得到的\n关键你本金还在，每年长出一部iPhone 顶配\n尤其能来X折腾AI的年轻人，能力不是问题\n\n早点存一点资本很重要\n当你只有工资，iPhone 是消费品。\n当你开始拥有资产，iPhone 都是库克送的", "quotes": [], "likes": 804, "bm": 1217, "url": "https://x.com/Sisymithus/status/2098040588302209271"}, {"ty": "教程/学习", "tp": "语言与学习方法", "name": "卫斯理", "handle": "imwsl90", "date": "2026-09-10 11:42", "ts": "2026-09-10T02:42:22.000Z", "text": "简单，我这边有个方法学习 \n\n大量的泛读，阅读以英文为主\n\n多看youtube\n\n先从字幕开始，理解老外说话的方式\n\n再看无字幕\n\n最后听播客\n\n利用上下班时间听听就好了 \n\n基本上2-3年就听起来无障碍了 \n\n科技播客简单，我听lex fridman , aquired，corecursive都很轻松 ，单词不会超过4级\n\n最难的社会新闻、政论历史类，很多背景是没有的", "quotes": [{"type": "quoted", "text": "很想知道大家都是怎么把英文听力练好的， 我现在的目标不就是无障碍的听懂英文科技播客。", "who": "@?", "url": "https://x.com/i/status/2097877140268356021"}], "likes": 347, "bm": 285, "url": "https://x.com/imwsl90/status/2097878319618568312"}, {"ty": "工具/项目", "tp": "设计资源", "name": "Viking", "handle": "vikingmute", "date": "2026-09-09 23:25", "ts": "2026-09-09T14:25:17.000Z", "text": "今天看到的最漂亮的网站：\nhttps://kubernetes3d.com/rack\n\n把 k8s 集群做成了机架的样式，而且高度可操作，真的是 eye candy，还分了 front back 和 side 三个面，每个面讲的是同一套集群的不同切面，是一件精致的艺术品。\n\n注意上面的各种按钮和场景都是可交互的，用来学习概念也很棒，我已经把玩许久了，谁做的这么棒啊。", "quotes": [], "likes": 1464, "bm": 1562, "url": "https://x.com/vikingmute/status/2097692825660100914"}, {"ty": "Skill", "tp": "写作与效率", "name": "谁是专家", "handle": "dboy_yi2025", "date": "2026-09-09 21:48", "ts": "2026-09-09T12:48:48.000Z", "text": "每天在单位进行文档的规范排版，要花掉你多少时间？\n\n超多的细节要调整。有些领导换了一种版式后，连信息都接收不进去了。\n\n所以我参照国标，把所有细节都抠出来，封装成了这个技能。它解放了我，也希望能解放你们。 https://x.com/i/article/2097666244224880640", "quotes": [], "likes": 809, "bm": 1659, "url": "https://x.com/dboy_yi2025/status/2097668543865381347"}, {"ty": "工具/项目", "tp": "桌面与效率软件", "name": "いのり", "handle": "lnkiai", "date": "2026-09-06 14:58", "ts": "2026-09-06T05:58:12.000Z", "text": "ポートフォリオを新しく作りました！\n\nデザインにもこだわり、AIに私のことを聞ける機能もついています！👇️\n\nhttps://lnkiai.com https://x.com/lnkiai/status/2096478051580416089/video/1", "quotes": [], "likes": 2645, "bm": 3859, "url": "https://x.com/lnkiai/status/2096478051580416089"}, {"ty": "深度文章", "tp": "纯链接（X 长文等）", "name": "riba2534", "handle": "riba2534", "date": "2026-09-09 15:34", "ts": "2026-09-09T06:34:57.000Z", "text": "https://x.com/i/article/2097574225632739329", "quotes": [], "likes": 430, "bm": 944, "url": "https://x.com/riba2534/status/2097574464167027121"}, {"ty": "Skill", "tp": "设计与 UI", "name": "陈成", "handle": "chenchengpro", "date": "2026-09-09 21:14", "ts": "2026-09-09T12:14:11.000Z", "text": "5 skills I've been using a lot lately:\n\n1/ diagram-design\n39 diagram types. Every one comes out as a single HTML file you can double-click.\nhttps://github.com/cathrynlavery/diagram-design\n\n2/ council\nBefore your agent gives you a plan, it has to ask every other agent CLI on your machine what's wrong with it.\nhttps://github.com/kitze/council\n\n3/ Agent Reach\n15 platforms, 9 of them behind a login or a key. It picks a backend for each, installs it, and tells you which one is live.\nhttps://github.com/Panniantong/Agent-Reach\n\n4/ i-have-adhd\nStops the agent burying the answer. Ships an eval harness and publishes the gate its own skill fails.\nhttps://github.com/ayghri/i-have-adhd\n\n5/ wait-what\n394 bytes. Type it when a message didn't land, and the agent re-pitches it.\nhttps://github.com/mattpocock/skills/tree/main/skills/productivity/wait-what", "quotes": [], "likes": 313, "bm": 661, "url": "https://x.com/chenchengpro/status/2097659831184466172"}, {"ty": "Skill", "tp": "设计与 UI", "name": "Xiaoxi｜未未🍒", "handle": "XiaoxiVVa", "date": "2026-09-09 13:56", "ts": "2026-09-09T04:56:00.000Z", "text": "告别丑陋的 Mermaid，diagram-design 让 Claude Code 随手画出出版级架构图\n\n受够了 AI 生成那种带厚重阴影、排版别扭的 Mermaid 流程图？今天 GitHub 单日狂揽 1000+ Star 的 diagram-design 值得所有用 Coding Agent 的人装上。\n\n它给 Claude Code、Codex 和 Pi 注入了 39 种出版级专业图表能力，包括架构图、时序图、桑基图、鱼骨图、Wardley Map 和数据库模型等。生成的全是独立的纯 HTML + SVG 代码，零外部依赖，没有多余阴影和花哨滤镜，天然支持浅色、深色和编辑模式，浏览器点开即用。\n\n* 核心定位：面向编码 Agent 的高质量出版级图表技能插件\n* 开源协议：MIT License\n* 兼容平台：Claude Code、Codex、Factory Droid、Pi\n* 安装方式：Claude Code 内直接运行 /plugin marketplace add cathrynlavery/diagram-design 后执行 /plugin install diagram-design@diagram-design\n* 亮点特性：纯 HTML 与 SVG 渲染，无需构建环境；支持把现有的 Mermaid 或 http://draw.io 图源直接重绘成高质量排版\n\nhttps://github.com/cathrynlavery/diagram-design\nhttps://cathrynlavery.github.io/diagram-design", "quotes": [], "likes": 586, "bm": 991, "url": "https://x.com/XiaoxiVVa/status/2097549559840784786"}, {"ty": "工具/项目", "tp": "开发与基础设施", "name": "6神", "handle": "vpsing_de", "date": "2026-09-09 14:40", "ts": "2026-09-09T05:40:32.000Z", "text": "推荐一款部署在Cloudflare Workers 上的 Markdown 笔记。\n1、不需要服务器，挂在CF永远不担心笔记丢了。\n2、颜值很高，功能贼多。\n3、适合经常写各种教程。\n\n开源地址：https://github.com/shuaiplus/inkstone https://x.com/vpsing_de/status/2097560769550536786/photo/1", "quotes": [], "likes": 422, "bm": 766, "url": "https://x.com/vpsing_de/status/2097560769550536786"}, {"ty": "工具/项目", "tp": "网络与代理", "name": "小弟调调", "handle": "jaywcjlove", "date": "2026-09-09 14:18", "ts": "2026-09-09T05:18:53.000Z", "text": "Lantunnel：把你的私有网络随身带走\n\n在任何地方访问自己内网里的机器和服务\n\n优先点对点直连，端到端加密， 不用做端口映射，也不用把任何东西挂到公网\n\n👉 https://github.com/lantunnel/lantunnel https://x.com/jaywcjlove/status/2097555317542490119/photo/1 https://twitter.com/buhuipao/status/2097547309366296879", "quotes": [{"type": "quoted", "text": "@jaywcjlove 哈哈哈，可以呀，感觉有点像 sunshine/moonlight。\n\n我开发了这个：https://github.com/lantunnel/lantunnel，配合 sunshine/moonlight 实现了远程桌面和打游戏。", "who": "@?", "url": "https://x.com/i/status/2097547309366296879"}], "likes": 91, "bm": 140, "url": "https://x.com/jaywcjlove/status/2097555317542490119"}, {"ty": "工具/项目", "tp": "AI Agent 与编程工具", "name": "idoubi", "handle": "idoubicc", "date": "2026-09-09 18:38", "ts": "2026-09-09T09:38:48.000Z", "text": "https://termany.sh is perfect. ✌️ https://x.com/idoubicc/status/2097620728610963675/photo/1", "quotes": [], "likes": 375, "bm": 587, "url": "https://x.com/idoubicc/status/2097620728610963675"}, {"ty": "资讯", "tp": "模型与平台动态", "name": "DHH", "handle": "dhh", "date": "2026-09-08 04:57", "ts": "2026-09-07T19:57:34.000Z", "text": "你好中国 👋 https://zh.omarchy.org https://x.com/dhh/status/2097051671910044148/photo/1", "quotes": [], "likes": 3304, "bm": 564, "url": "https://x.com/dhh/status/2097051671910044148"}, {"ty": "工具/项目", "tp": "桌面与效率软件", "name": "酱紫表", "handle": "pengchujin", "date": "2026-09-08 17:05", "ts": "2026-09-08T08:05:11.000Z", "text": "塔台上线了 Mac 版本，适配优化界面，导出的客户端也对应做了支持，分享订阅给局域网路由器、安卓等设备也更方便。最重要的塔台 Mac 版完全开源免费： https://github.com/pengchujin/tower https://x.com/pengchujin/status/2097234781725691964/photo/1", "quotes": [], "likes": 247, "bm": 284, "url": "https://x.com/pengchujin/status/2097234781725691964"}, {"ty": "工具/项目", "tp": "AI Agent 与编程工具", "name": "老鬼", "handle": "laogui", "date": "2026-09-06 23:47", "ts": "2026-09-06T14:47:25.000Z", "text": "知名代码编辑器 Zed 推出了全新的独立 Agentic IDE —— Delta（http://delta.dev）。\n\n目前绝大多数 AI 编程工具本质上还是“单人抽卡”：你跟 Agent 聊完改了代码，聊天的上下文就被埋没了；到了 Git Commit 里，同事根本不知道这段代码当初是怎么跟 AI 讨论出来的。\n\nDelta 要做的事情是：\n\n- 把聊天当做第一公民：代码和产生它的对话永久绑定（底层基于 DeltaDB）。你在某行代码上不仅能看到是谁写的，还能追溯当时是哪段 Prompt、怎么跟 Agent 推演出来的。\n\n- 多人实时协作：发一个链接，同事就能直接进你的 Thread 围观 Agent 写代码，还能实时评论、接管任务，甚至直接在浏览器里（Rust+Wasm 渲染）跑起来。\n\n- 支持外部 Agent：不仅自己能跑，还能直接接管终端里的 Claude Code 等外部 Agent。\n\n这个产品有点类似 GitHub 前 CEO 创立的 Entire，把 AI 会话当做上下文，虽然理念挺好，但在团队实施的难度较大。\n\nDelta 也可以当做单人版 Agent 代码工具，和 Zed 一样是 Rust 写的，性能很好，也可以对接第三方 Agent，使用 Codex，Grok 的订阅额度。", "quotes": [], "likes": 555, "bm": 760, "url": "https://x.com/laogui/status/2096611233621520513"}, {"ty": "工具/项目", "tp": "网络与代理", "name": "Crypto营长", "handle": "Crypto_Camp_", "date": "2026-09-04 19:43", "ts": "2026-09-04T10:43:24.000Z", "text": "又快又稳又便宜的梯子。不用买任何VPN，建个 Amazon Lightsail 服务器，用最便宜的0.5 GB 内存、2 vCPU、20 GB SSD、1 TB 流量/月。\n\n一月费用总共才5美金！一句话告诉 Codex 用VLESS + REALITY + XTLS Vision搭建服务端\n\n客户端：\n- Windows 和 Mac 电脑用 Clash Verge\n- 苹果手机免费用Streisand、Happ、Hiddify 和 Karing\n- 安卓手机用 v2rayNG、Hiddify、Karing 等\n\n开个AWS云账号就行 https://ap-northeast-1.console.aws.amazon.com/lightsail/webapp/home/instances", "quotes": [], "likes": 322, "bm": 592, "url": "https://x.com/Crypto_Camp_/status/2095825047089033312"}, {"ty": "教程/学习", "tp": "实用技巧", "name": "向阳乔木", "handle": "vista8", "date": "2026-09-05 02:25", "ts": "2026-09-04T17:25:35.000Z", "text": "终于发现美国豆包 Gemini Pro 订阅的价值！\n\n自动剪长视频的高光和金句、自动截图等\n\n1. 上传原始视频到谷歌硬盘。（速度不错）\n\n2. Gemini pro会员，能用Colab的AI辅助，描述剪辑需求，自动生成Python代码。\n\n3. 菜单设置：代码执行程序 -> 更改运行时类型，选T4 GPU，运行即可。\n\n剪辑好的视频片段和截图会到写入谷歌硬盘指定文件夹。", "quotes": [], "likes": 325, "bm": 494, "url": "https://x.com/vista8/status/2095926261088751663"}, {"ty": "深度文章", "tp": "纯链接（X 长文等）", "name": "可可鸭", "handle": "KeKeYa88", "date": "2026-09-03 18:43", "ts": "2026-09-03T09:43:38.000Z", "text": "https://x.com/i/article/2095431394029707267", "quotes": [], "likes": 258, "bm": 603, "url": "https://x.com/KeKeYa88/status/2095447620210868382"}, {"ty": "生活娱乐", "tp": "健身与健康", "name": "iPaul", "handle": "iPaulCanada", "date": "2026-09-04 06:41", "ts": "2026-09-03T21:41:52.000Z", "text": "脊椎专家治疗腰痛的视频火了🔥\n网友：用一个视频就解决了全世界腰痛问题。 https://x.com/iPaulCanada/status/2095628366774730849/video/1", "quotes": [], "likes": 4074, "bm": 4301, "url": "https://x.com/iPaulCanada/status/2095628366774730849"}, {"ty": "深度文章", "tp": "行业与观点", "name": "小陆师傅", "handle": "STANLEES4", "date": "2026-09-05 11:36", "ts": "2026-09-05T02:36:57.000Z", "text": "当一个制造业强国想要向全球霸主学习，也想要“白嫖”全球的原材料和资源，掌控贸易定价权和结算命脉，同时在货币政策和财政政策上获得近乎无限的政策独立空间，那么他需要将其本国的货币国际化。\n\n但是在其货币国际化时，这个国家又不愿意向全球开放自己本国的金融市场，给国际投机资本留下窗口；也不愿意让其本国货币过快升值，损害该国的制造业；同时在现实中，因为该国巨大的贸易顺差，导致全球其他国家其实是缺乏该国货币的，很难将该国货币作为储备货币。那么唯一能实现该国货币全球化的办法，就是该国能提供利率较低的本币融资方式，向全球借出自己的货币。\n\n但是，这时候悖论就来了。要维持对外出借资金的低利率，就要求该国国内通胀水平长期被压制在低位，同时内需持续不振，储蓄率居高不下，消费意愿低迷。唯有如此，该国的国债——尤其是十年期、三十年期这样的长期国债——收益率才能被压在谷底。而只有当这个\"利率之锚\"钉在足够低的位置，境外主体在你这里发债、借贷、融资的成本才会具备全球竞争力，他们才会有动力放弃现在的美元、欧元、日元，转而持有和借入你的货币。随后他们才会摆脱现有的货币体系，融入到一个新的货币体系中，同时更方便的采购该国中间品和商品，出售或者租赁抵押他们自己国家的资源，被动的帮助该国完成其货币国际化。\n\n而这就构成了一个极其尖锐的战略悖论：当这个国家想用货币国际化来换取全球影响力时，但支撑这一野心的燃料，却是国内经济的结构性疲软。但这也是该国货币国际化在负债端的底层逻辑，冷酷且精密。\n\n所以这套理论，就解释了许多奇怪的事情，也回答了许多普通人的困惑，是不是啊？", "quotes": [], "likes": 361, "bm": 336, "url": "https://x.com/STANLEES4/status/2096065014260191270"}, {"ty": "教程/学习", "tp": "实用技巧", "name": "二旬老汉", "handle": "leeking420", "date": "2026-09-04 15:13", "ts": "2026-09-04T06:13:26.000Z", "text": "目前最便宜的.com/.net域名渠道是Google Workspace ，一年
