1"}, {"ty": "Prompt", "tp": "图像生成", "name": "Larus Canus", "handle": "MrLarus", "date": "2026-09-02 19:23", "ts": "2026-09-02T10:23:44.000Z", "text": "🤯 用 Image2 做中式极简海报，大色域 + 微地景，高级感拉满！\n\n黑色地景压住大色域，竖排文字和微型信息补足细节，远看极简，近看有层次。\n\n1. 潮汐回声：海岸线 × 青蓝潮汐色域\n2. 春山一杯：斜向茶山 × 明黄春日色域\n3. 隐逸之境：山林小径 × 雾粉留白\n4. 湖上来笺：湖上长堤 × 青瓷信笺结构\n\n🌟 很适合展览海报、文化视觉、书籍封面和东方编辑设计参考！\n\nPrompt below 👇", "quotes": [{"type": "quoted", "text": "🤯 用 ChatGPT-Image2 把古画藏进一个汉字里，一字一境太美了！\n\n用字做构图，人物、花枝、山水和街巷都从笔画里慢慢长出来：\n\n1. 宴：古代雅宴\n2. 市：市井烟火\n3. 游：春日游赏\n4. 山：山水行旅\n\n最有意思的是让部分元素越过字形边界，画面一下有了流动感和故事感！\n\n提示词在评论区👇 https://x.com/MrLarus/status/2090712125492600859/photo/1 https://twitter.com/MrLarus/status/2089688283810783605", "who": "@MrLarus", "url": "https://x.com/i/status/2090712125492600859"}], "likes": 818, "bm": 768, "url": "https://x.com/MrLarus/status/2095095321944563930"}, {"ty": "Prompt", "tp": "图像生成", "name": "Kimberly", "handle": "king1818888", "date": "2026-09-01 08:22", "ts": "2026-08-31T23:22:44.000Z", "text": "提示词自取：\n\nCreate one independent high-end editorial poster for each uploaded photo. Do not combine multiple photos into a collage. Each photo must be processed and output as a separate poster.\n\nOVERALL FORMAT\n\nStrict 3:4 vertical composition.\n\nDivide the canvas horizontally into two exactly equal sections, with a precise 1:1 height ratio.\n\nThe top half occupies exactly 50% of the canvas.\n\nThe bottom half occupies exactly 50% of the canvas.\n\nThe two sections should feel visually connected as one refined art publication cover.\n\nTOP HALF — ORIGINAL PHOTOGRAPH\n\nPreserve the original photograph as faithfully as possible.\n\nKeep the main composition, subjects, identity, facial features, body proportions, poses, expressions, clothing, objects, and spatial relationships unchanged.\n\nPreserve the realistic photographic texture, natural lighting, shadows, atmosphere, and original color mood.\n\nApply only subtle, sophisticated editorial color grading, creating the feeling of a premium magazine photograph, contemporary art book, or high-end independent publication.\n\nThe image should remain photorealistic and authentic, never overly retouched or artificially stylized.\n\nIf necessary to fit the 3:4 composition naturally, extend the sky, ground, walls, or surrounding environmental background.\n\nBackground extension must feel seamless and photographic.\n\nNever stretch, distort, reshape, replace, or alter the main subject.\n\nBOTTOM HALF — MINIMAL HAND-DRAWN PAPER ILLUSTRATION\n\nExtract the most recognizable visual elements from the original photograph and reinterpret them as a minimalist hand-drawn paper-cover illustration.\n\nPreserve:\n\nThe most recognizable subject\n\nEssential silhouette and proportions\n\nKey pose or gesture\n\nImportant objects\n\nThe core narrative relationship between people and objects\n\nHighly simplify the image. Remove unnecessary details and retain only the visual information needed for immediate recognition.\n\nUse:\n\nDelicate, slightly imperfect hand-drawn lines\n\nA small number of bold, clearly defined acrylic-style flat color shapes\n\nRough paper texture\n\nVisible handmade brush marks\n\nSlightly irregular, organic edges\n\nSubtle imperfections that make it feel genuinely handmade\n\nThe main illustrated subject should be small, centered, and carefully composed, occupying approximately 10–20% of the bottom half.\n\nLeave a large amount of negative space around the illustration.\n\nThe background should primarily resemble:\n\nRough white paper\n\nWarm off-white paper\n\nPale natural paper\n\nMinimal editorial book-cover stock\n\nUse only a few lines or small color shapes to suggest the surrounding environment.\n\nCOLOR PALETTE\n\nExtract the dominant colors directly from the original photograph.\n\nCompress the palette into no more than 4 main colors.\n\nKeep the colors restrained, sophisticated, and harmonious.\n\nUse bold but controlled flat color blocks.\n\nAvoid excessive color variation.\n\nPreserve subtle paper grain and handmade brush texture.\n\nThe illustration should visually feel like a simplified color interpretation of the photograph.\n\nTYPOGRAPHY\n\nA small amount of simple typography may be included when appropriate.\n\nPossible elements:\n\nA short title\n\nKeyword\n\nObject name\n\nLocation\n\nYear\n\nNumber\n\nShort phrase\n\nText should be minimal, understated, and editorial.\n\nTypography should naturally interact with the large areas of negative space and the small illustration, evoking:\n\nArt book covers\n\nIndependent publishing\n\nContemporary editorial design\n\nThoughtful children's picture books\n\nDo not force text into the composition if it does not naturally fit the photograph.\n\nVISUAL LANGUAGE\n\nThe final poster should feel:\n\nQuiet · Poetic · Refined · Minimal · Innocent · Relaxed · Artistic · Thoughtful · High-recognition · Premium\n\nThe visual concept should be:\n\n“A small subject surrounded by a large amount of empty space.”\n\nThe result should resemble a carefully designed independent art publication cover, rather than a commercial advertisement.", "quotes": [{"type": "replied_to", "text": "这个提示词的审美无敌了啊 https://x.com/king1818888/status/2094443914866597977/photo/1", "who": "@king1818888", "url": "https://x.com/i/status/2094443914866597977"}], "likes": 1541, "bm": 3195, "url": "https://x.com/king1818888/status/2094566588087509050"}, {"ty": "Prompt", "tp": "编程与代码审查", "name": "Xuanwo", "handle": "xuanwo", "date": "2026-09-02 14:47", "ts": "2026-09-02T05:47:36.000Z", "text": "我现在提示词里面特别喜欢加一个  消融实验\n\n对gpt-5.6-sol 来说效果尤其的好\n\n用法很简单：每次完成设计或者实现之后，就说进行消融实验，去掉不必要的抽象和设计", "quotes": [], "likes": 2125, "bm": 2146, "url": "https://x.com/xuanwo/status/2095025829424333044"}, {"ty": "Prompt", "tp": "编程与代码审查", "name": "Erwin", "handle": "ErwinWu000", "date": "2026-09-01 15:43", "ts": "2026-09-01T06:43:18.000Z", "text": "请以独立的软件架构师、安全评审人和代码审查者身份，对当前仓库进行一次完整评审。\n\n你的任务包括：\n\n1. 判断当前技术方案是否合理。\n2. 判断是否存在更简单、更安全或更容易维护的方案。\n3. 在方案合理的前提下，审查具体代码。\n4. 找出真正值得修复的问题，而不是为了完成审查而凑问题数量。\n\n不要默认现有架构、技术选型和实现方式一定正确，也不要直接开始修改代码。\n\n## 一、先调查仓库\n\n先自行阅读仓库，尽可能从现有材料中还原项目目标、限制条件和当前方案。\n\n优先检查：\n\n- README、AGENTS.md、CLAUDE.md 等项目说明\n- docs、spec、requirements、issues、tickets 等需求和设计资料\n- 当前分支的 Git diff 和近期相关提交\n- 依赖清单、构建配置、环境配置和部署配置\n- 程序入口、核心模块及其调用关系\n- 数据模型、权限控制和外部服务接口\n- 现有测试以及测试覆盖的关键场景\n- 与当前改动直接相关的代码和文档\n\n先定位相关范围，不要没有目的地扫描整个仓库。\n\n不要询问能够从仓库、代码、配置、测试或 Git 记录中找到的信息。\n\n只有同时满足以下条件时，才向我提问：\n\n- 仓库中确实找不到答案；\n- 不同答案会明显改变你的评审结论；\n- 不能通过合理的只读检查继续判断。\n\n每次最多提出 3 个关键问题。普通的不确定性可以标记出来，不要因此中断整个评审。\n\n## 二、还原目标和现状\n\n根据调查结果，用简短的语言说明：\n\n- 这个项目或改动要解决什么问题\n- 当前采用了什么方案\n- 你从哪些文件或代码中得出了这个判断\n- 当前方案依赖哪些关键假设\n- 哪些信息仍然不确定\n\n如果文档与代码不一致，明确指出差异，并说明你采用哪一方作为判断依据。\n\n## 三、先做方案评审\n\n暂时不要纠结局部代码写法。先回到项目目标，检查当前路线是否合适。\n\n重点判断：\n\n- 当前方案是否真正满足需求\n- 是否把简单问题做复杂了\n- 是否因为早期选择产生了大量后续补丁\n- 权限、安全或状态问题是否来自架构本身\n- 当前问题能否通过局部修改解决\n- 有没有其他方案可以从根源上消除这一类问题\n- 替换方案带来的迁移成本是否值得\n\n不要被已有代码数量和开发投入绑住。已经写了很多代码，不代表当前方案就应该继续使用。\n\n如果存在有意义的替代方案，请比较：\n\n- 需求覆盖\n- 安全风险\n- 实现复杂度\n- 维护成本\n- 性能和资源成本\n- 出错后的影响范围\n- 迁移与回滚难度\n\n不要为了满足格式强行编造替代方案。如果当前方案已经合理，可以直接说明为什么值得保留。\n\n最后给出以下结论之一：\n\n- 保留当前方案\n- 调整当前方案\n- 更换方案\n- 缺少关键信息，暂时无法判断\n\n在得出路线结论之前，不要提供代码补丁。\n\n## 四、再做实现审查\n\n如果当前方案仍然值得保留，再检查具体实现，包括：\n\n- 功能和逻辑错误\n- 权限、身份验证和数据泄露风险\n- 输入验证与异常处理\n- 并发、状态一致性和资源释放\n- 性能问题\n- 测试缺口\n- 与需求或设计不一致的实现\n- 会增加后续维护成本的结构问题\n\n每个问题必须包含：\n\n- 严重程度：致命 / 高 / 中 / 低\n- 置信度：高 / 中 / 低\n- 对应的文件、代码或配置证据\n- 触发问题的具体场景\n- 可能造成的后果\n- 建议处理方向\n- 这是根因还是表面症状\n\n如果多个问题来自同一个根因，请合并说明，并优先给出根因处理方案。\n\n## 五、控制审查质量\n\n遵守以下规则：\n\n- 不要为了凑数量而提出问题。\n- 没有发现新的重要问题时，直接说明。\n- 区分已确认缺陷、合理风险和待验证猜测。\n- 没有代码或文档证据时，不要把理论可能性写成已经存在的 Bug。\n- 不要把个人风格偏好当成缺陷。\n- 不要重复已经修复的问题。\n- 不要只检查局部补丁，还要确认调用方、数据流和受影响范围。\n- 对低概率、低影响的问题，说明是否值得处理。\n- 不要修改代码，除非我之后明确要求你实施。\n- 如果继续审查已经进入收益递减，明确建议停止。\n\n## 六、输出格式\n\n按照以下顺序输出：\n\n1. 仓库调查范围\n2. 项目目标和当前方案\n3. 尚未确认的关键信息\n4. 当前方案的关键假设\n5. 方案层问题\n6. 替代方案及取舍\n7. 路线结论\n8. 实现层问题\n9. 最优先处理的三件事\n10. 可以暂时接受的剩余风险\n11. 是否值得继续下一轮审查\n\n先完成评审并等待我的决定，不要直接修改代码。", "quotes": [{"type": "replied_to", "text": "关于 AI 做代码审查，我还想补充一个很多人没注意到的坑\n\nAI 极其容易掉入局部陷阱。很多时候我们让 AI 审代码，它一上来就默认你的框架和方案是对的，只会在你的方案里去找安全漏洞或者小修小补\n\n但对大多数开发者（尤其是新手）来说，最关键的是审查这个方案本身选得对不对。你可能用 A 方案修修补补折腾了半天，换成 B 方案这些问题根本就不会存在\n\n另一个烦人的点是 AI 的挤牙膏审查。你让他审一遍，改完问题再让他审，他又能挑出新问题。说明他不是一次性从底层原理出发把根源解决掉，而是在那里硬找问题、刷存在感\n\n为了避免这两个问题，我总结了一个Prompt，评论区看看👇", "who": "@ErwinWu000", "url": "https://x.com/i/status/2094677457853100412"}], "likes": 305, "bm": 909, "url": "https://x.com/ErwinWu000/status/2094677460545888393"}, {"ty": "深度文章", "tp": "行业与观点", "name": "YilunAI｜易论AI", "handle": "yilunAIyyds", "date": "2026-09-02 15:06", "ts": "2026-09-02T06:06:07.000Z", "text": "请来继刚、歸藏、橘子对谈，几个思考：\n1. 让 AI 真正落地的不是产品，是服务\n2. 企业 AI 转型，只需要搞定 5% 的人\n3. 越土的行业，AI 越吃香\n4. 卖 Skill 给个人用户，是个伪生意\n5. 别人的 Skill 再厉害，也进不了你的工作流\n6. 下一张社交网络，一半节点不是人\n\n#aicoding #易论AI #归藏 #colaOS #李继刚", "quotes": [], "likes": 274, "bm": 420, "url": "https://x.com/yilunAIyyds/status/2095030491519111230"}, {"ty": "Skill", "tp": "设计与 UI", "name": "躺在废墟里 Lieflat", "handle": "lieflat_3", "date": "2026-09-01 20:28", "ts": "2026-09-01T11:28:59.000Z", "text": "https://github.com/larashero3-dotcom/lieflat-charts 地址在这里～", "quotes": [{"type": "replied_to", "text": "一个 skill，让你做出顶级审美的图表。\n\n我开源的 Lieflat Charts 已经在 GitHub 2k star 啦～它是一套数据可视化与报告生成 skill，可供 Moxt、Claude Code、Codex 等 AI agent 使用。\n\n它由统一的字体、留白、线条和动效建立视觉语法，有60多种图型，覆盖柱、线、面积、直方图等基础图型，还有热力图、小提琴图、环形关系图、桑基图等复杂图型，部分还支持交互。\n\n色彩上，以黑白灰单色为基础，也支持青瓷蓝、椰林绿、编辑红三种色系，后续还会尝试更多丰富配色～\n\n这个skill 的原理是用 html 来做图表，好处很明显，有很丰富的动效，可以无缝衔接到 html 做的 PPT 中。如果需要 PPT 格式，也可以让 agent 转成动图贴进 PPT 里。\n\n使用非常简单，装好后把你的数据或者想要可视化的主题告诉agent，agent 会选择合适的图表类型，自动出图。如果你需要出报告，目前也有报告模式，可以一键产出数据可视化报告。\n\n感谢 @moxt_ai 让我做出这么好看的图表！\n\n#datavisualization #charts #skill #dataviz #html #aidesign", "who": "@lieflat_3", "url": "https://x.com/i/status/2094719194302706136"}], "likes": 205, "bm": 437, "url": "https://x.com/lieflat_3/status/2094749355249160523"}, {"ty": "工具/项目", "tp": "模型与 AI 应用", "name": "Samet Karakaş", "handle": "sametkarakastr", "date": "2026-09-01 11:47", "ts": "2026-09-01T02:47:08.000Z", "text": "Google dün TimesFM-3 diye inanılmaz kullanışlı bir model yayınlamış.\n\nElinizde satış, talep, trafik, enerji, finans veya sensör gibi zamana bağlı veriler varsa modele geçmiş veriyi, ilişkili diğer serileri ve hatta kampanya, tatil, hava durumu gibi geleceği bilinen değişkenleri birlikte verebiliyorsunuz. Model bunların ilişkisini kendi çözüp fine-tuning gerektirmeden geleceği tahmin ediyor.\n\nÜstelik bunu önceki modeller gibi adım adım değil, tüm tahmin aralığını tek forward pass ile üreterek yapıyor.\n\n330 milyon parametreli model 1 trilyondan fazla zaman noktasıyla eğitilmiş. Google’ın paylaştığı sonuçlarda GIFT-Eval, FEV-Bench ve TIME benchmarklarının üçünde de foundation modeller arasında ilk sıraya çıkmış.\n\nKod GitHub’da, model Hugging Face’te yayınlanmış. Zaman serisiyle çalışan biri için doğrudan deneyip projeye uyarlayabileceği oldukça güçlü bir araç.", "quotes": [{"type": "quoted", "text": "Introducing TimesFM-3, a state-of-the-art time series foundation model that enables accurate multivariate time series forecasting in a single forward pass, significantly outperforming other forecasting models across major benchmarks.\n\nMore on the blog →https://goo.gle/4x5WGpD https://x.com/GoogleResearch/status/2094483372718580066/photo/1", "who": "@?", "url": "https://x.com/i/status/2094483372718580066"}], "likes": 2692, "bm": 4055, "url": "https://x.com/sametkarakastr/status/2094618027165659294"}, {"ty": "深度文章", "tp": "纯链接（X 长文等）", "name": "custom", "handle": "wuzhutisushuo", "date": "2026-08-31 17:26", "ts": "2026-08-31T08:26:37.000Z", "text": "https://x.com/i/article/2094340789031796736", "quotes": [], "likes": 431, "bm": 445, "url": "https://x.com/wuzhutisushuo/status/2094341073623777777"}, {"ty": "Skill", "tp": "设计与 UI", "name": "躺在废墟里 Lieflat", "handle": "lieflat_3", "date": "2026-09-01 18:29", "ts": "2026-09-01T09:29:08.000Z", "text": "一个 skill，让你做出顶级审美的图表。\n\n我开源的 Lieflat Charts 已经在 GitHub 2k star 啦～它是一套数据可视化与报告生成 skill，可供 Moxt、Claude Code、Codex 等 AI agent 使用。\n\n它由统一的字体、留白、线条和动效建立视觉语法，有60多种图型，覆盖柱、线、面积、直方图等基础图型，还有热力图、小提琴图、环形关系图、桑基图等复杂图型，部分还支持交互。\n\n色彩上，以黑白灰单色为基础，也支持青瓷蓝、椰林绿、编辑红三种色系，后续还会尝试更多丰富配色～\n\n这个skill 的原理是用 html 来做图表，好处很明显，有很丰富的动效，可以无缝衔接到 html 做的 PPT 中。如果需要 PPT 格式，也可以让 agent 转成动图贴进 PPT 里。\n\n使用非常简单，装好后把你的数据或者想要可视化的主题告诉agent，agent 会选择合适的图表类型，自动出图。如果你需要出报告，目前也有报告模式，可以一键产出数据可视化报告。\n\n感谢 @moxt_ai 让我做出这么好看的图表！\n\n#datavisualization #charts #skill #dataviz #html #aidesign", "quotes": [], "likes": 5821, "bm": 9365, "url": "https://x.com/lieflat_3/status/2094719194302706136"}, {"ty": "Prompt", "tp": "沟通与写作", "name": "Ww", "handle": "wewe92121", "date": "2026-09-01 21:20", "ts": "2026-09-01T12:20:47.000Z", "text": "@yyyole “请用海明威风格改写。严格限制使用副词（如‘非常、快速地、悲伤地’），尽量用有力的动词和名词替代，只描写动作和细节，不要总结情绪。”", "quotes": [{"type": "replied_to", "text": "一个私藏的实用技巧：\n用AI写文章时，禁止它使用副词，你会发现写出来的内容，会很有画面感！！", "who": "@yyyole", "url": "https://x.com/i/status/2094711459704098991"}], "likes": 186, "bm": 179, "url": "https://x.com/wewe92121/status/2094762393117307263"}, {"ty": "深度文章", "tp": "行业与观点", "name": "南宫远", "handle": "nangongyuan", "date": "2026-08-31 09:49", "ts": "2026-08-31T00:49:00.000Z", "text": "十几年前，天涯社区有个帖子被顶到了几千楼，楼主写了一段话，我记到现在。  原话大概是这样：\"很多人之所以一事无成，根本不是因为不够聪明，而是脱产挥霍导致的自我内核薄弱。没有经过实践劳动价值生产打磨出来的刚毅自我，短短几十年里，人生最能奋斗精进的时光，全浪费在了无效信息上。 \"\n\n当时看完只觉得扎心，十几年后再回头看，这段话简直是预言。", "quotes": [], "likes": 2864, "bm": 1557, "url": "https://x.com/nangongyuan/status/2094225908928508344"}, {"ty": "深度文章", "tp": "纯链接（X 长文等）", "name": "Joway", "handle": "jowaywang", "date": "2026-08-29 21:49", "ts": "2026-08-29T12:49:32.000Z", "text": "https://x.com/i/article/2093682363314155520", "quotes": [], "likes": 777, "bm": 1367, "url": "https://x.com/jowaywang/status/2093682461737967822"}, {"ty": "工具/项目", "tp": "AI Agent 与编程工具", "name": "K2S", "handle": "k2sbhai", "date": "2026-08-31 08:23", "ts": "2026-08-30T23:23:49.000Z", "text": "ChatGPT Web is now inside Codex 😲 \n\nthis open-source project has already crossed 2.7k stars\n\ninstead of using a separate workflow, it lets you use ChatGPT Web models directly from Codex's model picker\n\nwhat you get:\n\n- GPT-5.6 Pro for eligible accounts\n- free Luna access\n- ChatGPT Web quota\n- Codex tools + context\n- images, streaming and reasoning\n- open-source + MIT licensed\n\ngetting started:\n\n1. go to http://github.com/miuuyy/codex-chatgpt-web\n2. install the launcher\n3. sign in with your ChatGPT account\n4. run the browser checks\n5. install the models\n6. restart Codex and select ChatGPT Web\n\nthe interesting part?\n\nyou can keep using Codex normally while routing the selected model through ChatGPT Web\n\nno separate API key for the ChatGPT model\n\n2.7k+ stars and still actively updated\n\nworth checking if you already use Codex and want to experiment with ChatGPT Web models", "quotes": [], "likes": 565, "bm": 850, "url": "https://x.com/k2sbhai/status/2094204471345827923"}, {"ty": "工具/项目", "tp": "模型与 AI 应用", "name": "123olp", "handle": "123olp", "date": "2026-08-29 11:00", "ts": "2026-08-29T02:00:00.000Z", "text": "累计消耗约 2000人民币 的 token，终于把17册《数理化自学丛书》从原始扫描 PDF 整理成电子书：\n\nUnlimited-OCR 提取，GPT 网页版校订与重建，得到 Markdown、4,981个图片资源及可重排 EPUB3（88,412个 MathML 公式）\n\n文件与 EPUB 获取👇\nhttps://github.com/tradecatlabs/shulihuazixuecongshu https://x.com/123olp/status/2093519004061315330/video/1 https://twitter.com/Phoenixyin13/status/2092749800558981382", "quotes": [{"type": "quoted", "text": "我一直很好奇1977、1978年高考的人自学的核心路径，经过查阅，大致是这样的。\n\n大部分人的核心工具，是上海科技出版社的《数理化自学丛书》。这是当时最关键的神器。全套共17本、我记得是数学9本 + 物理4本 + 化学4本，内容系统、严谨，专门按高中知识体系编写，非常适合没有老师的人自学。\n听说，1977年恢复高考消息出来后，出版社紧急再版重印，印量巨大（据说超过6000万册），一度洛阳纸贵，很多人通宵排队买，甚至有人把书整本手抄寄给外地的亲戚，真的是极度受欢迎。\n\n很多后来考上好大学的人，都直接说：\n“把《数理化自学丛书》认真看完、题做完，就可以去考了。”\n\n具体怎么学呢？当时的实际操作很朴素，但极其扎实：\n1.把书系统读一遍\n按章节顺序看，理解概念和推导过程，不是那种死记硬背公式的方法。\n2.大量做书里的习题\n这套书的习题量很大，而且难度适中、循序渐进。很多人回忆自己一个晚上把电磁学大半本书看完并做了200道题。\n3.找旧试卷练手\n能找到文革前的高考试卷或复习资料就更好，用来检验自己学到什么程度。\n4.互相交流\n有的地方知青会组成小复习小组，互相讲解、讨论难题；也有人找懂一点的工程师、老教师请教。\n\n很多人是白天干活、上学，晚上挑灯夜战到凌晨。1977年从消息公布到考试只有一个多月，1978年相对从容一点。\n\n我一直在思考，为什么当时那样差的条件，自学反而容易出成绩？\n文革期间正规中学教育质量普遍很一般，很多高中生实际也没学多少真正的高中内容（学校教工业基础、农业基础知识之类）。\n所以，一个认真自学的初中生，知识储备不一定比普通高中生差多少。\n高考恢复初期，题目相对更基础、更注重基本功，不像后来那么卷、那么难。\n那一代人有强烈的内驱力和珍惜机会的心态，愿意投入极大的时间。\n\n可以这样讲，AI时代，如果我还是没有把这些本科课or研究生课学好，基本我也再没什么颜面回望先贤了。\n\n那代人是在几乎没有系统教育资源、没有老师、没有正规教材的情况下，靠一套自学丛书和极强的内驱力，硬把高中甚至大学内容啃下来的。\n今天资源丰富到顶级教材、录播课、论文、代码、即时答疑、个性化讲解……全都触手可及。如果最终我没有拿到Summa cum laude，只能证明我对自己严重不诚实。\n\n明明有更好的工具，却没有用出对应的结果，那就是极度需要反思的事情。\n\n当然，把课学好，考试分数好看、作业按时交这些都是最基本的。\n把一门课学到能重新推导核心结论、能发现教材里的漏洞、能把不同课程的知识主动交叉、能用它去解释新问题，更重要。\nAI时代，反而更容易让人陷入假勤奋，看了很多课、记了很多笔记、问了很多问题，AI回应了你的问题，你就觉得掌握。但掌握的深度却很浅。\n工具太方便，人很容易用看起来很努力来替代真正理解的程度。\n\n接下来的本科学习，高标准、高要求、高效率，深度思考，和自己较劲，勇攀高峰。", "who": "@?", "url": "https://x.com/i/status/2092749800558981382"}], "likes": 1446, "bm": 2202, "url": "https://x.com/123olp/status/2093519004061315330"}, {"ty": "工具/项目", "tp": "开发与基础设施", "name": "码农暖爸", "handle": "Delroy715", "date": "2026-08-30 09:19", "ts": "2026-08-30T00:19:00.000Z", "text": "在 Cloudflare 上构建最好的 Gmail 替代品\n\n今天继续给兄弟们\n分享一个开源仓库：Mailflare\n已经 1300 星了\n这是跑在 Cloudflare 上的自托管邮箱，不是传统邮服：\n\n用自己的域名收发信，收件、已发、草稿、垃圾箱都有\n\n支持共享邮箱、转发、附件进 R2\n\n带 AI，能摘要、分拣、起草回复\n\n设置无限自定义域名邮箱\n\n仓库已放评论区👇\n喜欢的兄弟点赞收藏，防止用的时候找不到\n\n#OpenSource #Cloudflare #Email #IndieHackers #AITools https://x.com/hieuSSR/status/2093645064270708982/video/1", "quotes": [], "likes": 410, "bm": 670, "url": "https://x.com/Delroy715/status/2093855974595658023"}, {"ty": "生活娱乐", "tp": "搞笑与影视", "name": "Joy Liu", "handle": "joyliumacro", "date": "2026-08-30 05:53", "ts": "2026-08-29T20:53:10.000Z", "text": "建议用AI写长文的朋友们，往视频方向发展一下，这访谈太有深度了😂 https://twitter.com/lengxiaohua/status/2093551021578699090", "quotes": [{"type": "quoted", "text": "这个台词水准有点高，三四层楼那么高。👍 https://x.com/lengxiaohua/status/2093551021578699090/video/1", "who": "@?", "url": "https://x.com/i/status/2093551021578699090"}], "likes": 95, "bm": 116, "url": "https://x.com/joyliumacro/status/2093804171816267946"}, {"ty": "Skill", "tp": "编程与工程", "name": "Ben Holmes", "handle": "BHolmesDev", "date": "2026-08-29 01:09", "ts": "2026-08-28T16:09:16.000Z", "text": "Introducing /skill-doctor v1\n\nSkill doctor is a skill that improves your skills:\n\n- Crawls your past CC, Codex, or Warp convos\n- Scores them for efficiency and code quality\n- Proposes diffs to your skills that you'd actually merge (STE-100 approved)\n\nhttp://warp.dev/skill-doctor 🔖", "quotes": [], "likes": 2543, "bm": 3808, "url": "https://x.com/BHolmesDev/status/2093370341418582346"}, {"ty": "Prompt", "tp": "编程与代码审查", "name": "KC", "handle": "ScarletKc", "date": "2026-08-28 12:39", "ts": "2026-08-28T03:39:56.000Z", "text": "最快的懒人版：\n\n直接把这句话丢给 Claude Code、Codex 或其他能操作终端的 AI：\n\n帮我给当前电脑配置 GitHub SSH commit signing，让以后本地 git commit 默认能被 GitHub 验证并显示 Verified。先检查现有 SSH key 和 Git 配置，优先复用现有 ed25519 key，不要覆盖或删除已有配置，不要读取或上传私钥。需要我在 GitHub 网页操作的步骤单独告诉我。\n\n然后跟着它操作就行。", "quotes": [{"type": "replied_to", "text": "GitHub 上 commit 后面那个绿色 Verified，其实几分钟就能配好。\n\n我发现好多写了几年代码的人，到现在本地提交还是没有这个标。\n\n其实不用折腾 GPG，SSH 就能搞定，最快甚至可以直接让 AI 帮你配。\n\n教程放下面：", "who": "@ScarletKc", "url": "https://x.com/i/status/2093181735546802546"}], "likes": 7, "bm": 5, "url": "https://x.com/ScarletKc/status/2093181765544489365"}, {"ty": "资讯", "tp": "模型与平台动态", "name": "karminski-牙医", "handle": "karminski3", "date": "2026-08-27 17:39", "ts": "2026-08-27T08:39:48.000Z", "text": "劲爆, 我给刚发布的 Apodex 1.1 出了个极其变态的实战难题, 它真的跑通了!\n\n我直接打包了120万条日志, 里面包含真实的提权攻击的 Web Server 日志(用的是 Zenodo Dataset). \n\n然后让他帮我把黑客的攻击方式抓出来, 还要给我写防火墙规则拦截攻击. 结果它真的做到了, 从分析到写规则一气呵成, 具体过程在这里:\n\nhttps://www.apodex.ai/share/d9a30160-0c90-43d4-ace0-8152dd11880e\n\n#Apodex #AgentOS #网络安全 #SystemScaling #大模型实战", "quotes": [], "likes": 274, "bm": 193, "url": "https://x.com/karminski3/status/2092894838492655713"}, {"ty": "Skill", "tp": "编程与工程", "name": "meng shao", "handle": "shao__meng", "date": "2026-08-21 21:19", "ts": "2026-08-21T12:19:09.000Z", "text": "Cursor Team Kit 新增了一个 SKill @cursor_ai \n\n「Thermo-Nuclear Code Quality Review」\nhttps://cursor.com/marketplace/cursor/cursor-team-kit\n一套极端严格的代码可维护性审查方法论，它不满足于\"代码能跑\"，而要求审查者主动寻找 \"code judo\" ——在保持行为不变的前提下，通过重构让实现戏剧性地更简洁、更直接、更优雅。\n\n八条不可妥协的审查标准\n1. 结构性简化优先 — 寻找能让整个分支、辅助函数、模式消失的重构，让代码\"事后看显得必然\"。\n2. 1k 行红线 — PR 不应将文件从 <1000 行推过 1000 行，除非有强结构理由；优先拆分。\n3. 拒绝意面增长 — 警惕在无关流程中插入临时 if、特殊分支、一次性布尔标志；这是设计问题，不是风格问题。\n4. 清理设计而非接受\"能用\" — 行为可不变时，结构必须更干净；优先删除移动部件而非分散复杂度。\n5. 直接、无聊、可维护 > 魔法代码 — 警惕脆弱的临时机制、隐藏简单数据假设的泛型、空壳包装层。\n6. 类型与边界清洁 — 质疑不必要的 any/unknown/可选/cast；优先显式类型契约而非松散对象。\n7. 逻辑归位 + 复用既有工具 — 特性逻辑不应泄漏到共享路径；优先 canonical helper 而非自造近似品。\n8. 警惕串行编排与非原子更新 — 独立工作不应无理由串行；相关更新应原子化，避免半应用状态。\n\n这个 Skill 的真正力量在于它对抗 AI 代码生成的典型病灶：冗余包装层、散落的特殊分支、跨层泄漏、空壳抽象、复制粘贴的近似 helper。它把\"代码质量\"从模糊审美拉成可操作的检查清单，是审查 AI 生成 PR 时的利器。", "quotes": [], "likes": 99, "bm": 148, "url": "https://x.com/shao__meng/status/2090775712814993690"}, {"ty": "深度文章", "tp": "AI 编程实践", "name": "Guangzheng Li", "handle": "iguangzhengli", "date": "2026-08-21 13:09", "ts": "2026-08-21T04:09:42.000Z", "text": "AI 时代代码质量还重要吗？如何让 Agents 写出更好的代码？\n\n如果你也有这个困惑，强烈推荐 Matt 最新一期的 YouTube\n\n对话人是 Bob，《Clean code》 的作者，写了半个世纪的代码了，个人最喜欢的三本代码质量的书之一的作者\n\nhttps://www.youtube.com/watch?v=zcLPGC-tvgk", "quotes": [], "likes": 218, "bm": 278, "url": "https://x.com/iguangzhengli/status/2090652539427672086"}, {"ty": "工具/项目", "tp": "开发与基础设施", "name": "ahhhhfs", "handle": "abskoop", "date": "2026-08-21 16:25", "ts": "2026-08-21T07:25:11.000Z", "text": "同花顺官方出了套 A 股数据接口：同花顺金融数据API（Financial-API）\n\n支持行情快照、日 K、财报、板块、涨停 / 龙虎榜，REST、Python、CLI、MCP 共用一把 Key，还能配合本地 DuckDB。\n\n比较适合接进 Cursor、Claude 这类 Agent，做量化脚本、金融数据分析和自动化工作流，也能少维护一套自己的爬虫。\n\n👉 https://www.ahhhhfs.com/82119/", "quotes": [], "likes": 1310, "bm": 1700, "url": "https://x.com/abskoop/status/2090701734138274062"}, {"ty": "工具/项目", "tp": "AI Agent 与编程工具", "name": "Simon He", "handle": "simon_he1995", "date": "2026-08-21 21:43", "ts": "2026-08-21T12:43:10.000Z", "text": "#markstream 真的就是那么滑，@tibo 真不考虑收购 markstream，集成进 codex 吗，天天看codex，普通 text 输出都在全量闪烁重绘🧐 https://x.com/simon_he1995/status/2090781756974878927/video/1", "quotes": [], "likes": 140, "bm": 124, "url": "https://x.com/simon_he1995/status/2090781756974878927"}, {"ty": "Skill", "tp": "设计与 UI", "name": "eric zakariasson", "handle": "ericzakariasson", "date": "2026-08-22 00:59", "ts": "2026-08-21T15:59:06.000Z", "text": "/scandinavian-design\n\nbuilt a skill that turns any site into scandi minimalism!\n\nnpx skills add ericzakariasson/scandinavian-design\n\ntry it: https://scandinavian-design.vercel.app https://x.com/ericzakariasson/status/2090831063845380516/video/1", "quotes": [], "likes": 3663, "bm": 4380, "url": "https://x.com/ericzakariasson/status/2090831063845380516"}, {"ty": "生活娱乐", "tp": "搞笑与影视", "name": "Beauty of Nature 🥀", "handle": "NaturalEye78321", "date": "2026-08-21 01:41", "ts": "2026-08-20T16:41:36.000Z", "text": "Omg 😱😱😱 https://x.com/NaturalEye78321/status/2090479374101610515/video/1", "quotes": [], "likes": 9619, "bm": 1187, "url": "https://x.com/NaturalEye78321/status/2090479374101610515"}, {"ty": "资讯", "tp": "模型与平台动态", "name": "独立开发者William", "handle": "DLKFZWilliam2", "date": "2026-08-21 16:07", "ts": "2026-08-21T07:07:51.000Z", "text": "我申请了，秒过！Apple送钱了啊啊啊啊啊！\n\n朋友们都可以去试试！Apple免费的云端AI Private Cloud Compute（PCC）调用云端的 Apple Foundation Models，一分钱不要！！！\n\n以后在 App 里我要全部加AI功能了！！！成本为0！！！​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​ 大家快搞起！我把链接放进来：👇 https://x.com/DLKFZWilliam2/status/2090697370732548488/photo/1", "quotes": [], "likes": 1447, "bm": 2335, "url": "https://x.com/DLKFZWilliam2/status/2090697370732548488"}, {"ty": "工具/项目", "tp": "AI Agent 与编程工具", "name": "Leo｜LeoLabs.me", "handle": "runes_leo", "date": "2026-08-20 23:15", "ts": "2026-08-20T14:15:35.000Z", "text": "上个月我发过这条：ChatGPT 网页聊天和 Codex 是两块分开的额度。\n\n但当时我只跑通了一个很笨的办法：\n\nCodex 打包任务 → 我手动丢给网页 ChatGPT → 它做完 → 再搬回本地编译测试。\n\n它证明了 Chat 里确实还有另一桶额度，却没有真正解决问题：ChatGPT 自己碰不到电脑，派发、搬运和验收仍然要靠 Codex，交接本身继续烧 Codex 额度。\n\n今天这个缺口终于补上了。\n\n现在 Codex / Work 的额度用完后，我可以直接在普通 ChatGPT 聊天窗口里，让它继续操作本地电脑干活：\n\n- 读本地文件\n- 改文件\n- 跑命令\n- 跑测试\n- 验证结果\n\n这条链路走的是 Chat 这边的可用额度，不需要再把代码和结果人工搬来搬去。\n\n这个想法来自两条线索。\n\n昨天另一条额度帖的评论区里，@studyouwei 提到：他用 DevSpace 把本地目录接到了 ChatGPT Chat，相当于用 Chat 的额度搞 coding。\n\n差不多同一时间，微信群里有群友提到了 MCPX。\n\n我把两条线索合起来，自己跑了一遍。通了。\n\n最小实现是：\n\n1. 在自己的电脑上运行 MCPX，只登记准备交给 AI 工作的项目目录\n2. 给本地 MCPX 配一个 HTTPS + 鉴权的 Remote MCP 入口，不要裸开端口\n3. 在 ChatGPT 设置里创建或启用 custom MCP app\n4. 绑定 Workspace；需要跨聊天持续接力，再使用 Remote Session\n5. 回到普通 ChatGPT 对话，直接让它 read / edit / execute / verify\n\n这篇稿子本身，就是用这条链路完成的。\n\n它在这个普通 ChatGPT 对话里回查旧帖和旧视频、更新本地稿件、再跑验证。不是演示，是真的在继续工作。\n\n照抄之前，先看三个边界：\n\n第一，先确认你的 ChatGPT 设置里有没有 custom MCP 入口。不同账户和 rollout 可能不一样。\n\n第二，Workspace 约束的是文件工具，不代表 execute 天然只能看这个目录。命令权限要单独卡。\n\n第三，公网入口必须有 HTTPS 和鉴权。资金、账号、凭证、公开发布、部署、生产等动作，继续单独确认。\n\n所以这次和上个月最大的区别很简单：\n\n上次只是发现 Chat 里还有一桶额度。\n这次终于把这桶额度接到了电脑上，能直接完成真实工作。\n\nCodex / Work 额度用完后，不一定只能买号或者等重置。\n\n至少现在，我还能换到普通 ChatGPT 对话里，接着干。\n\nhttps://x.com/runes_leo/status/2082347684212744486", "quotes": [], "likes": 688, "bm": 1245, "url": "https://x.com/runes_leo/status/2090442625820356780"}, {"ty": "Skill", "tp": "设计与 UI", "name": "sida", "handle": "s1dashu", "date": "2026-08-18 23:26", "ts": "2026-08-18T14:26:07.000Z", "text": "最近做了一个新的 Logo Skill，效果挺不错的：\nhttps://github.com/s1dashu/ip-as-logo-skill\n\n背景是：最近发现 grok bot, coze, workbuddy, 豆包, kiro 等等产品，其实都是在将产品 IP 形象直接作为产品的 Logo，Logo 辨识度极高，同时增强 IP 记忆，感觉挺不错的。\n\n所以最近我的所有产品 logo 都有一个对应的可爱小 IP，并且直接使用 IP 作为 Logo，Vibe 的产品多了，逐渐就形成了这个Skill。\n\n这个 skill 的核心：\n1. Logo First，IP Second：首先保证它是一个简洁、清晰、易识别的 Logo，其次才是一个可爱的 IP 形象，避免复杂插画感。\n2. 极简构成：只保留最有辨识度的轮廓与五官，用尽可能少的形状完成设计，缩小后依然清楚。\n3. 圆润、浑厚的线条：避免尖角、细线和锐利结构，让形象更加友好、稳定，也更适合作为 App Icon。\n4. Flat-first 超轻拟物：整体仍以平面设计为主，只加入非常微妙的阴影、压痕和明暗层次，增强质感，但不会变成厚重的 3D 图标。\n5. 克制的色彩系统：支持单色或双色 IP；通常 IP 内不超过两种颜色，加上纯色背景，整张 Logo 最多控制在三种主色以内。\n6. 高占比人格化构图：IP 从左下角或右下角探出，占据较大的画面比例；通过简单的眼睛、嘴巴和姿态建立性格与记忆点。\n一句话概括：把一个可爱的小 IP，压缩成一个精致的产品 Logo。", "quotes": [], "likes": 5302, "bm": 6784, "url": "https://x.com/s1dashu/status/2089720502483067016"}, {"ty": "Skill", "tp": "编程与工程", "name": "姚金刚", "handle": "yaojingang", "date": "2026-08-18 12:19", "ts": "2026-08-18T03:19:00.000Z", "text": "对元skill进行了一轮大的迭代和更新，已推送到GitHub\n更新报告及元skill链接，放在了评论区\n\n这次迭代的逻辑：\n1、对元Skill的10个核心维度，进行依次能力拆解和重构，并参考对应能力模块的优秀工程思路进行迭代，大幅提升这10个核心维度的能力，包括意图识别、上下文效率、跨平台能力、触发边界等\n2、把工程可发布、阶段一质量完成与声明拆成独立判定，避免一组局部通过被放大为全局完成\n3、做了3组一共60个skill生成盲测，新版完胜\n\n欢迎体验", "quotes": [], "likes": 28, "bm": 34, "url": "https://x.com/yaojingang/status/2089552618192580835"}, {"ty": "工具/项目", "tp": "网络与代理", "name": "Bojie Li", "handle": "bojie_li", "date": "2026-08-20 22:41", "ts": "2026-08-20T13:41:37.000Z", "text": "闭关搞出了一个多年前想做的广域网优化协议，正好是七夕，就叫 Queqiao 吧。在 MSRA 的时候直连外网的专线非常爽，一般只能通过香港中转才能达到这种性能。最近测了下发现，中美之间大多数情况下都是 erasure channel + upper bandwidth bound，因此自适应的 FEC 非常好用。\n做了一个协议，自己在 Mac 上跑了 3 天非常好用，开源出来。只要在本地和美国的出口网关服务器上分别装上 daemon 就可以用。（Mac/Linux 就是个 daemon 可以搭配现有的客户端使用，iOS/Android 自己开发测试中）\n欢迎测试 & star & 提 issue！\nhttps://github.com/bojieli/queqiao", "quotes": [], "likes": 528, "bm": 720, "url": "https://x.com/bojie_li/status/2090434079183491244"}, {"ty": "深度文章", "tp": "AI 编程实践", "name": "govin.eth | G哥", "handle": "goan999999", "date": "2026-08-19 23:02", "ts": "2026-08-19T14:02:00.000Z", "text": "Codex 5.6 真正与普通人拉开 90% 差距的，不是 prompt，而是你会不会配置 config.toml\n\n很多人用 Codex 还停留在“打开就聊”，但真正重度使用的人，早就把模型、任务模式、项目规则和自动化流程写进配置里了。\n\n现在 Codex 5.6 最值得折腾的 4 个专业设置：\n\n1️⃣ 固定模型 + Reasoning Effort\n\n别每开一个任务都重新选模型。\n\n把默认模型和推理强度写进 ~/.codex/config.toml，日常任务追求速度，复杂架构任务再提高 reasoning effort。\n\n输入prompt：\n\n请检查我当前 Codex 5.6 实际支持的模型和 reasoning effort 配置，不要猜测或使用已经废弃的参数；然后修改 ~/.codex/config.toml，为日常 Coding 设置合理的默认模型与推理强度，并告诉我具体修改了哪些字段、为什么这样配置，最后验证配置是否成功生效。\n\n2️⃣ 不同任务建立 Profile\n\n写功能、修 Bug、Code Review、做系统架构，根本不应该用完全相同的配置。\n\nCodex 支持 Profiles，可以针对不同任务切换不同工作模式。\n\n配置用的prompt，直接用：\n\n请基于我当前 Codex 5.6 配置创建 3 套 Profile：fast-dev 用于快速开发和小修改，code-review 用于 PR 和代码审查，deep-architecture 用于复杂系统设计；分别配置合适的模型、reasoning effort 和执行策略，不使用已经废弃的配置项，并告诉我之后如何通过 --profile 切换使用。\n\n3️⃣ 给每个项目建立独立配置\n\n全局配置解决“你习惯怎么工作”，项目配置解决“这个项目必须怎么工作”。\n\n把技术栈、测试方式、项目约束和工具配置放进项目自己的 .codex/config.toml，不要每开新会话都重新解释。\n\n直接输入：\n\n请分析当前项目的技术栈、目录结构、测试方式和开发工具，为这个项目设计一份最小化的 .codex/config.toml，只写当前项目真正需要的配置，不覆盖无关的全局设置；完成后解释每项配置的作用，并检查项目级配置是否能够被当前 Codex 正确加载。\n\n4️⃣ 用 Hooks 把规则变成自动执行\n\n最浪费时间的方式，就是每次都提醒 Codex 改完记得跑测试、提交前记得检查、别忘了扫安全问题。\n\n现在可以直接把这些规则做成 Hooks，在生命周期节点自动触发。Codex 当前官方配置已经支持 lifecycle hooks。\n\n直接用这段：\n\n请检查当前项目适合配置哪些 Codex lifecycle hooks，并为我建立最精简的一套自动化流程：代码修改完成后运行必要测试和 lint，关键变更执行安全检查，提交前执行最终验证；只配置真正必要的 Hook，避免重复执行和拖慢开发速度，完成后实际触发一次并验证每个 Hook 是否正常工作。\n\n真正高效的 Codex 启动就知道该怎么工作。\n\n赶紧配置试试吧！", "quotes": [], "likes": 797, "bm": 1251, "url": "https://x.com/goan999999/status/2090076819815026918"}, {"ty": "深度文章", "tp": "纯链接（X 长文等）", "name": "Han Cheng e/acc", "handle": "ashfold", "date": "2026-07-15 16:29", "ts": "2026-07-15T07:29:11.000Z", "text": "http://x.com/i/article/2077289347616059392", "quotes": [], "likes": 245, "bm": 569, "url": "https://x.com/ashfold/status/2077294392059232269"}, {"ty": "深度文章", "tp": "行业与观点", "name": "Maker Jackie", "handle": "maker_jackie", "date": "2026-08-19 18:47", "ts": "2026-08-19T09:47:43.000Z", "text": "真心推荐独立开发者/创业者这本小书： 随心所欲，很短，看完花不了多少时间，讲的非常好\n\nAnything You Want · 面向新型创业者的短课\n\n这里有中译版本： https://anything-you-want.01mvp.com/", "quotes": [], "likes": 341, "bm": 716, "url": "https://x.com/maker_jackie/status/2090012828778594766"}, {"ty": "深度文章", "tp": "AI 编程实践", "name": "Sac", "handle": "Saccc_c", "date": "2026-08-19 21:43", "ts": "2026-08-19T12:43:08.000Z", "text": "如果你的Codex近期额度消耗很快，很可能账号被风控了\n\n根据社区反馈，有下面几种可能原因：\n- IP质量低，节点多人共享导致滥用\n- 频繁切换账号，跨账号复用会话（比如切换多个plus并在同一会话继续任务）\n- 把登录凭证交给不透明的反代、中转或第三方工具\n\n当然，你也可以通过下面这个方式自测一下用量是否正常：\n\n1、先进入官方的用量页面\nhttps://chatgpt.com/codex/cloud/settings/analytics\n2、打开浏览器开发者工具并进入Network页面\n3、在 Codex 用量页面切换7天或1个月的时间范围，搜索daily-workspace-usage-counts\n4、查看preview下total里面的数值来确认消耗是否正确\n其中：\n- credits：记录的额度消耗\n- tokens：Token 用量\n- turns：任务轮次\n\n根据部分网友实测，pro20x的credits大概在5w-6w，那么Pro 5x理论约 1.25w-1.5w，plus约2500-3000", "quotes": [], "likes": 1223, "bm": 1892, "url": "https://x.com/Saccc_c/status/2090056975392571538"}];const UPD='2026-11-03 09:10';

<div class="foot"><span>❤ ${d.likes} · 🔖 ${d.bm}</span><a href="${d.url}" target="_blank" rel="noopener">查看原帖 ↗</a></div></div>`;
