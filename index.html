tries() 检测到迁移后调用 _rewriteFile()，核心逻辑可以简化为：\n\nconst fd = openSync(this.sessionFile, \"w\"); // ← 关键就是这一个字母 w\nfor (const entry of this.fileEntries)          \n// 把\"我内存里记的历史\"从头写一遍\nwriteFileSync(fd, JSON.stringify(entry)+\"\\n\");\n\n\"w\" 模式的含义：打开的一瞬间，文件先被清空成 0 字节，然后从头写\n\n一种可能的时序是：\n\n1. A 读到了旧版本历史，尚未开始重写\n2. B 也读到旧版本历史，先完成迁移，然后追加了一条新消息\n3. A 开始重写，以 \"w\" 打开同一个文件，将其清空\n4. A 写回自己之前读到的历史，其中没有 B 的新消息\n\nB 的这条消息就从会话文件中丢失了。树结构无法阻止这种覆盖，也无法把被覆盖的记录恢复出来", "quotes": [], "likes": 75, "bm": 99, "url": "https://x.com/htt_keyboarder/status/2111656199657848922"}, {"ty": "工具/项目", "tp": "开发与基础设施", "name": "Pi", "handle": "pidotdev", "date": "2026-10-16 23:22", "ts": "2026-10-16T14:22:13.000Z", "text": "For your weekend reading: Build with Pi Durable on Cloudflare, a walkthrough of how to create a multiplayer chat agent, including subagents, on Durable Objects.\n\nhttps://earendil.com/posts/pi-durable-on-cloudflare/", "quotes": [], "likes": 1612, "bm": 1940, "url": "https://x.com/pidotdev/status/2111100406612861105"}, {"ty": "生活娱乐", "tp": "搞笑与影视", "name": "Tamir & Tadilat", "handle": "TamirveTadilat", "date": "2026-10-17 01:00", "ts": "2026-10-16T16:00:01.000Z", "text": "İşi, işi bilene… https://x.com/TamirveTadilat/status/2111125014925979656/video/1", "quotes": [], "likes": 904, "bm": 209, "url": "https://x.com/TamirveTadilat/status/2111125014925979656"}, {"ty": "教程/学习", "tp": "实用技巧", "name": "lifcc", "handle": "mylifcc", "date": "2026-10-17 14:02", "ts": "2026-10-17T05:02:00.000Z", "text": "兜兜转转最后发现google云是真的香 https://x.com/mylifcc/status/2111321808515260876/photo/1", "quotes": [], "likes": 163, "bm": 123, "url": "https://x.com/mylifcc/status/2111321808515260876"}, {"ty": "深度文章", "tp": "Agent 工程", "name": "野生肯尼", "handle": "KennyYeah01", "date": "2026-10-16 15:24", "ts": "2026-10-16T06:24:00.000Z", "text": "@chasen_liao Tool description 理论上说清楚三个方面就行：what the tool does、when it shoule be used、how it behaves。至于详尽程度感觉得调🤣，不同的模型也会对效果有影响。感兴趣可以看看：https://www.anthropic.com/engineering/writing-tools-for-agents", "quotes": [{"type": "replied_to", "text": "有一个问题，想问问各位大佬：\n\n给 Agent 的 Tools 描述越少越好还是越详细越好？\n\n描述极简的意思就是说 只告诉这个工具是做什么的 然后呢 参数要怎么传\n\n描述详细的话 是会给 few shot, 还有一些边界情况的限定", "who": "@chasen_liao", "url": "https://x.com/i/status/2110926594617524367"}], "likes": 13, "bm": 22, "url": "https://x.com/KennyYeah01/status/2110980055690318047"}, {"ty": "资讯", "tp": "模型与平台动态", "name": "KeJun", "handle": "yrmkejun", "date": "2026-10-15 20:06", "ts": "2026-10-15T11:06:50.000Z", "text": "我擦，一觉醒来已经做了 200 多个低多边形3D模型了 \n0 Token 消耗\n\n受 @Fomsky_Wei 的启发，我直接给设立了 10000 个不同场景不同类目的目标！ https://x.com/yrmkejun/status/2110688848267087993/photo/1 https://twitter.com/yrmkejun/status/2109892467319300212", "quotes": [{"type": "quoted", "text": "不懂就问，如何最大化利用 GPT Dots？ https://x.com/yrmkejun/status/2109892467319300212/photo/1", "who": "@yrmkejun", "url": "https://x.com/i/status/2109892467319300212"}], "likes": 941, "bm": 1079, "url": "https://x.com/yrmkejun/status/2110688848267087993"}, {"ty": "深度文章", "tp": "行业与观点", "name": "朱峰", "handle": "zhufengme", "date": "2026-10-16 20:06", "ts": "2026-10-16T11:06:01.000Z", "text": "想检测出来用户在非指定地区使用的话，其实IP地址数据判断都不用，只需要测量你发起请求之后，报文往返的TTL（NTP协议就是这个原理），与同IP段的其他用户做个平均差，就足够把赛博居民筛出来了。只是单一一种判断手段可能会误杀一些真的是弱网或者企业VPN回拨用户，所以机制一定是积分制的，根据你的IP、支付、聊天内容综合判断的。能否筛出来，只是时间和代价问题，基本没有对抗的可能。", "quotes": [], "likes": 115, "bm": 61, "url": "https://x.com/zhufengme/status/2111051029353808348"}, {"ty": "工具/项目", "tp": "AI Agent 与编程工具", "name": "Keane", "handle": "keane42443", "date": "2026-10-16 12:08", "ts": "2026-10-16T03:08:03.000Z", "text": "@realchendahuang 大黄老师可以看看这个项目！专门就是针对这个问题来的。把所有agent的上下文都维护到一个地方，任何agent都可以使用\nhttps://github.com/zqiren/Orbital https://x.com/keane42443/status/2110930743551787266/video/1", "quotes": [{"type": "replied_to", "text": "我很好奇一个问题：\n\n大家在不同的 Coding Agent 之间到底怎么共享上下文？\n\n比如我现在在Claude Code里跑完了一个项目，或者项目跑到一半，然后需要在CodeX里继续。\n\n这两块的上下文怎么衔接比较好？有没有优雅的解决方案？", "who": "@realchendahuang", "url": "https://x.com/i/status/2110925141815574943"}], "likes": 698, "bm": 1265, "url": "https://x.com/keane42443/status/2110930743551787266"}, {"ty": "教程/学习", "tp": "实用技巧", "name": "Leo · Building w/ AI", "handle": "leo114119", "date": "2026-10-16 11:38", "ts": "2026-10-16T02:38:26.000Z", "text": "实测！原来 workbuddy上deepseek v4.1 flash给的额度比opencode go 和 commandcode goat 还要多。。。。。\n\n由于昨天ds 崩了以后，发现workbuddy居然是全转发 \n再加上opencode开放免费以后，稳定性明显下降\n\n于是打算转 workbuddy,本来以为额度会少一点\n没想到实测以后\n\nworkbuddy的量反而是最高的：（加上签到积分）\n\n实测 70 月包月的档，一个月可以用 8.5B 的token\n\n具体对比看图吧：", "quotes": [], "likes": 122, "bm": 75, "url": "https://x.com/leo114119/status/2110923290449731833"}, {"ty": "生活娱乐", "tp": "搞笑与影视", "name": "加密疯子", "handle": "siyuanyuze", "date": "2026-10-15 20:23", "ts": "2026-10-15T11:23:32.000Z", "text": "我不许你还没看过这部韩国喜剧电影\n\n全程爆笑\n\n专治不开心 https://x.com/siyuanyuze/status/2110693051156853223/video/1", "quotes": [], "likes": 867, "bm": 484, "url": "https://x.com/siyuanyuze/status/2110693051156853223"}, {"ty": "工具/项目", "tp": "AI Agent 与编程工具", "name": "AstroHan", "handle": "AstroHanRay", "date": "2026-10-15 11:51", "ts": "2026-10-15T02:51:45.000Z", "text": "现在几乎主要的 Agent 都是用 Electron 方案，Codex、Claude...一旦同时跑的 Session 和工作多了，性能消耗和资源占用都很大，尤其是 Web 渲染的各种动画。\n\n我们在把整个 Maka 重写为 Rust + GPUI。为未来几十/上百/上千个 agent 并行做好准备。\n\n已经几乎可用了：\nhttps://github.com/apache/maka/tree/rust-preview", "quotes": [], "likes": 421, "bm": 498, "url": "https://x.com/AstroHanRay/status/2110564255158452368"}, {"ty": "工具/项目", "tp": "AI Agent 与编程工具", "name": "马天翼", "handle": "fkysly", "date": "2026-10-14 14:53", "ts": "2026-10-14T05:53:10.000Z", "text": "其实 Sub2API 就是现在最佳的 AI Tokens 解决方案，找个阿里云服务器搭建一下。\n\n所有的个人订阅全部挂上去，还能自动协议转换、控制并发数，模型映射等等。\n\n我还自己加了 websearch 补丁，也就是给不支持 websearch 的第三方便宜订阅补充了 websearch 能力（已提交pr）。\n\n还能支持 tailscale 到内网，把自己本地部署的本地模型也挂上来。\n\n支持最新的 opencode、commandcode、甚至是 jev 模型订阅。\n\n太好用了只能说，而且现在 A/ 也不咋封禁 Sub2API 了。\n\n你可以开10个不同模型的订阅，全部自动映射好，然后 Claude Code/Codex 里当官方模型去用，可以给亲戚朋友一起用，还不需要的挂着 VPN。\n\n真正做到一个 API Key 能走天下。Sub2API 真是这个时代最好的开源项目。", "quotes": [], "likes": 135, "bm": 169, "url": "https://x.com/fkysly/status/2110247524024168557"}, {"ty": "资讯", "tp": "模型与平台动态", "name": "fofr", "handle": "fofrAI", "date": "2026-10-14 01:20", "ts": "2026-10-13T16:20:34.000Z", "text": "Argon has this amazing natural understanding of the world. It can do so many things from first principles.\n\nHere's a pelican riding a bike, using fourier epicycles. \n\nVideo made by Argon.\nTime-synced Lyria 3.5 music prompted by Argon. https://x.com/fofrAI/status/2110043023954284889/video/1 https://twitter.com/fofrAI/status/2110039904872771827", "quotes": [{"type": "quoted", "text": "Gemini 4 Argon is live.\nhttps://blog.google/innovation-and-ai/models-and-research/gemini-models/introducing-gemini-4-argon/\n\nThere's a lot to show you. https://x.com/sundarpichai/status/2110038898009407584/video/1", "who": "@fofrAI", "url": "https://x.com/i/status/2110039904872771827"}], "likes": 8424, "bm": 3173, "url": "https://x.com/fofrAI/status/2110043023954284889"}, {"ty": "资讯", "tp": "模型与平台动态", "name": "matharium", "handle": "matharium", "date": "2026-10-09 07:56", "ts": "2026-10-08T22:56:00.000Z", "text": "Each coordinate of a closed outline has its own real Fourier series: x(t) = ∑ (aₖ cos kt + bₖ sin kt), and the same for y.\n\nA cosine and sine of frequency k make one arm of length √(aₖ² + bₖ²) turning k times per lap. One chain sets x, one sets y, and the pen sits where their guides cross. With N harmonics per axis the knight is off by 30.2 % of its height at N = 1, 0.70 % at N = 50.\n\nAt N = 1 both coordinates are pure sinusoids: an ellipse.", "quotes": [], "likes": 11651, "bm": 5468, "url": "https://x.com/matharium/status/2108330598410625367"}, {"ty": "深度文章", "tp": "纯链接（X 长文等）", "name": "M.", "handle": "wlzh", "date": "2026-10-12 08:57", "ts": "2026-10-11T23:57:22.000Z", "text": "https://x.com/i/article/2109432493976018944", "quotes": [], "likes": 288, "bm": 558, "url": "https://x.com/wlzh/status/2109433207318081885"}, {"ty": "工具/项目", "tp": "设计资源", "name": "lifcc", "handle": "mylifcc", "date": "2026-10-13 11:10", "ts": "2026-10-13T02:10:00.000Z", "text": "为什么你让 Codex / Claude 写的前端页面，永远一股浓浓的“开源模板味”？\n\n因为你只会跟 AI 说：“帮我写一个现代、高级感、极简的落地页。”\nAI 心里的独白：“好，紫蓝渐变 + 圆角 16px + 默认 Tailwind 给你安排上。” 🙃\n\n今天挖到一个很绝的宝藏开源项目：VoltAgent / awesome-design-md。\n\n它把 Vercel、Stripe、Linear、Cursor 这些顶尖产品的 UI 规范，全逆向工程成了 AI 最懂的纯 Markdown 文件（DESIGN.md）。\n\n很多人不知道，Google 之前推过一个概念叫 Stitch DESIGN.md：\n\n不需要 Figma 插件，不需要复杂的 JSON，就用 纯 Markdown 规定好：\n核心色盘与 Accent 角色\n\n字体层级与行高节奏\n组件规范（卡片到底要不要 border？阴影给几层？）\nDo’s & Don'ts（明确禁止 AI 瞎加彩色渐变）\n怎么用？\n\n直接把你喜欢的风格（比如 Stripe 或 Vercel）的 DESIGN.md 扔进项目根目录，或者在 Cursor / Claude 里直接 @ DESIGN.md：\n“参考 DESIGN.md 的规范，帮我重构这个定价页面。”\n\n出来的 UI 质感直接从“外包 Demo”拉升到“估值两千万的 SaaS 产品”。\n\n程序员终于不用求着设计师给切图和规范了。\n\n收藏起来，下次写前端直接抄作业 📌\n（传送门已放留言区 👇）", "quotes": [], "likes": 449, "bm": 648, "url": "https://x.com/mylifcc/status/2109828971802046843"}, {"ty": "工具/项目", "tp": "模型与 AI 应用", "name": "雪瑜", "handle": "xueyu1125", "date": "2026-10-11 22:42", "ts": "2026-10-11T13:42:07.000Z", "text": "@_ARahim_ https://github.com/ARahim3/DigUp/blob/main/docs/demo.gif", "quotes": [{"type": "replied_to", "text": "卧槽，Github上有人做了个基于Google EmbeddingGemma2 小模型的搜索Mac App\n\n比 Mac 自带的 Spotlight 准的多，不仅支持文件名，还支持文件内容查找、图片查找、音频查找\n\n发现作者也在X上 @_ARahim_ https://x.com/xueyu1125/status/2109278327890760093/video/1", "who": "@xueyu1125", "url": "https://x.com/i/status/2109278327890760093"}], "likes": 66, "bm": 155, "url": "https://x.com/xueyu1125/status/2109278374002892948"}, {"ty": "工具/项目", "tp": "模型与 AI 应用", "name": "雪瑜", "handle": "xueyu1125", "date": "2026-10-11 22:41", "ts": "2026-10-11T13:41:56.000Z", "text": "卧槽，Github上有人做了个基于Google EmbeddingGemma2 小模型的搜索Mac App\n\n比 Mac 自带的 Spotlight 准的多，不仅支持文件名，还支持文件内容查找、图片查找、音频查找\n\n发现作者也在X上 @_ARahim_ https://x.com/xueyu1125/status/2109278327890760093/video/1", "quotes": [], "likes": 837, "bm": 1068, "url": "https://x.com/xueyu1125/status/2109278327890760093"}, {"ty": "工具/项目", "tp": "AI Agent 与编程工具", "name": "Geek", "handle": "geekbb", "date": "2026-10-12 12:14", "ts": "2026-10-12T03:14:00.000Z", "text": "太喜欢这种风格，让编码 agent 用一段 JSON 描述生成可交互、可导出为 SVG/PNG/GIF/MP4 的动画架构图。\n\n我用 Codex + Deepseek-V4.1-Flash 生成了一张 Hysteria2 代理原理和一次请求的完整链路，效果太棒了。\n\n模型不用 SVG，只写 30 到 150 行 JSON 说清有什么、怎么连，剩下的布局、连线路由、标签位置、排版和动效交给渲染器。\n\n45 种图表类型加 15 个变体，架构图、时序图、ER 图、看板、甘特、Sankey、Wardley map 都在里面，等距那几种还能用基本体块搭出椅子、笔记本、汉堡和街道。\n\nhttps://github.com/Aryanutkarsh/SeeCode", "quotes": [], "likes": 309, "bm": 456, "url": "https://x.com/geekbb/status/2109482690063822865"}, {"ty": "工具/项目", "tp": "AI Agent 与编程工具", "name": "lifcc", "handle": "mylifcc", "date": "2026-10-12 00:01", "ts": "2026-10-11T15:01:00.000Z", "text": "AI 圈最近一个最性感的脑洞，来自 Cognition（Devin 的母公司）：\n\n他们开源了一个给 AI 做长期记忆的方案 Agent Memory Repo。\n\n你以为顶级团队做 AI 记忆会搞什么高深莫测的向量数据库、知识图谱？ 完全没有。他们的答案极其粗暴且优雅：\n\n给每个 AI 配一个专属的 Git 仓库，让它自己给自己写 Markdown 笔记。\n\n而且最绝的是，他们还给 AI 设计了一个机制，叫——「做梦（Dreaming）」。👇 (1/5)", "quotes": [], "likes": 319, "bm": 460, "url": "https://x.com/mylifcc/status/2109298225584697538"}, {"ty": "工具/项目", "tp": "AI Agent 与编程工具", "name": "FeiZ", "handle": "Fei2411", "date": "2026-10-11 01:20", "ts": "2026-10-10T16:20:17.000Z", "text": "正式介绍开源的 DeepSeek Bot ！（非官方）\n\nDeepSeek Bot ( 简称ds bot ) 是一款基于 DeepSeek Harness ( 简称 dsh ) 的开源插件，让你能够拥有一组持久化的 Bot，使用你自己的 API Key。你可以和你的 Bot 聊天、工作，或者做任何你想做的！\n\n你可以为 ds bot 接入任何你想接入的模型，甚至在未来，你可以直接接入你的本地 agent，这意味着你可以使用自己已有的 ai 订阅。\n\nds bot 继承了 dsh 的“一切皆插件”理念，未来将会有更多可拓展性，迫不及待想看到会发生什么！\n\n仓库地址：https://github.com/FeiZhuLulu/DeepSeek-Bot\n安装：在dsh desktop插件页输入: ds-bot\n\n更多详细信息见评论区↓", "quotes": [], "likes": 1302, "bm": 1652, "url": "https://x.com/Fei2411/status/2108955789117558827"}, {"ty": "Skill", "tp": "写作与效率", "name": "Ding", "handle": "dingyi", "date": "2026-10-11 15:04", "ts": "2026-10-11T06:04:07.000Z", "text": "我愿称之为史上最强 skills\n\nhttps://skills.wheresryan.sh/anatomy https://x.com/dingyi/status/2109163115627913394/video/1", "quotes": [], "likes": 6286, "bm": 8887, "url": "https://x.com/dingyi/status/2109163115627913394"}, {"ty": "深度文章", "tp": "Agent 工程", "name": "Bojie Li", "handle": "bojie_li", "date": "2026-10-10 12:32", "ts": "2026-10-10T03:32:06.000Z", "text": "我要改变一下对 Jev 类模型的观点。刚发布的时候我觉得它不过是个分类模型，现有 LLM decode 一个 token 就行了。现在意识到它技术上不难，关键是 System 1 的思想：世界是事件驱动的，每次只做一点简单决策。\n\n首先，之前 LLM 是用在 agent react loop 里面的，外围的 harness 和业务逻辑里尽量不用 LLM，否则成本和延迟都受不了。Jev 和今天刚发布的 Pine Computer 的逻辑是，只要模型够快、够便宜，那么很多原本只能用 if-else 凑合的业务逻辑都可以上模型了。\n\n更深一步想，人的实时决策其实更像 System One 模型，而不像 autoregressive LLM。\n\n- 在语音对话中，人每几百毫秒都要做出打断、附和、停顿等交互判断，这是 AI 说话像人的关键。在 GPT-Live 1 和 TML interaction model 这些 full duplex model 中，每个几百毫秒的时间片它只输出几个 token。\n\n- 在 computer use 中，人每几百毫秒都要决定下一步点哪里，UI 一改变，本来准备点的位置也不点了。Pine Computer 就是把 computer use 从 turn based 变成 event driven 的了，输出也尽可能从坐标简化成了 label。\n\n- 在 robotics 中，人每几百毫秒都在规划下一步的动作，或者停止当前动作。\n\n在交互中，观察反馈循环的频率很可能比智商重要。Full-duplex models、Jev 和 Pine Computer 都在指向一个新的方向，SOTA background model 负责深度思考、解决难题，而 System One Models 负责实时语音交互、computer use、业务逻辑判断，甚至未来的具身操作。", "quotes": [{"type": "quoted", "text": "https://x.com/i/article/2108595345680977921", "who": "@?", "url": "https://x.com/i/status/2108596399365640520"}], "likes": 230, "bm": 207, "url": "https://x.com/bojie_li/status/2108762471431623027"}, {"ty": "深度文章", "tp": "Agent 工程", "name": "KonghaYao - 江夏尧", "handle": "konghayao", "date": "2026-10-10 11:27", "ts": "2026-10-10T02:27:18.000Z", "text": "Agent 岗位面试题——子 Agent 什么时候自然结束，提交结果给父 agnet？这里考察人员基础理论：\n\n1. subagent 基础机制\n     main to sub 的控制原理，面向agent 的生命周期管理\n\n2. async task 的管理机制\n     async task 的归属管理，async task 结束之后的消息投递定位，保证回收和异常处理\n\n3. sub sub agent 的设计与权衡\n    是否支持 subagent 派发 subagent，核心讨论技术权衡和判断对方的思考深度和广度。是否了解 Dynamic Workflow 等拍平需求的解决方案。\n\n异常处理面——场景 subagent 执行时间为 6 个 h 以上咋办？\n\n1. 是否需要超时，最大步数限制？\n    最基础，但是也是最考虑设计哲学的点，是否需要化长时间为短时间？开放题\n\n2. subagent LLM 报错中断如何处理？（resume 的要点）\n    超过 retry 上限中断，直接回归父 agent，父 agent 发送 resume 命令，重新启动这个 agent。考验的是错误的返回提示词里面保留 resume 方式给主 agent，具备恢复能力。\n\n3. 执行超长时间的 shell 阻塞的如何控制？\n     考验同步 shell 转 bg shell 的关键点，保证 subagent 不阻塞。\n    引出一个关键问题，bg shell 是否阻塞 subagent 关闭时机。", "quotes": [], "likes": 143, "bm": 145, "url": "https://x.com/konghayao/status/2108746162706714787"}, {"ty": "深度文章", "tp": "Agent 工程", "name": "Jerry Fang", "handle": "Jerry_fsy", "date": "2026-10-10 22:29", "ts": "2026-10-10T13:29:00.000Z", "text": "如果你想做AI相关的工作，不妨考虑一下Agent Infra这个新兴领域。我最近也在入门这个领域，做了一些调研，记录了这个领域需要的技能清单，欢迎收藏，保存，我也会继续分享在这个领域的学习心得。\n\n完整 List：\n1.Agent Runtime：理解 Agent Loop、Tool Calling、Streaming、Session，理解并实现一个最小可用Agent，而不是只调用一次模型 API。\n2.上下文与状态管理：喂给大模型的上下文决定了这一轮模型能看到什么，也很大程度上决定模型做的决策质量；State 会保存任务当前执行到了哪里。需要处理上下文裁剪、压缩、Checkpoint、任务状态，长期记忆与短期上下文。\n3.任务队列与 Worker：把任务通过 Queue 分发给 Worker 执行，并控制并发、优先级、Backpressure 和 Worker Pool。\n4.调度与多 Agent 编排：把复杂任务拆成多个子任务，支持DAG、Reviewer、Handoff 和 Human-in-the-loop。\n5.Durable Execution：Agent 即使运行几十分钟甚至几个小时后，也不会因为进程重启而导致任务的丢失，需要持久化执行状态、Checkpoint、Replay、Resume 和 Recovery。\n6.Retry、Timeout 与幂等：模型、工具、网络和 Worker 等各方面都会遇到问题；系统要能判断什么时候重试、什么时候超时，以及避免 git push、发邮件、创建资源等操作被重复执行。\n7.分布式状态与一致性：多个 Orchestrator、Worker 和数据库共同维护 Task State，需要理解 Transaction、WAL、Lease、Heartbeat、Replication、Consistency 以及故障恢复。\n8.Sandbox 与执行环境：Coding Agent 会执行 Shell、Git、Python、构建和测试，需要为每个 Agent 提供隔离的文件系统、进程、网络和资源环境，并限制 CPU、内存和执行时间。\n9.工具基础设施与 MCP：Agent 不只是调用几个 Function，还需要统一管理 Shell、Filesystem、Browser、Database、API 等工具；MCP 可以作为 Agent 与外部工具、资源之间的一种标准接口。\n10.权限、安全与 Secrets：控制 Agent 能访问哪些文件、调用哪些工具、连接哪些网络和读取哪些密钥，涉及 Authentication、Authorization、ACL、Secret Management 和 Audit。\n11.可观测性与调试：Agent Task 的完整执行过程会通过trace记录下来，用 Metrics 看延迟、Queue、Token、成本、失败率和 Retry。\n12.Evaluation 与 Replay：不只看“Agent 能不能跑”，还要判断任务是否真的完成正确，通过 Dataset、Rubric、Task Success Rate、Regression、Replay 和 LLM-as-Judge 做持续评估。", "quotes": [], "likes": 1314, "bm": 1711, "url": "https://x.com/Jerry_fsy/status/2108912685220069739"}, {"ty": "工具/项目", "tp": "AI Agent 与编程工具", "name": "小墨同学", "handle": "xiaomovps", "date": "2026-10-10 22:22", "ts": "2026-10-10T13:22:34.000Z", "text": "Pi 可以直接使用 Google Antigravity 了，官方正版方式去调用 Gemini 模型🔥\n\n不用复杂的配置 只需要安装这个插件：pi-antigravity-acp-provider\n\n如果你手里已经有 Google AI 订阅，我非常建议你使用起来 在 PI 里面使用，步骤非常简单：\n\n1、安装：pi install npm:pi-antigravity-acp-provider\n\n2、在 Pi 里 /login，选 Sign in with an account，再选 Google Antigravity (ACP)，首次会下载官方运行时，Linux 版解压后约 1.8 GB，然后浏览器登录 Google\n\n3、/model 选 antigravity-acp 开头的模型，Shift+Tab 可以切换推理强度\n\n这里有个细节先看一下：默认权限模式是 yolo，Antigravity 自带的命令和改文件都不会再问你，装完先去设置换成 default 或 auto-edit 这种会询问的模式，再开始用\n\n全程项目都是开源的，如果有问题 可以直接去看代码，而且使用的是官方支持的 ACP 模式，也不需要担心账号问题", "quotes": [{"type": "quoted", "text": "Pi 配上 Gemini 速度飞快，推荐大家尝试一下🔥\n\n推荐一个插件：pi-gemini-acp\n\n可以在 PI 上直接使用 Gemini 的模型，像最新的 Gemini 3.8 flash 它都是支持的\n\n优势：\n\n1、不是通过反代的方式，让我们的 PI 可以去使用 Gemini 的模型\n\n2、不管是最新的还是以前的模型 只要 Gemini 支持 都可以在 PI 里面调用 而且可以分配不同的线程去使用\n\n3、Flash 本来就输出速度非常快，加上 PI 干净的上下文 干起活来速度很快\n\n我自己最近开始尝试 Gemini 去写一些东西，主要是现在 Codex 和 Cloud Code 都有一点算力紧张，所以就开始尝试谷歌的模型\n\n一般都是拿来排查前端和写一些内容，相对来说 谷歌的 AI 味是没有 codex 那么重的，这个大家可以去尝试一下", "who": "@xiaomovps", "url": "https://x.com/i/status/2103060579627991193"}], "likes": 319, "bm": 504, "url": "https://x.com/xiaomovps/status/2108911066743013393"}, {"ty": "资讯", "tp": "模型与平台动态", "name": "kejun", "handle": "kejunz", "date": "2026-10-10 14:40", "ts": "2026-10-10T05:40:33.000Z", "text": "如果想快速看明白实现机制，可以看这个：https://kejun.github.io/demos/chatgpt-intelligent-ui/ https://x.com/kejunz/status/2108794794105581732/photo/1 https://twitter.com/rabi_guha/status/2108238432355123572", "quotes": [{"type": "quoted", "text": "ChatGPT launched their version of Generative UI yesterday. We took it apart\n\ntldr; the agent never write raw code. It emits DIL (a new language), the server compiles and streams it, the client renders it using a component set so that it feels native https://x.com/i/article/2108220775568404480", "who": "@?", "url": "https://x.com/i/status/2108238432355123572"}], "likes": 243, "bm": 391, "url": "https://x.com/kejunz/status/2108794794105581732"}, {"ty": "深度文章", "tp": "行业与观点", "name": "上官亂", "handle": "shangguanluan", "date": "2026-10-10 14:09", "ts": "2026-10-10T05:09:15.000Z", "text": "这两天，李录在哥大的一段演讲在墙内火了。\n\n作为喜马拉雅资本的创始人，成功“洗白”的六四领袖，他早已在国内投资圈成为投资风向标。\n\n这次他在哥大谈AI，但是中间有人问他怎么看中国的经济，他说了意味深长的一段话。\n\n他没唱响中国经济光明论，也没唱衰中国，而是给了一套拆解框架——先看目标，再看代价，你认为你是目标还是代价？\n\n中国怎么跳出中等收入陷阱？在他看来，中国有一套解法，其实也不新鲜，就是十年规划。\n\n“中国制造2025”把中国制造业从中低端推到了中高端，2021年开始加注“技术自主”。\n\n目前，目的达到了大部分。可是，达到目的，不等于非常成功，因为这样做有其代价，这个代价呈现在中产家庭的负债表上。\n\n2021年，也就是在“科技自主”加码狂奔的时候，中国房价见顶，然后不断下跌至今，家庭财富不断缩水。\n\n于是，普通人只能少消费、多存钱，速还债。内需的增长也因此趋近于0.\n\n但是另一面，中国制造业完成突破，中国制造2025的目标几乎都提前完成。\n\n而且他认为“美国主导的技术制裁反而成了中国芯片业的礼物”，因为，制裁，制造出了庞大的市场替代需求，于是中国的芯片业终于找到了发展机会。\n\n如今，成熟工艺的芯片基本自给自足，先进工艺也在逼近。\n\n而代价，则继续转移。新房销售掉了7成，热钱流向制造业。\n\n这不是什么新鲜事，回看1976年文革结束至今的50年，非常清晰：十年一轮——一轮目标，一轮代价。\n \n目标跟代价甚至是轮替的，这个十年的目标 ，很可能下个十年就成为代价。\n\n所以，做投资或者做企业，你都要搞清楚一个事情，自己是目标还是代价。\n\n这套逻辑其实可以用来理解这70多年的很多事情，所有喧闹的运动背后，都有真正的驱动力。", "quotes": [], "likes": 1018, "bm": 954, "url": "https://x.com/shangguanluan/status/2108786920092287132"}, {"ty": "工具/项目", "tp": "AI Agent 与编程工具", "name": "lifcc", "handle": "mylifcc", "date": "2026-10-09 21:03", "ts": "2026-10-09T12:03:00.000Z", "text": "MIT，零依赖，无构建步骤。\n已经 5000+ star，上过 Trending 日榜 #1。\n\n如果你在用 dsh，可以看看：\nhttps://github.com/Ebony-Vinyl/dsh-our-free-model\n\n#AI #LLM #DeepSeek #OpenSource", "quotes": [{"type": "replied_to", "text": "还在为 API Key、额度、充值吵架？\n\n有人直接把「免费模型」做成了 dsh 插件：\n• 零登录\n• 零 Key\n• 零额度焦虑\n\n装完就能聊。Frontier 模型，白嫖开局。\n上游公开：OpenCode Zen + Kilo 免费池。\nGitHub 两天冲上 Trending #1，现在 5000+ ⭐。 https://x.com/mylifcc/status/2108528654284128664/photo/1", "who": "@mylifcc", "url": "https://x.com/i/status/2108528654284128664"}], "likes": 64, "bm": 113, "url": "https://x.com/mylifcc/status/2108528654967816482"}, {"ty": "资讯", "tp": "模型与平台动态", "name": "星球🪐🪐☄️☄️", "handle": "Lee_points", "date": "2026-10-09 17:50", "ts": "2026-10-09T08:50:58.000Z", "text": "这两天爆火的rea作者称万物皆可逆向，并写了指南。项目达3万stars、4千forks，感觉作者要被国人上一课了。 https://x.com/Lee_points/status/2108480326834299320/photo/1", "quotes": [], "likes": 3335, "bm": 4042, "url": "https://x.com/Lee_points/status/2108480326834299320"}, {"ty": "资讯", "tp": "模型与平台动态", "name": "Qoder", "handle": "qoder_ai_ide", "date": "2026-10-09 21:51", "ts": "2026-10-09T12:51:45.000Z", "text": "Something new drops tomorrow.\n\nIt's fast. It's light on credits. It's dangerously smooth.\n\n10.10. Stay tuned. https://x.com/qoder_ai_ide/status/2108540921583452512/photo/1", "quotes": [], "likes": 148, "bm": 17, "url": "https://x.com/qoder_ai_ide/status/2108540921583452512"}, {"ty": "深度文章", "tp": "Agent 工程", "name": "jolestar", "handle": "jolestar", "date": "2026-10-09 22:25", "ts": "2026-10-09T13:25:18.000Z", "text": "现在用 Agent，最头疼的就是“推一下动一下，眼里没活”。小时候做家务被骂“油瓶倒了都不扶”，大概就是这种感觉。\n\n但要让 Agent “眼里有活”，核心不是玄学的自主意识，而是它能不能及时感知到外部事件——你总不能让它起个定时轮询，每隔几秒跑去看一眼油瓶倒了没有。\n\n这篇文章聊聊 Holon 是如何做事件驱动设计的：", "quotes": [{"type": "quoted", "text": "博客中文版同步发布：《从请求-响应到事件驱动：长周期 Agent 系统的内核设计》\n\nhttps://holon.run/zh-CN/blog/event-driven-kernel\n\n探讨如何用事件驱动与持久化状态机替代 while(true) 轮询，欢迎阅读与交流。", "who": "@holonrun", "url": "https://x.com/i/status/2108503468055171206"}], "likes": 77, "bm": 104, "url": "https://x.com/jolestar/status/2108549364230815853"}, {"ty": "深度文章", "tp": "Agent 工程", "name": "Holon", "handle": "holonrun", "date": "2026-10-09 19:22", "ts": "2026-10-09T10:22:55.000Z", "text": "博客中文版同步发布：《从请求-响应到事件驱动：长周期 Agent 系统的内核设计》\n\nhttps://holon.run/zh-CN/blog/event-driven-kernel\n\n探讨如何用事件驱动与持久化状态机替代 while(true) 轮询，欢迎阅读与交流。", "quotes": [{"type": "replied_to", "text": "Read the full architecture deep-dive on designing event-driven kernels for long-lived agents:\n\nhttps://holon.run/blog/event-driven-kernel\n\nBuilt for engineers designing agents that actually finish the job.", "who": "@holonrun", "url": "https://x.com/i/status/2108503431203971114"}], "likes": 32, "bm": 81, "url": "https://x.com/holonrun/status/2108503468055171206"}, {"ty": "深度文章", "tp": "Agent 工程", "name": "ClaudeDevs", "handle": "ClaudeDevs", "date": "2026-09-29 05:54", "ts": "2026-09-28T20:54:19.000Z", "text": "Claude can now help you build evaluations and hillclimb on them.\n\nIn this article, we share guidance on eval design &amp; skills that Claude Code can use to improve your applications.\n\nhttps://claude.dev/blog/automating-eval-design-and-hillclimbing/", "quotes": [], "likes": 9674, "bm": 18011, "url": "https://x.com/ClaudeDevs/status/2104676099083190435"}, {"ty": "工具/项目", "tp": "模型与 AI 应用", "name": "王小庄", "handle": "BlockInsight214", "date": "2026-10-09 12:33", "ts": "2026-10-09T03:33:03.000Z", "text": "卧槽，\n\n真正免费用Qwen3.8-27B，Hugging Face 员工发了个新玩法。\n\n任意终端运行 \nssh http://chat.hf.co\n\n回车就进聊天界面。\n\n不用注册、不用 API key、不用装任何东西。\n\n额度不限量。\n\n任意选HF Inference Providers 上的托管模型。\n\n在任何一台能开终端的机器上都能用，服务器上、树莓派上、别人的电脑上。\n\n这大概是现在门槛最低的\"随身 AI\"了", "quotes": [], "likes": 1006, "bm": 1620, "url": "https://x.com/BlockInsight214/status/2108400320204386435"}, {"ty": "Skill", "tp": "写作与效率", "name": "卡尔的AI沃茨", "handle": "aiwarts", "date": "2026-10-06 00:12", "ts": "2026-10-05T15:12:51.000Z", "text": "超爆肝！今天把在几个月前我在影视飓风内部分享的AI工作流全公开！\n\n00:15 找到适合你的Skill\n09:28 把你的经验打包成Skill\n20:34 把多个Skills组合成工作流\n30:54 批量化定时化\n\n看完之后你甚至可以手搓一个本地批量视频剪辑Skill，还能做出文案、海报、视频、网页全链路的内容生产工作流！！", "quotes": [], "likes": 1326, "bm": 1889, "url": "https://x.com/aiwarts/status/2107126881942385114"}, {"ty": "工具/项目", "tp": "网络与代理", "name": "Miguel Ángel Durán", "handle": "midudev", "date": "2026-10-03 22:02", "ts": "2026-10-03T13:02:55.000Z", "text": "Comparte localhost a Internet pero controla quién entra. ¡Cloudflare lo añadió ayer gratis!\n\nSin coste y sin registros. Con el nuevo --allowed-mail:\n✓ El invitado mete su correo y recibe un PIN\n✓ Si no está en la lista, no entra\n\nhttps://blog.cloudflare.com/protected-quick-tunnels/ https://x.com/midudev/status/2106369406850748596/photo/1", "quotes": [], "likes": 2155, "bm": 1670, "url": "https://x.com/midudev/status/2106369406850748596"}, {"ty": "工具/项目", "tp": "开发与基础设施", "name": "爱吃折耳根的Ace", "handle": "_zheergen", "date": "2026-10-02 19:48", "ts": "2026-10-02T10:48:51.000Z", "text": "卧槽！给 TradingView 做付费指标的那家 LuxAlgo，把自家图表引擎开源了\n\nVela，495 Stars，Apache-2.0 开源，也是 LuxAlgo 自己在用的金融图表引擎。\n\n以前做行情前端，要么买 TradingView 授权（贵、数据还受限），要么自己造图表轮子（难、bug 一堆）。\n\n这个不一样，LuxAlgo 直接开源整套图表引擎，不是 TradingView 的壳，是自带 WebGL2 渲染器的 headless 核心，数据层 / 脚本引擎 / 渲染层全是插件化接口。\n\n核心能力：\n\n1️⃣ WebGL2 金融图表：实时 K 线高性能渲染，Canvas2D 自动兜底\n\n2️⃣ 70+ 技术指标：MA、RSI、MACD、VWAP、SuperTrend、Volume Profile 都有\n\n3️⃣ 22 种画图工具：趋势线、斐波那契、Pitchfork、波浪、Long / Short Position 直接用\n\n4️⃣ 多图 Workspace：多图布局、Crosshair 同步、周期切换、对象树都做好了\n\n5️⃣ 实时行情接入：Binance、Coinbase、Hyperliquid 开箱即用，也能换自己的数据源\n\n6️⃣ 支持 Pine Script：配合 PineTS，可以把原来的 Pine 指标直接跑进 Vela\n\n我觉得它真正有意思的地方，不是“能画 K 线”。\n\n而是你拿到了一套可以继续长成自己交易终端的骨架。\n\n行情、指标、策略、AI Agent、Broker，后面都能继续往上接。\n\n想自己做 TradingView 风格量化终端、Crypto Dashboard 或 AI Trading 工作台的，这个很值得留着。\n\n仓库：https://github.com/LuxAlgo/Vela", "quotes": [{"type": "quoted", "text": "这下省事了！高频回测里最容易骗你的地方，不是策略，而是你默认自己每张单都能成交\n\nhftbacktest，4.8K Stars，专门给 HFT / Market Making 做订单簿级回测。\n\n以前做高频回测，大多数框架只管“信号出来就成交”，很少认真处理延迟、排队位置和盘口变化。\n\nhftbacktest 不一样，它直接把真实订单簿、Feed 延迟、下单延迟、Queue Position 全塞进回测里，让策略先过一遍真正的成交考验。\n\n核心能力：\n\n1️⃣ Tick-by-Tick 回放：直接重放逐笔成交和订单簿，不拿分钟 K 线假装做高频\n\n2️⃣ 支持 L2 / L3 Order Book：可以重建盘口、挂单队列，研究做市和订单流\n\n3️⃣ 延迟也算进去：Feed、下单、回报延迟都能模拟，不再默认自己是零延迟大神\n\n4️⃣ Queue Position：你的限价单排第几位、什么时候真正轮到成交，也会影响最终结果\n\n5️⃣ 支持多资产、多交易所，可以继续研究跨市场做市、套利和 Basis 策略\n\n6️⃣ Rust 版还能把同一套 Algo 继续接 Binance Futures、Bybit 做 Live Bot 原型\n\n我觉得它最狠的一点，是会直接把很多“漂亮回测”打回现实。\n\n你的单真的成交得到吗？\n几十毫秒以后机会还在吗？\n排队没排到你，收益曲线还成立吗？\n\n高频策略如果连这几关都没过，回测赚再多都可能只是纸面利润。\n\n做 HFT、Market Making、订单簿策略或者 Crypto 高频量化的，这个很值得收藏。\n\nhttps://github.com/nkaz001/hftbacktest", "who": "@_zheergen", "url": "https://x.com/i/status/2105897566848389304"}], "likes": 1231, "bm": 2021, "url": "https://x.com/_zheergen/status/2105973280675082256"}, {"ty": "Skill", "tp": "设计与 UI", "name": "oil-oil", "handle": "I_am_oil_oil", "date": "2026-10-03 10:48", "ts": "2026-10-03T01:48:14.000Z", "text": "这里我在不断的测试和优化 Oil UI https://github.com/oil-oil/oil-ui 这个 Skill，过程中做了很多的测试，也发现很多以前觉得 UI 设计能力没有那么好的模型使用 Oil UI 后能够做出很出乎意料的作品。\n\n于是我为 Oil UI 单独做了一个网站：https://ui.oiloil.org/ 用来展示不同模型使用 Skill 做出来的设计效果，有很多作品真的做的很棒，对应的提示词我也放在演示里面了～", "quotes": [], "likes": 490, "bm": 792, "url": "https://x.com/I_am_oil_oil/status/2106199616039587934"}, {"ty": "生活娱乐", "tp": "健身与健康", "name": "Gym Fiesta", "handle": "GymFiesta", "date": "2026-10-03 04:10", "ts": "2026-10-02T19:10:06.000Z", "text": "If you want to burn belly fat fast, do this exercise while sitting 👍 https://x.com/GymFiesta/status/2106099422505713840/video/1", "quotes": [], "likes": 16168, "bm": 17588, "url": "https://x.com/GymFiesta/status/2106099422505713840"}, {"ty": "Skill", "tp": "编程与工程", "name": "Tommy Xiao", "handle": "xds2000", "date": "2026-10-03 19:25", "ts": "2026-10-03T10:25:32.000Z", "text": "一开始我好奇这个pstack到底是什么，最后去打开代码一看，一套十几个优选的skill，模型能力在线就可以。我相信现在的国产模型应该也能支撑这个pstack https://twitter.com/MaiYangAI/status/2106256004346441909", "quotes": [{"type": "quoted", "text": "Lauren Tan（@poteto）跟 Matt Pocock 聊她在 SpaceX 用 pstack 做事。这集的题目就是每个月上千条 PR。\n\n她说代理已经可以自己合 pull request，她先睡，回头再看已经合进去的。她相当于有超过十个参谋长，各管一块。pstack 里开 autopilot 之后，每条 PR 会起验证代理，把应用真的跑起来，像人一样去点，找回归。\n\n中英硬字幕，66 分钟。", "who": "@MaiYangAI", "url": "https://x.com/i/status/2106256004346441909"}], "likes": 78, "bm": 126, "url": "https://x.com/xds2000/status/2106329799006536072"}, {"ty": "Skill", "tp": "编程与工程", "name": "Mai Yang", "handle": "MaiYangAI", "date": "2026-10-03 14:32", "ts": "2026-10-03T05:32:18.000Z", "text": "Lauren Tan（@poteto）跟 Matt Pocock 聊她在 SpaceX 用 pstack 做事。这集的题目就是每个月上千条 PR。\n\n她说代理已经可以自己合 pull request，她先睡，回头再看已经合进去的。她相当于有超过十个参谋长，各管一块。pstack 里开 autopilot 之后，每条 PR 会起验证代理，把应用真的跑起来，像人一样去点，找回归。\n\n中英硬字幕，66 分钟。", "quotes": [], "likes": 667, "bm": 924, "url": "https://x.com/MaiYangAI/status/2106256004346441909"}, {"ty": "生活娱乐", "tp": "搞笑与影视", "name": "行进中的二诸葛", "handle": "daxiongmao1234", "date": "2026-10-03 19:10", "ts": "2026-10-03T10:10:16.000Z", "text": "我快笑死了， 这个编剧一定深受其害 https://x.com/daxiongmao1234/status/2106325955308564724/video/1", "quotes": [], "likes": 814, "bm": 328, "url": "https://x.com/daxiongmao1234/status/2106325955308564724"}, {"ty": "工具/项目", "tp": "开发与基础设施", "name": "Geek Lite", "handle": "QingQ77", "date": "2026-10-02 13:51", "ts": "2026-10-02T04:51:00.000Z", "text": "用一个原生 Rust 客户端统一连接 20 种数据库，替代 TablePlus 这类 Electron 桌面工具。\n\nhttps://github.com/alpcanaydin/tusk\n\nTusk 把数据库客户端用 Rust 和 GPUI 重写了一遍，跑起来没有 Electron 也没有 WebView，几百万行的表滚动靠虚拟化加 GPU 渲染顶住。\n\n能连的引擎有 20 种，PostgreSQL、MySQL、SQLite、SQL Server、Oracle、ClickHouse、Snowflake、BigQuery、Redis、MongoDB、Cassandra、DynamoDB 都在列表里，连接支持分组、标签、SSH 隧道，也能从 TablePlus、Docker Compose 文件或连接 URL 导进来。", "quotes": [], "likes": 45, "bm": 83, "url": "https://x.com/QingQ77/status/2105883222114709876"}, {"ty": "工具/项目", "tp": "桌面与效率软件", "name": "甬哥侃侃侃ygkkk", "handle": "ygkkkg", "date": "2026-10-03 07:56", "ts": "2026-10-02T22:56:56.000Z", "text": "📱旧手机别吃灰了！\n\nServerBox让安卓手机秒变Linux服务器，无需Root！\n\nAlpine、Debian、Ubuntu、Kali……SSH、脚本、服务全都能跑！\n\n🔥一部旧手机，直接变身低功耗小服务器！\n\nhttps://github.com/madeye/ServerBox", "quotes": [], "likes": 107, "bm": 234, "url": "https://x.com/ygkkkg/status/2106156506962083951"}, {"ty": "深度文章", "tp": "行业与观点", "name": "赵纯想", "handle": "chunxiangai", "date": "2026-10-01 11:08", "ts": "2026-10-01T02:08:11.000Z", "text": "再说一次，Telegram 源码是开源的：\n\n我不明白为什么还有人在琢磨 iOS 里面的牛逼 UIUX，这个图书馆一般的代码库是不够你抄了吗？AI 时代，源码啦下来，几路 Agent 调研一波，想要什么有什么！", "quotes": [], "likes": 1308, "bm": 1067, "url": "https://x.com/chunxiangai/status/2105479860466725219"}, {"ty": "深度文章", "tp": "AI 编程实践", "name": "Andrej Karpathy", "handle": "karpathy", "date": "2026-10-02 09:37", "ts": "2026-10-02T00:37:00.000Z", "text": "We'll be spending a lot more time trying to understand the outputs of language models. A few thoughts, tips & tricks:\n\nWriting. Something I've had success with: Ask your LLM to explain something in ASD-STE100, it's a controlled language specification originally developed for aerospace maintenance documentation. LLMs well-versed in this language and it comes with heavy constraints on clean writing style that I often find a lot more readable. Sometimes I've tried to soften it a bit e.g. ask for \"80% of the way to ASD-STE100\" because the spec is quite stringent. But even better:\n\nDiagrams / images. Instead of writing, ask your LLM to create a diagram. These can be a lot easier to process, parse, and understand. But even better:\n\nWeb pages. Ask for output \"in HTML\" to get a beautiful, interactive webpage. LLMs are getting really good at frontend and can create beautiful experiences, animations, etc. But even better:\n\nExplainer videos. The output format I am most bullish on is fully custom / bespoke explainer videos generated on any arbitrary topic. Experiment with things like \"Create a 3b1b style video explainer on X. Use my ElevenLabs API key for audio narration\". (you'd need an API key for the latter or you can ask your LLM to find you decent free alternatives that use your local compute). This is actually starting to work!\n\nIn summary:\n- As LLMs get better, they will do more and more of the legwork autonomously, and a lot more of our work will rise up the abstractions into oversight and understanding.\n- Luckily, LLMs can help here too because as intelligence and code are increasingly abundant, you can ask for large, custom, discardable software artifacts (e.g. web apps, video explainers) that would have never made sense to create before. Push the boundaries here and you'll be surprised.", "quotes": [], "likes": 56196, "bm": 82212, "url": "https://x.com/karpathy/status/2105819303471976479"}, {"ty": "深度文章", "tp": "AI 编程实践", "name": "uudon", "handle": "uudonX", "date": "2026-10-02 10:29", "ts": "2026-10-02T01:29:48.000Z", "text": "🎁 Karpathy 又给行业发福利了！codex / claude code 给你生产一大堆文字，你还一个字不落地读吗？ 别这样，效率太低了，试试下面 Karpathy 提出的几个方法。\n\n你只能感慨，牛人终究是牛人，聪明的同时，还努力，还不断想办法让自己高效。\n\nKarpathy 提了一个很多人忽略的问题：当 AI 的产出速度超过人的理解速度，继续让它写更多文字，只会把瓶颈越堆越高。\n\n模型可以在几分钟内生成几万行代码、研究报告和复杂方案，但人仍然要判断它做了什么、逻辑是否成立、结果能不能使用。\n\n所以 Karpathy 提出的几个方案：怎样把模型的输出转换成人更容易理解和验证的形式。\n\n1️⃣ 用 ASD-STE100 约束文字。\n普通模型喜欢使用长句、抽象词和模糊表达。同一个概念写了很多字，读完仍然不知道重点。\nASD-STE100 最初用于航空维修文档，它限制词汇、句式和表达方式，要求每句话清楚、直接、含义唯一。\n可以提示模型：“用 80% 的 ASD-STE100 风格解释这个问题。”\n\n它的收益是降低语言噪声，减少歧义，让技术文档和复杂概念更容易检查。\n\n2️⃣ 生成图表。\n有些内容的难点来自关系复杂，例如系统架构、调用链、因果关系和模块依赖。线性文字很难同时展示这些结构。\n让模型生成流程图、架构图或概念图，可以直接看到节点之间如何连接、数据如何流动、问题可能出现在哪里。\n\n它的收益是降低理解成本，也更容易发现缺失关系和逻辑断点。\n\n3️⃣ 生成交互式网页。\n如果一个问题包含状态、参数或动态变化，静态文字和图片都不够。\n这时可以让模型输出 HTML，通过按钮、滑块和动画展示：参数变化后结果会发生什么，系统在不同状态下如何运行。\n它的收益是把“阅读结论”变成“亲手验证”。用户可以修改参数、观察结果，快速建立因果理解。\n\n4️⃣ 生成解释视频。\n算法执行、物理过程和抽象概念都包含时间顺序。视频可以逐步展示变化过程，同时结合动画、旁白和重点标注。\nKarpathy 建议直接让模型制作 3Blue1Brown 风格的解释视频。\n\n它的收益是帮助人建立直觉，尤其适合只看文字很难想象的概念。\n\n这几个方案背后的真正变化，是“可丢弃软件”的成本正在接近零。过去，为一个问题单独制作网页、动画或视频不划算。\n\n现在模型可以根据你的知识水平临时生成，用完就扔，别再傻傻完整读完模型给你输出的所有内容了，效率太低了，试试上面的方法。", "quotes": [{"type": "quoted", "text": "We'll be spending a lot more time trying to understand the outputs of language models. A few thoughts, tips & tricks:\n\nWriting. Something I've had success with: Ask your LLM to explain something in ASD-STE100, it's a controlled language specification originally developed for aerospace maintenance documentation. LLMs well-versed in this language and it comes with heavy constraints on clean writing style that I often find a lot more readable. Sometimes I've tried to soften it a bit e.g. ask for \"80% of the way to ASD-STE100\" because the spec is quite stringent. But even better:\n\nDiagrams / images. Instead of writing, ask your LLM to create a diagram. These can be a lot easier to process, parse, and understand. But even better:\n\nWeb pages. Ask for output \"in HTML\" to get a beautiful, interactive webpage. LLMs are getting really good at frontend and can create beautiful experiences, animations, etc. But even better:\n\nExplainer videos. The output format I am most bullish on is fully custom / bespoke explainer videos generated on any arbitrary topic. Experiment with things like \"Create a 3b1b style video explainer on X. Use my ElevenLabs API key for audio narration\". (you'd need an API key for the latter or you can ask your LLM to find you decent free alternatives that use your local compute). This is actually starting to work!\n\nIn summary:\n- As LLMs get better, they will do more and more of the legwork autonomously, and a lot more of our work will rise up the abstractions into oversight and understanding.\n- Luckily, LLMs can help here too because as intelligence and code are increasingly abundant, you can ask for large, custom, discardable software artifacts (e.g. web apps, video explainers) that would have never made sense to create before. Push the boundaries here and you'll be surprised.", "who": "@karpathy", "url": "https://x.com/i/status/2105819303471976479"}], "likes": 1486, "bm": 2700, "url": "https://x.com/uudonX/status/2105832589496111281"}, {"ty": "深度文章", "tp": "设计", "name": "Jakub Krehel", "handle": "jakubkrehel", "date": "2026-09-25 23:57", "ts": "2026-09-25T14:57:47.000Z", "text": "How we built Interfere’s new website\nhttps://interfere.com/blog/how-we-built-interferes-new-website", "quotes": [], "likes": 320, "bm": 428, "url": "https://x.com/jakubkrehel/status/2103499210330943948"}, {"ty": "深度文章", "tp": "设计", "name": "Erwin", "handle": "ErwinWu000", "date": "2026-09-30 18:55", "ts": "2026-09-30T09:55:21.000Z", "text": "向学习UI设计的伙伴们推荐这篇blog\n\n这是由设计大神Jakub写的实战经验帖子，从页面设计的方方面面来讲解如何设计一款网站，另外他的设计skill也非常全面！\n\n👉/better-interface https://twitter.com/jakubkrehel/status/2103499210330943948", "quotes": [{"type": "quoted", "text": "How we built Interfere’s new website\nhttps://interfere.com/blog/how-we-built-interferes-new-website", "who": "@jakubkrehel", "url": "https://x.com/i/status/2103499210330943948"}], "likes": 11, "bm": 32, "url": "https://x.com/ErwinWu000/status/2105235041723064369"}, {"ty": "Skill", "tp": "编程与工程", "name": "Tao Wang", "handle": "Tao100086", "date": "2026-09-30 13:06", "ts": "2026-09-30T04:06:01.000Z", "text": "Matt Pocock 刚分享了他心中的 Top 3 Skill Makers，之前我们推荐过Matt 的 Grill Me，到现在，它仍然是我全局安装的两个 Skills 之一。\n\n这次他推荐的三个人，有一个很鲜明的共同点：都在自己的领域有多年实践，然后把工作方法和判断标准写成了 Agent 可以执行的 Skills。\n\n三个人的方向也各不相同👇\n\n1️） @poteto — Lauren Tan\n工程流程、代码质量与并行协作\n\nLauren 是 React 核心团队成员，参与 React Compiler 的开发，先后在 Netflix、Meta 和 Cursor 工作。\n\n她的代表作 pstack，就是自己日常在 Cursor 使用的一套工程 Skills。\n\n它关注的是：如何让 AI Agent 按照严谨的工程流程工作，能协作、能审查，也能验证自己交付的结果。\n\n先把单个 Agent 的工作质量做扎实，再放心地并行推进任务，这是 pstack 很值得学习的思路。\n\nhttps://github.com/cursor/plugins/tree/main/pstack\n\n2️） @dexhorthy — Dexter “Dex” Horthy\nAgent 架构、上下文工程与软件生产流程\n\nDex 是 HumanLayer 创始人兼 CEO，也是《12-Factor Agents》的作者。\n\n他长期从事 DevOps、Kubernetes 和基础设施工作，在 Replicated 工作了约 7 年，经历过工程、产品和管理等角色。\n\n他的工作围绕一个很实际的问题展开：怎样让基于 LLM 的软件达到可以交给真实用户使用的水平？\n\n放到 AI 编程里，就是如何管理上下文、组织研究和规划，让 Agent 能在复杂代码库中可靠地推进工作。\n\n如果你正在把 Agent 用到真实工程项目里，这个方向值得重点看。\n\nhttps://github.com/humanlayer/skills\n\n3️） @emilkowalski — Emil Kowalski\n界面设计、动画与交互细节\n\nEmil 目前在 Linear Web Team 做 Design Engineer，之前在 Vercel Design Team。\n\nSonner、Vaul、http://animations.dev，都是他的作品。\n\n他的 Skills 把设计工程中的具体判断写了出来：动画用什么曲线、持续多久、哪些地方值得加动效，以及如何处理那些影响界面质感的小细节。\n\n这些原本依赖经验的判断，现在可以成为 Agent 设计和检查界面时的参考。\n\nEmil 这套 Skills，我们之前也专门推荐过。做前端和产品界面的朋友，可以重点看看。\n\nhttps://github.com/emilkowalski/skills\n\n我觉得：挑 Skills 时，值得先看看作者长期在解决什么问题。\n\n专业经验越扎实，写进 Skills 里的判断和方法，就越值得拿来学习。", "quotes": [{"type": "quoted", "text": "My top 3 skill makers:\n\n- @poteto \n- @dexhorthy\n- @emilkowalski\n\nAlways learn a ton from reading their skills.", "who": "@mattpocockuk", "url": "https://x.com/i/status/2105022638368403658"}], "likes": 740, "bm": 1342, "url": "https://x.com/Tao100086/status/2105147128255598917"}, {"ty": "生活娱乐", "tp": "搞笑与影视", "name": "南宫远", "handle": "nangongyuan", "date": "2026-09-28 12:09", "ts": "2026-09-28T03:09:00.000Z", "text": "大明1566+迈克杰克逊，够颠。\n迈克·嘉克靖世界巡回演出 拍摄于1566\n《大明王朝1566》#嘉靖 #迈克杰克逊 https://x.com/nangongyuan/status/2104408001650008549/video/1", "quotes": [], "likes": 2057, "bm": 928, "url": "https://x.com/nangongyuan/status/2104408001650008549"}, {"ty": "工具/项目", "tp": "开发与基础设施", "name": "Caleb", "handle": "calebfahlgren", "date": "2026-09-29 04:48", "ts": "2026-09-28T19:48:58.000Z", "text": "I've really been enjoying this app for viewing parquet files!\n\nSuch a fun way to X-Ray into the metadata and look at your data! https://x.com/calebfahlgren/status/2104659653959504112/photo/1", "quotes": [], "likes": 325, "bm": 372, "url": "https://x.com/calebfahlgren/status/2104659653959504112"}, {"ty": "深度文章", "tp": "行业与观点", "name": "硅基流动", "handle": "falali2015", "date": "2026-09-28 21:59", "ts": "2026-09-28T12:59:10.000Z", "text": "刘元春老师在五道口经济论坛上的讲话应该最能反映当前政策制定者的思考逻辑。他在论坛上的批评算重了，感觉是指着另外几个嘉宾鼻子骂江湖郎中。\n我特地去把他的发言剪出来供大家参考。\n屁股决定脑袋，我的位置不在既得利益者那边，我不反对这种产业升级，但是如果这种升级一直都是老实人吃亏，既得利益者吃肉，我想很多人都是会有怨言，就比如A股今天这种走势，又是股民承担了所有。\n迟来的蛋糕会不会是他们吃剩的，会不会是馊的这个问题是我这个位置最关注的。", "quotes": [{"type": "quoted", "text": "https://x.com/i/article/2104523370499076096", "who": "@falali2015", "url": "https://x.com/i/status/2104526997406073270"}], "likes": 508, "bm": 599, "url": "https://x.com/falali2015/status/2104556521912987987"}, {"ty": "深度文章", "tp": "纯链接（X 长文等）", "name": "Aiden", "handle": "wohsj110", "date": "2026-09-28 15:24", "ts": "2026-09-28T06:24:26.000Z", "text": "https://x.com/i/article/2081635007739604992", "quotes": [], "likes": 97, "bm": 236, "url": "https://x.com/wohsj110/status/2104457185631817742"}, {"ty": "教程/学习", "tp": "AI 课程与指南", "name": "AYi", "handle": "AYi_AInotes", "date": "2026-09-28 21:01", "ts": "2026-09-28T12:01:30.000Z", "text": "吴恩达刚发了今年最狠的一堂Agent课，两小时，从单代理一路讲到完全自动化，硬核到足以把你今年收藏的所有AI Agent教程全淘汰了！\n\n整门课刚好两个小时，五个时间节点卡得特别清楚，九分钟带你搭出第一个能干活的代理，三十三分钟讲循环工程怎么让代理自己纠错迭代，一小时零两分正式开讲图工程，一个半小时讲能自我重写的代理，最后四十分钟直接放完整的可运行图系统。\n\n很多人学Agent最大的误区，就是把能跑通一个对话循环当成了终点，实际上单代理再聪明，也扛不住长任务里的上下文丢失，状态混乱和失败不可追溯，图工程干的事，就是把决策和控制流从模型的黑盒里拉出来，变成可检查可复用可并行的固定拓扑，模型只负责节点里的判断，路径由人提前设计好。\n\n这也是为什么同样的模型，同样的token，用单代理跑和用完整图系统跑，一周下来的完成度能差出好几倍，前者还在反复重试同一个失败步骤，后者已经把多个分支并行跑完，自动汇总成最终结果了。\n\n想真正搞懂Agent自动化的兄弟，这门课真的值得抽两个小时完整刷一遍，别再停留在单代理的玩具阶段了。 https://x.com/res1dualedge/status/2104300857928098075/video/1", "quotes": [], "likes": 2273, "bm": 3458, "url": "https://x.com/AYi_AInotes/status/2104542011642757330"}, {"ty": "工具/项目", "tp": "桌面与效率软件", "name": "小鲸社长", "handle": "xiaojingshe", "date": "2026-09-26 16:41", "ts": "2026-09-26T07:41:10.000Z", "text": "拯救“洋垃圾”光猫 ：AN7581可以免拆机刷入 OpenWrt 了：\n恩山protobuf大佬开源了对 Airoha AN7581 和 AN7583 PON 设备的支持。各位可以自行编译定制自己的PON固件了！！！\n\n🧩 U-Boot已列出9款AN7581机型\n🧰 NPU满血觉醒，支持全系AN7581芯片。修复原生光猫残血bug，拯救有缺陷的固件\n🔍 AN7581 四核 A53 1.3GHz，以及八核 RISC-V 网络处理器，但不支持 aes\n⚠️ 受运营商固件限制的 10G 光猫，能同时承担光电转换、拨号、路由和硬件转发了。\n\n果然 WiFi7 时代刷机还是得看联发科或者发哥的儿子，这样一来几乎所有的7581都可以刷机了🤪。\n\nAN758x-Stock2UBI项目地址：https://github.com/pbs05/an758x-stock2ubi", "quotes": [], "likes": 154, "bm": 225, "url": "https://x.com/xiaojingshe/status/2103751718718890103"}, {"ty": "深度文章", "tp": "AI 编程实践", "name": "losingle", "handle": "losingle", "date": "2026-03-10 23:00", "ts": "2026-03-10T14:00:58.000Z", "text": "OOP是人类在算力匮乏、团队庞大时，为了方便分工和管理复杂性而发明的一种收纳盒，只是一种工程解法\n\n当代码生成不再是瓶颈，我们需要的是绝对的确定性。此时，不可变数据 + 纯函数转换 + 严格模式匹配这种更贴近数学和逻辑本质的范式，自然就成了驾驭AI算力的最佳武器 https://twitter.com/losingle/status/2030609396682899543", "quotes": [{"type": "quoted", "text": "LLM 训练数据中 Python 和 JS 的代码都是历史包袱，未来都是模式匹配语言的天下", "who": "@losingle", "url": "https://x.com/i/status/2030609396682899543"}], "likes": 7, "bm": 5, "url": "https://x.com/losingle/status/2031369725989838994"}, {"ty": "工具/项目", "tp": "模型与 AI 应用", "name": "seekinganythingbutalpha", "handle": "ivanalog_com", "date": "2026-09-25 09:58", "ts": "2026-09-25T00:58:02.000Z", "text": "调试了一会，目前谷歌A100运行Qwen Flash的速度（3000+ prefill, 90+ tps)已经比一般的商用API还要快了，偶尔短时重度并发使用可以放到Collab上去。\n\n为了节约大家的时间，我把在Collab上重建这个Qwen Flash的Recipe放到Github了，需要可以自取。\n\nhttps://github.com/architectds/collabosm https://x.com/ivanalog_com/status/2103287880965570698/photo/1 https://twitter.com/ivanalog_com/status/2103276212231553116", "quotes": [{"type": "quoted", "text": "Collab上A100 80G运行Qwen Flash Next的速度很不错。\n\nprefill 2800~3000, decode 90+ https://x.com/ivanalog_com/status/2103276212231553116/photo/1 https://twitter.com/ivanalog_com/status/2102960826713886983", "who": "@ivanalog_com", "url": "https://x.com/i/status/2103276212231553116"}], "likes": 523, "bm": 608, "url": "https://x.com/ivanalog_com/status/2103287880965570698"}, {"ty": "教程/学习", "tp": "实用技巧", "name": "lifcc", "handle": "mylifcc", "date": "2026-09-25 13:44", "ts": "2026-09-25T04:44:31.000Z", "text": "从L站偷了一个防止降智的方案。使用excel中的gpt的反代，不得不说真他妈有才 https://x.com/mylifcc/status/2103344874993201285/photo/1", "quotes": [], "likes": 373, "bm": 443, "url": "https://x.com/mylifcc/status/2103344874993201285"}, {"ty": "深度文章", "tp": "Agent 工程", "name": "Chasen", "handle": "chasen_liao", "date": "2026-09-25 00:25", "ts": "2026-09-24T15:25:54.000Z", "text": "学 Agent 最好的方式是什么？就是去玩 Pi 呀！😡\n\nPi 是最极简的一个Harness啊。把 Pi 一整个，从用户发提示词，再到他修改文件，然后返回结果给你，这一整个链路把它给搞懂。这其实就叫做一个Agent Loop，之后你就可以在这条链路上横向地去扩展，在调用工具的时候，你可以去看一下它是怎么一种格式去调用工具的，这些工具又是怎么暴露给模型的；在他使用Skill的时候，他是怎么发现Skill的？Skill的格式又是怎么样的？\n\n这你就一下能把所有东西都学懂了，学懂什么MCP，学懂什么Skill，学懂什么Tools，Context 什么的\n\n最后你就会发现这些东西统称叫做 Harness \n\n那很多的Agent产品无非就是Harness的区别，无非就是工具的区别。像Workbody它最大的亮点就是连接器，可以连接企微、飞书各种各样的连接器。连接器说白了就是MCP。再看到千人办公，或者说豆包工作，都是这种逻辑，只不过各自稍有不同，更加融合他们的生态罢了\n\n甚至往海外看，Claude Code 和Codex它们也都是一个Agent Loop不断地跑，只不过有各种的上下文管理、记忆管理、任务编排等等，还有Subagent管理等等的\n\n所以最重要的还是 Agent 面向的场景", "quotes": [], "likes": 254, "bm": 234, "url": "https://x.com/chasen_liao/status/2103143900051575167"}, {"ty": "深度文章", "tp": "Agent 工程", "name": "Kasong", "handle": "kasong2048", "date": "2026-09-24 12:43", "ts": "2026-09-24T03:43:55.000Z", "text": "总结下 如何让 Agent 遵守你定的规则？\n\n从宏观、微观 2 个维度讲，宏观的原则是：\n> 将规则分离为“工程化的确定性”与“Agent 语义理解的不确定性”\n\n举个前者的例子：\n“我希望 Agent 生成的代码不要太复杂” 这句话可以解释为“单个模块代码不要超过 500 行”，可以实现为 lint 规则，当 Agent 生成超过 500 行的模块代码时，lint 报错，Agent 借此纠偏\n\n不能被工程化确定的规则，才考虑写成给 Agent 的规范，比如：“开发时应遵循 TDD”就没法被工程化确定，只能作为给 Agent 的规范。\n\n宏观维度确定了“什么给工程化，什么给 Agent”，微观维度则是指：规范应该怎么暴露给 Agent？梳理下常见的暴露点：\n1. 最高优：AGENTS.md\n2. 渐进披露：Skill 中\n3. 各种可能被路由到的规范文档\n4. 各种 Agent 的执行规范文档（比如 Spec、Ticket、PRD），甚至是简单的计划模式\n5. 脚本执行后输出给 Agent 看的提示\n\n不要拘泥于类似“AGENTS.md 该怎么怎么写”，核心原则是：\n> 对你来说越重要的规范，就在 Agent 面前暴露越多次，次数越多，被遵循的概率越高\n\n举例：\n你希望“测试时不要一个测试失败，修复后就从头跑，应该从失败的开始继续跑”，可以：\n1. 在 AGENTS.md 中暴露一次\n2. 改造测试脚本，每当 agent 执行测试时，脚本会输出 agentHint 参数，指导 agent 测试时应遵守的约束，再暴露一次\n\nagentHint 示例：\n“如果当前 session 反复执行多次测试，当修复失败用例后，应该从失败用例继续跑，最终全部通过后再整体跑一遍” \n甚至更进一步，记录项目的测试执行情况，当发现符合上述调用规律时，agentHint 直接要求从失败用例继续跑。", "quotes": [], "likes": 28, "bm": 34, "url": "https://x.com/kasong2048/status/2102967237082841092"}, {"ty": "教程/学习", "tp": "AI 课程与指南", "name": "Lucas", "handle": "lksmlabc", "date": "2026-09-24 18:03", "ts": "2026-09-24T09:03:00.000Z", "text": "麻省理工这本爆火的深度学习教材，居然有完整免费中文版，你知道吗？\n\n《深入理解深度学习》从基础一路讲到神经网络、CNN、Transformer、扩散模型、强化学习等核心内容，而且每章都配了 PPT + Python 练习代码，非常适合系统自学。\n\n重点是：原版免费公开，中文版也有人完整翻译整理好了。\n\n原书地址：https://udlbook.github.io/udlbook/\n中文地址：https://github.com/exacity/deeplearningbook-chinese", "quotes": [], "likes": 359, "bm": 550, "url": "https://x.com/lksmlabc/status/2103047537733357744"}, {"ty": "Prompt", "tp": "图像生成", "name": "虎小象", "handle": "hx831126", "date": "2026-09-24 17:41", "ts": "2026-09-24T08:41:28.000Z", "text": "这条是 Nano banana 时代的提示词，今天要去翻看一条以前的工作流，发现这条提示词，拿出来晒晒！\n\n你可以在 input face ref 处：\n1. 上传一张人物五官的照片（比如你自己的样子，或者你想做的人的样子）；\n2. 或者输入一个人名。\n\nPrompt 👇\n\n————\n\n[INPUT]\nFACE_REF = （上传的人物五官参考图/人脸图，用作身份锁定）\n(可选) GLASSES_REF = （如你有同款橙色镜框参考，可上传；没有就忽略）\n\n[GOAL / ID-LOCK]\n以 用户长传人物五官 为唯一身份基准：100% 还原五官比例、脸型轮廓、眼鼻唇形态、眉骨与下颌线特征；不换脸、不重塑、不“网红化”、不变性别不变年龄段。\n保留真实皮肤质感：轻微瑕疵、毛孔、细纹与自然肤理；拒绝磨皮与塑料感。\n\n[SCENE / COMPOSITION]\n画幅 9:16 竖构图；studio-style close-up editorial portrait（肩部以上或半身更近的头肩肖像），人物轻微仰头正对镜头，视线直视，表情冷静自信、严肃克制。几缕头发在脸上飘过。\n服装：黑色修身高领针织（tailored turtleneck，线条利落）+ 外搭极简当代风高领黑色夹克/外套（minimalist contemporary fashion，干净硬朗）。\n\n[COLOR CONCEPT / SELECTIVE COLOR]\n整体黑白单色（monochrome black-and-white），仅保留墨镜为彩色：半透明橙色醋酸板材镜框（rectangular，圆角柔和，glossy），琥珀渐变镜片（amber gradient lenses）。\n除墨镜外任何部位禁止出现彩色（皮肤、衣物、背景、反光都保持黑白）。\n\n[LIGHTING / CAMERA LOOK]\n顶光主光\n相机参数观感：f/2.0，ISO 100，1/125s；专业人像镜头质感，背景干净简洁\n\n[STYLE GUARDRAILS]\nphotorealistic，editorial luxury fashion portrait，professional studio photography\nno illustration, no painterly effects, no CGI look, no anime, no beauty-retouch look", "quotes": [], "likes": 276, "bm": 258, "url": "https://x.com/hx831126/status/2103042118675833252"}, {"ty": "教程/学习", "tp": "AI 课程与指南", "name": "Tao Wang", "handle": "Tao100086", "date": "2026-09-24 11:16", "ts": "2026-09-24T02:16:16.000Z", "text": "中秋+国庆长假，不出门的话，不如学习Agent课程吧。\n\n整理了四档我认为很值得看的课程。其中三档我已经烧录了双语字幕上传到 B 站，并建立了课程合集，这里统一分享给大家。\n\n这四套内容的侧重点也刚好不同：AI 产业经济 → 自我提升型 Agent → AI 产品工程 → Agent 系统工程。如果完整学下来，基本可以从产业、研究到工程实践建立一套比较完整的 Agent 知识框架。\n\n1）斯坦福公开课：AI 超级周期的经济学\n\nStanford MS&E 435：Economics of the AI Supercycle\n\n这是斯坦福管理科学与工程系推出的一门 AI 产业课，由 Altimeter Capital 合伙人 Apoorv Agrawal 授课，并邀请 Databricks、Vercel、OpenAI、Anthropic、Crusoe、Baseten 等公司的一线创始人和负责人参与。\n\n它不教 Prompt，也不教怎么调用模型 API，而是从经济学和产业链角度拆解整个 AI Stack：生成式 AI 的经济模型、GPU 与芯片、数据中心和 AI Factory、企业 AI、模型与推理基础设施、Coding AI，以及生命科学等应用层。\n\n真正值得看的，是它一直在回答一个问题：AI 这轮超级周期里，成本、价值和利润最终会沉淀在哪一层？\n\n课程官网：https://mse435.stanford.edu/\n\nYouTube 官方课程播放列表：\n\nhttps://www.youtube.com/playlist?list=PLoROMvodv4rOAe_DtQYOCKy6_x3irEYV1\n\nB站链接：https://space.bilibili.com/433626734/lists/9038400?type=season\n\n2）斯坦福公开课：自我提升型 AI 智能体\n\nStanford CS329A：Self-Improving AI Agents\n\n这是斯坦福 2025 年秋季开设的研究生研讨课，由 Aakanksha Chowdhery 和 Azalia Mirhoseini 共同讲授，课程录像于 2026 年公开。\n\n它研究的不是“怎么搭一个 Agent Demo”，而是更进一步的问题：Agent 如何通过与环境以及自身交互，不断提升自己的能力？\n\n课程从 Test-Time Compute Scaling、Verifier 和 Constitutional AI 开始，一路进入反馈学习、强化学习、工具与代码使用、Memory、多步推理与规划、Deep Research Agent、评测以及未来研究方向。\n\n核心逻辑可以概括为：生成 → 验证 → 筛选 → 学习 → 再生成，最终形成持续迭代的 Agent 自我提升闭环。研究味很浓，非常适合已经了解 Agent 基础、准备继续往训练和自我进化方向深入的人。\n\n课程官网：\n\nhttps://cs329a.stanford.edu/\n\nYouTube 完整课程播放列表：\n\nhttps://www.youtube.com/playlist?list=PLangBM27OtEA\n\nB站链接：https://space.bilibili.com/433626734/lists/9049748?type=season\n\n3）AI Product Engineering\n\nHamel Husain 和多位一线 AI 工程师在 Maven 上做了一套 AI Product Engineering 系列课程，一共 13 场，完整内容大约 9.5 小时。\n\n和很多偏模型、论文或者 Agent Framework 的课程不同，这套课讨论的是一个非常现实的问题：怎样把“能跑的 AI Demo”真正变成一个可靠的 AI 产品？\n\n13 场内容被归纳为 Evals、Context 和 Systems 三大部分，涵盖错误分析、生产级 Evals、Data Agent、模型级联、多向量检索、Search Agent、Embedding、OCR、推理延迟、开放权重模型、Agent Sandbox，以及什么时候应该进行 Post-training 等。\n\n很多讲师就是这些技术的一线实践者，所以课程非常偏工程实战，对正在真正做 AI 产品的人参考价值很高。\n\nMaven 官方课程入口：\n\nhttps://maven.com/lls/21f487\n\nHamel 整理的 13 场课程笔记：\n\nhttps://hamel.dev/notes/llm/ai-product-engineering/index.html\n\n目前没有发现包含完整 13 场的官方 YouTube 播放列表。部分课程后来上传到了 YouTube，但完整录播目前以 Maven 为准。\n\n4）CMU 语言技术研究所：LLM-based AI Agents\n\nCMU 11-768：AI Agents\n\n这是卡内基梅隆大学 Language Technologies Institute（LTI）在 2026 年秋季新开的研究生课程，由 Graham Neubig 和 Daniel Fried 两位教授共同讲授，目前课程仍在持续更新。\n\n课程给 Agent 的定义非常明确：使用 LLM 在多步交互中感知、推理、规划并作用于环境的系统。\n\nAgent 可以调用工具、操作界面、编写代码、搜索信息并与人协作，从而完成真实世界任务。\n\n它最值得看的地方，是没有停留在“Prompt + Tool Calling”的应用层，而是把 Agent 当成一个完整系统来研究：从 Agent Harness 的构建，到 Evaluation、长程推理、训练、强化学习、安全和人机交互。\n\n课程同时强调动手实现与前沿研究，非常接近 2026 年 Agent 工程真正正在解决的问题。\n\n课程官网：\n\nhttps://www.cmu-agents.com/\n\nYouTube 官方课程播放列表：\n\nhttps://www.youtube.com/playlist?list=PLSN0qpDfUvTM\n\nB站链接：https://www.bilibili.com/video/BV1uDhf6wEFs/\n\n如果不知道从哪一套开始，我更建议把它们看成四个不同的观察视角：\n\nMS&E 435 看的是整个 AI 产业的钱和价值往哪里流；\n\nCS329A 看的是下一代 Agent 如何训练、验证并持续自我提升；\n\nAI Product Engineering 看的是怎样把模型真正做成可靠的产品；\n\nCMU 11-768 则开始拆 Agent 本身的 Harness、Eval、Training 和完整系统工程。\n\n四套课程并不重复，反而刚好可以拼成一张从 AI 产业 → 模型能力 → 产品工程 → Agent 系统 的学习地图。\n\n假期不想出去人挤人的，可以挑一套慢慢啃。\n\n学习愉快。", "quotes": [], "likes": 538, "bm": 678, "url": "https://x.com/Tao100086/status/2102945180030808223"}, {"ty": "工具/项目", "tp": "设计资源", "name": "Shadcn Labs", "handle": "shadcnlabs", "date": "2026-09-24 06:14", "ts": "2026-09-23T21:14:26.000Z", "text": "wtf this is crazy: https://mdxcn.dev", "quotes": [], "likes": 592, "bm": 848, "url": "https://x.com/shadcnlabs/status/2102869221491593380"}, {"ty": "深度文章", "tp": "Agent 工程", "name": "盐粒 Yanli", "handle": "beautyyuyanli", "date": "2026-09-23 23:59", "ts": "2026-09-23T14:59:37.000Z", "text": "https://blog.yanli.one/pycon-china-2026-agent-platform-zh\n\n本文根据我在 PyCon China 2026 上的演讲《如何设计 Agent 制度体系与运行平台》整理，幻灯片版本见 https://blog.yanli.one/slides/pycon-china-2026-agent-platform-zh/。", "quotes": [], "likes": 141, "bm": 164, "url": "https://x.com/beautyyuyanli/status/2102774894823911893"}, {"ty": "工具/项目", "tp": "网络与代理", "name": "Geek", "handle": "geekbb", "date": "2026-09-24 17:12", "ts": "2026-09-24T08:12:00.000Z", "text": "用一台1 核 1G 的小 VPS 同时给主机、掌机、手机和路由器做 DNS 分流、SNI 中转和订阅管理，客户端不需要装任何软件。\n\nHyperDNS 是 Go 写的单二进制 SmartDNS 服务，把 UDP/TCP 53、DoT 853、DoH 和一层四层 SNI 中转放进同一个进程，附带 Web 面板和 hdns 终端菜单。\n\nhttps://github.com/IzumiRain/HyperDNS https://x.com/geekbb/status/2103034702554976353/photo/1", "quotes": [], "likes": 194, "bm": 376, "url": "https://x.com/geekbb/status/2103034702554976353"}, {"ty": "深度文章", "tp": "纯链接（X 长文等）", "name": "何居上", "handle": "hejushang8", "date": "2026-09-23 12:32", "ts": "2026-09-23T03:32:43.000Z", "text": "https://x.com/i/article/2102588711330590720", "quotes": [], "likes": 719, "bm": 1928, "url": "https://x.com/hejushang8/status/2102602033488634298"}, {"ty": "资讯", "tp": "模型与平台动态", "name": "OpenCode", "handle": "opencode", "date": "2026-09-23 23:31", "ts": "2026-09-23T14:31:05.000Z", "text": "Space Bunny (stealth model) is free for the next week\n\n- 1M Context\n- Multi-modal\n- Zero Data Retention", "quotes": [], "likes": 7422, "bm": 1378, "url": "https://x.com/opencode/status/2102767716666941864"}, {"ty": "工具/项目", "tp": "模型与 AI 应用", "name": "WquGuru", "handle": "wquguru", "date": "2026-09-23 23:37", "ts": "2026-09-23T14:37:58.000Z", "text": "所有有 GPU 或者 Macbook 的朋友，都应该本地部署一次 Qwen-Image-2.1（写实） 和 Anima（二次元）！不联网、无审查，小显存、小统一内存也能跑。\n\n我测试了一周，感觉的十分惊艳，下面整理了一批本地能跑的出图模型。友情提示：\n\nQwen 擅长写实、构图、图里写字，需要二次元就换 Anima。\n\n一、写实主力：Qwen-Image-2.1\n\nMac 首选 MLX 4bit（mflux 跑）：https://huggingface.co/JoyFusionAI/Qwen-Image-2.1-MLX-4bit\nGGUF Q4_K（stable-diffusion.cpp 跑）：https://huggingface.co/leejet/Qwen-Image-2.1-GGUF\n文本编码器：https://huggingface.co/Qwen/Qwen3-VL-8B-Instruct-GGUF\n专属 VAE（别换成别的）：https://huggingface.co/Comfy-Org/Qwen-Image-2.1\n\n两个坑：cfg 用 1，这个模型按无引导训练，开到 6 慢一倍、画质没提升；mflux 跑 20 步构图容易崩，正式出图用 40 步。\n\n二、二次元主力：Anima\n\n基于 NVIDIA Cosmos-Predict2 的新架构，约 2B，不是 SDXL 微调。Danbooru 标签和自然语言都能用，比 Qwen 轻得多。\n\n官方：https://huggingface.co/circlestone-labs/Anima\nCivitai：https://civitai.com/models/2458426/anima\nWAI 作者的版本 WAI-Anima：https://civitai.com/models/2544636/wai-anima\nWAI-Anima int8 量化（约 2.1GB，省显存）：https://civitai.com/models/2758727/wai-anima-int8-mxfp8\n\n有三个版本：Base 适合练 LoRA，Aesthetic 默认画风更好看，Turbo 8–12 步出图。要单独配文本编码器 qwen_3_06b 和 Qwen-Image VAE，不是普通的 checkpoint，丢进去不能直接跑。\n\n三、要锁定角色、要海量 LoRA：Illustrious 系列\n\nWAI-Illustrious SDXL：https://civitai.com/models/827184\n\n角色一致性和服装标签，LoRA 数量约 20 万级，冷门角色基本都有。\n\n最后值得注意：模型文件本身也可能被投毒。只下 .safetensors，不碰 .ckpt / .pt；Civitai 上来源不明的 merge 慎用，注意核查hash。Anima 系列是非商用许可，商用前需要注意这点。\n\n效果直出👇", "quotes": [{"type": "quoted", "text": "有一个模型比 Qwen-Image-2.1 更牛，可能 90% 玩本地大模型的朋友都不知道。论 NSFW……人家可是老祖宗，更关键的是，生成速度是 Qwen 的 5 倍！！！\n\n这么说吧，我在 Mac 上跑了上百张实测，Qwen-Image-2.1 出一张最高分辨率（1328×1328）的图要 30 分钟，这个模型出一张只要 5 分钟😆\n\n它就是 WAI-Illustrious SDXL v17.0。Illustrious（SDXL）底模，fp16 单文件 6.5GB，VAE 内置。不用 N 卡，ComfyUI 走 Metal 直接跑，1024 方图只需 15 步，78 秒出图。\n\nwhatever，模型链接我都整理好了，供有需要的朋友去研究：\n\n1. WAI-Illustrious SDXL v17.0 🔗🫱https://civitai.com/models/827184?modelVersionId=2883731\n\n2. Qwen-Image-2.1：\nMLX 4bit（mflux）🔗🫱https://huggingface.co/JoyFusionAI/Qwen-Image-2.1-MLX-4bit\nGGUF Q4_K（sd.cpp）🔗🫱https://huggingface.co/leejet/Qwen-Image-2.1-GGUF\n\n很难想象，如果有本地世界模型了，这个世界会变成什么样😅", "who": "@wquguru", "url": "https://x.com/i/status/2102717889585586493"}], "likes": 796, "bm": 1444, "url": "https://x.com/wquguru/status/2102769448398782894"}, {"ty": "资讯", "tp": "模型与平台动态", "name": "seekinganythingbutalpha", "handle": "ivanalog_com", "date": "2026-09-24 10:35", "ts": "2026-09-24T01:35:14.000Z", "text": "本地AI最严厉的父亲出现了\n\nGoogle向Gemini用户开放了GPU机时权限，可以通过Collab CLI访问。\n\nPro用户每个月折合约26个小时的A100（80G）使用权限 https://twitter.com/GoogleColab/status/2102459388040790496", "quotes": [{"type": "quoted", "text": "Colab is now part of Google AI plans! Subscribers get priority access to fas
