const D=[{"ty": "工具/项目", "tp": "设计资源", "name": "枯白啃设计", "handle": "Kubai087", "date": "2026-11-02 14:13", "ts": "2026-11-02T05:13:16.000Z", "text": "不论是从功能性，美观度上来说，图表组件我只推荐：https://developer.dynatrace.com/design/data-visualizations/charts/DonutChart/", "quotes": [{"type": "replied_to", "text": "推荐多看看 Cloudflare、Supabase 这些产品，涉及仪表盘就多看看 Dynatrace https://twitter.com/heloumaster/status/2116748537707040899", "who": "@Kubai087", "url": "https://x.com/i/status/2117121674151874822"}], "likes": 13, "bm": 16, "url": "https://x.com/Kubai087/status/2117122849672720451"}, {"ty": "深度文章", "tp": "行业与观点", "name": "KC", "handle": "ScarletKc", "date": "2026-11-02 13:49", "ts": "2026-11-02T04:49:21.000Z", "text": "最近硅谷 AI 圈最有趣的连续剧，迎来了 Day 28 的大结局。\n\n简单补个前情提要：一边是 OpenAI 负责 Codex 和个人智能体 Dot 的 Tibo，因为一言不合就给用户重置额度，被社区戏称为 Reset Company（后面成了 Token Company）。他在 10 月初立了个 28 天挑战，每天要么发新功能，要么全员重置额度。另一边是前 Meta React 编译器核心成员、现在在 SpaceXSI 的 Lauren（也就是 poteto），以极其严苛的 Agent 工程流和每个月合并上千个 PR 出名，自称 Ship Company（既造飞船又高频发版）。\n\n这两个人最近在 X 上高强度互怼互撩了上百个回合，甚至有网友专门建了三个网站来实时抓取他俩的互动记录。前几天 Tibo 刚和 Meta 的 Alexandr Wang 围绕自家的 Dot 和 Meta 的 Muse 吵了一架，转头就买下 http://poteto.com 整了个大活，拿了 300 万浏览量。\n\n当时 poteto 吐槽说自己买不起 http://tibo.com，然后默默发了个 Day 28 的预告。到了今天第 28 天，她花了 5.99 美元买下 http://tibo.dog 这个域名，用 Grok Bot 和 Cursor 搓了一个完成度极高的类吸血鬼幸存者网页游戏，甚至可以直接在 X 的推文卡片里点开玩。\n\n最神的是，游戏在 4 天前就开坑了，设定是 Tibo 带着一群狗在满屏怪潮里求生。结果就在游戏发布前几个小时，Tibo 刚好发推吐槽手机输入法老是把自家的智能体 Dot 自动纠错成 dog，害他收到一堆诸如“我太爱我的狗了，昨天它还帮我约了理发”的搞笑短信。两边纯属巧合地撞在了一起，节目效果直接拉满。除此之外，游戏里把额度重置做成了核心机制，还顺带把 Meta 的 Muse 和 Alexandr Wang 的梗全写进了彩蛋里。\n\n本来以为只是个玩梗小游戏，结果看她发出来的技术复盘，完全是一份教科书级别的 AI 辅助工程实践：\n\n整个项目是她 4 天前利用业余时间开的坑，4 天里靠 Agent 提交并合并了大约 1150 个 PR。\n\n工作流最核心的一点是：每次她在代码里发现问题，不是自己去改，而是让 Bot 针对这个问题写一条 lint 规则。甚至代码里直接通过 lint 规则禁止写注释，如果一段代码需要解释，解决办法只能是改个更好的变量名或者补一个测试。\n\n为了防止游戏卡顿，她把上下文直接写进了文件路径里。所有每一帧或每个 tick 都要跑的热路径代码，文件后缀都命名为 .hot.ts，并且专门配了 lint 规则禁止在这些文件里做内存分配，不准用对象字面量、闭包或者 new。这样主循环几乎不产生垃圾回收压力，从根源上消除了 GC 带来的掉帧。\n\n状态机部分重度使用了 TLA+ 做形式化验证，剧情、过场动画和核心系统都有各自的形式化验证 skill 来找 bug。\n\n底层除了用 three.js 画 3D 场景，物理模拟、后处理和音频引擎全是自己写的。而且整个模拟层是完全确定性的，每一次游玩都可以通过输入序列精确重放。当你上传高分时，服务端会把你的整局操作完整重放一遍来校验有没有作弊。\n\n更夸张的是整个项目没有任何外部音频和图片资源文件。所有像素画都是纯代码生成的，构建时自动打包成图集。所有音乐和音效都是浏览器里实时合成的，用代码写了一个类似 Game Boy 的芯片合成器加上合成器浪潮层，连乐谱都是代码里的纯文本，切地图时还能保持上一段旋律无缝过渡。\n\n为了保证能塞进 X 的推文卡片里直接跑，构建流程设了严格的体积红线，首包 gzip 之后只有 124 KB，超了构建直接报错。在中端手机上同屏 500 个敌人也能稳定跑满 60 帧，还支持 10 种语言本地化和动态生成结算分享图，连各个难度曲线都是让无头 Bot 自己跑模拟测试调出来的目标存活率。\n\n用最硬核的形式化验证、零内存分配约束和确定性引擎，去写一个成本 5.99 美元域名的玩梗游戏。这大概就是顶级工程师用好 Coding Agent 之后最真实的日常状态：生成代码已经不稀奇了，怎么用编译器思维、lint 规则和自动化验证把 Agent 管得服服帖帖，才是真正拉开差距的地方。", "quotes": [{"type": "quoted", "text": "Day 28/ tibo's game has landed\n\ni spent $5.99 on this domain, but i had a blast making it with grok bot and cursor! i hope you enjoy it and find all the easter eggs 🤍 \n\nif i did it right you should be able to play it inside of X too\n\nhttps://tibo.dog", "who": "@poteto", "url": "https://x.com/i/status/2117004709198475365"}], "likes": 898, "bm": 980, "url": "https://x.com/ScarletKc/status/2117116830250860724"}, {"ty": "工具/项目", "tp": "AI Agent 与编程工具", "name": "sahen", "handle": "sahenjpn", "date": "2026-11-01 22:08", "ts": "2026-11-01T13:08:18.000Z", "text": "https://github.com/sahenjp/RustXNG", "quotes": [{"type": "replied_to", "text": "やっべ、検索APIの存在意義を揺るがしてしまったかもしれない…。\n\n私が開発した「RustXNG」という、SearXNGベースのローカル検索エンジンが、なんとあのExaに迫る検索精度を出してしまいました〜〜〜〜〜〜〜！\n\n実行ごとにばらつきはあるものの、平均でもExaにかなり近い数値。\n\nそしてTavilyとの比較では、検索1位の正解率で30ポイント差をつけました。\n\nグラフを見てもらえば分かる通りです。\n\nしかもRustXNGはオープンソース。自分の環境で動かせます。\n\nこれ、我ながらすごいことなのでは....??\n\nX-algorithmに基づいてリポジトリはリプにおいておきますね！", "who": "@sahenjpn", "url": "https://x.com/i/status/2116879973135098159"}], "likes": 424, "bm": 636, "url": "https://x.com/sahenjpn/status/2116880010866995352"}, {"ty": "工具/项目", "tp": "AI Agent 与编程工具", "name": "sahen", "handle": "sahenjpn", "date": "2026-11-01 22:08", "ts": "2026-11-01T13:08:09.000Z", "text": "やっべ、検索APIの存在意義を揺るがしてしまったかもしれない…。\n\n私が開発した「RustXNG」という、SearXNGベースのローカル検索エンジンが、なんとあのExaに迫る検索精度を出してしまいました〜〜〜〜〜〜〜！\n\n実行ごとにばらつきはあるものの、平均でもExaにかなり近い数値。\n\nそしてTavilyとの比較では、検索1位の正解率で30ポイント差をつけました。\n\nグラフを見てもらえば分かる通りです。\n\nしかもRustXNGはオープンソース。自分の環境で動かせます。\n\nこれ、我ながらすごいことなのでは....??\n\nX-algorithmに基づいてリポジトリはリプにおいておきますね！", "quotes": [], "likes": 2605, "bm": 3254, "url": "https://x.com/sahenjpn/status/2116879973135098159"}, {"ty": "工具/项目", "tp": "AI Agent 与编程工具", "name": "あーなるほどね", "handle": "ANAg2bGOD", "date": "2026-11-01 22:52", "ts": "2026-11-01T13:52:13.000Z", "text": "いや、この人はマジでフォローしておいた方がいいです。\nRustXNGを作ったSahen、私の知り合いなんですけどまだ10代なんですよ。\n\nしかも小学生の頃からコードを書いていて、今は大規模プロジェクトであるRust製DeepSeek Herness、「rustdsh」の開発も主導してる。LLMの知識も相当深い。\n\nこの時点で大分おかしいんだけど、今回出してきたRustXNGもとんでもない。\n\nそもそもRustXNGとは、AIエージェントにWeb検索をさせるためのローカルで動く検索エンジンです。しかもRust製ということで、とにかく早い。\n\n普通、AIにWeb検索をさせるにはExaやTavilyのような検索APIを使ったりするんですが、RustXNGなら自分のPCやサーバーで動かせるし、有料の検索APIを契約する必要もない。\n\n複数の検索サイトから結果を集めて重複を除去し、関連度順に並べ替える。しかも検索結果のURLや概要だけじゃなく、実際のWebページの本文まで取得してAIに渡せる。\n\n要するに、AIが外部の情報を調べるための検索基盤を自分の環境に構築できるというもの。\n\nしかもこれ、Python製のSearXNGをRustに移植して、226種類の検索エンジンに対応させてるんですよ。\n\n非同期処理やキャッシュ、独自のランキングまで実装していて、作者のベンチマークでは起動時間が0.72秒→0.03秒、常駐メモリが118MiB→13MiB。\n\nさらにExaやTavilyと検索精度まで比較してて、実際の測定ではExaに迫り、Tavilyを上回る結果まで出してるんですよね。\n\nいや、10代でこの規模のRustを書ける時点で相当すごいのに、これが彼の開発しているプロジェクトの一つでしかないのが一番意味わからん……\n\nRustもLLMもここまで深く扱えて、大規模OSSの開発まで主導してる10代ってなかなかいないと思う。\n\nSahenはもっと知られていい開発者だと思うし、RustやLLM、AIエージェントに興味ある人はマジでフォロー推奨です。", "quotes": [{"type": "quoted", "text": "やっべ、検索APIの存在意義を揺るがしてしまったかもしれない…。\n\n私が開発した「RustXNG」という、SearXNGベースのローカル検索エンジンが、なんとあのExaに迫る検索精度を出してしまいました〜〜〜〜〜〜〜！\n\n実行ごとにばらつきはあるものの、平均でもExaにかなり近い数値。\n\nそしてTavilyとの比較では、検索1位の正解率で30ポイント差をつけました。\n\nグラフを見てもらえば分かる通りです。\n\nしかもRustXNGはオープンソース。自分の環境で動かせます。\n\nこれ、我ながらすごいことなのでは....??\n\nX-algorithmに基づいてリポジトリはリプにおいておきますね！", "who": "@sahenjpn", "url": "https://x.com/i/status/2116879973135098159"}], "likes": 1477, "bm": 1551, "url": "https://x.com/ANAg2bGOD/status/2116891062564442304"}, {"ty": "深度文章", "tp": "行业与观点", "name": "躺在废墟里 Lieflat", "handle": "lieflat_3", "date": "2026-11-02 13:29", "ts": "2026-11-02T04:29:58.000Z", "text": "气死我了！今天发现，我的好几个 Skill 被 WorkBuddy 改名换姓上架了。\n\nWorkBuddy，搬运我的开源 Skill，为什么连作者署名都省了？\n\n完全没有获得商业授权，为什么能上架我禁止商业使用的 Skill？\n\n甚至都不敢用我的 Skill 名称，拙劣地改了名字直接上架？\n\n目前已经发现的有四个。\n\n1. Lieflat Charts（https://github.com/larashero3-dotcom/lieflat-charts）\n\n在 WorkBuddy 上，展示名称被改成了“模板图表与报告”，截图里的标识是 `wbzl-lieflat-charts`，还给我加上了面向 Workbuddy 中文用户，谁允许你们用这种方式改编？\n\n这个项目采用非商业使用许可，商业使用需要另行取得授权。请 WorkBuddy 说明，收录的是哪个版本，依据什么授权将它集成到产品并提供给用户使用？\n\n2. Lieflat Gongwen （https://github.com/larashero3-dotcom/lieflat-gongwen）\n\n在 WorkBuddy 上，展示名称变成了“公文语料写作教练”。\n\n这个项目同样采用非商业使用许可，项目说明明确写了，未经单独书面许可，不得集成到商业产品或商业服务中。请问，上架前有没有核对这些条件？对应的授权依据是什么？\n\n3. 去 AI 味（lieflat-less-ai-tone）https://github.com/larashero3-dotcom/lieflat-less-ai-tone\n\n到了 WorkBuddy 上，展示名称变成了“AI写作痕迹清理”，完全没有我的署名。\n\n4. 写作 DNA 蒸馏器（writing-dna-skill）https://github.com/larashero3-dotcom/writing-dna-skill\n\n安装前的展示页面里，我没有看到作者和原项目来源。安装之后，在正文底部能看到原项目链接和 MIT License 标注。\n\n但作者和来源，为什么不能在用户选择、安装这个 Skill 时就清楚展示？为什么需要安装后翻到正文底部，才能看到出处？\n\n自己花时间写的东西，被放进别人的产品里，换了名字，用户看到了可以直接安装，却不容易知道是谁做的。作为作者，这个感受非常糟糕。\n\n我把作品公开分享，贡献给开源社区，使用条件写得非常清楚，也希望这些条件得到尊重。怎么到了产品上架的时候，内容拿走了，作者署名和使用限制却没有得到同样的重视？\n\n我希望 WorkBuddy 正面回应：\n\n- 说明这四个 Skill 的来源、收录时间、具体版本和授权依据。\n- 补全作者署名，在安装前的详情页明确标注原项目链接及许可信息，说明名称和内容做过哪些修改。\n- 逐项核查使用许可，停止不符合许可条件的使用，该下架的下架。\n- 对涉及未经授权商业使用的项目，说明使用时间、范围及相关分发情况，承担相应责任，并就损失赔偿及合理维权费用提出处理方案。\n- 说明以后如何审核来源和授权，避免其他作者遇到同样的问题。\n\n请尊重开源创作者的创作，遵守资源使用规则，珍惜产品口碑。", "quotes": [], "likes": 1280, "bm": 615, "url": "https://x.com/lieflat_3/status/2117111952690516412"}, {"ty": "工具/项目", "tp": "AI Agent 与编程工具", "name": "Chimney", "handle": "cccch1mneyyyy", "date": "2026-11-01 14:30", "ts": "2026-11-01T05:30:12.000Z", "text": "上线一天获得3000+star，成为GitHub日趋势榜一的DSH移动端项目——DSH-Go！！\nhttps://github.com/ccch1mneyyy/dsh-go\n感谢大家的支持，我正在持续优化！\n也请大家多多宣传多多star，让更多人使用到这样好的产品，也给我后续优化的更大动力！\n\n快来试试吧！ https://x.com/cccch1mneyyyy/status/2116764724545098227/video/1", "quotes": [], "likes": 201, "bm": 146, "url": "https://x.com/cccch1mneyyyy/status/2116764724545098227"}, {"ty": "深度文章", "tp": "行业与观点", "name": "Gabe", "handle": "fishjar", "date": "2026-11-02 02:44", "ts": "2026-11-01T17:44:12.000Z", "text": "这几天安全圈和科技博主全在疯传一条核弹级预警：任何暴露了 TCP 端口的 Linux 服务器，只要用 Go 写的 Web 服务就会被黑客远程完全接管。\n\n评论区瞬间哀鸿遍野，无数公司的后端运维连夜爬起来打内核补丁。但只要你把 Go 标准库的 net 包源码和 Linux 内核的 socket 机制看一遍，就知道这是最典型的概念移花接木。\n\n这个漏洞（CVE 涉及的内核多路径 TCP 模块）确实存在，严重级别也确实高，但攻击的前提条件被自媒体故意掐掉了。\n\nGo 语言的 net.Listen(\"tcp\", \":8080\")，底层调用的是操作系统最原始的 AF_INET、SOCK_STREAM 和 IPPROTO_TCP。\n它走的是规规矩矩的单路径普通 TCP 协议栈，根本不会主动去协商 MPTCP。\n\nMPTCP（MultiPath TCP，RFC 8684）在 Linux 5.6 之后确实合入了主线内核，但它是一个必须显式声明的特异协议。\n除非你在代码里显式写了 IPPROTO_MPTCP，或者服务器管理员手动在 sysctl 里开启了 net.mptcp.enabled 并且配置了强制路由代理，否则内核根本不会把进来的普通 TCP 握手包扔给 MPTCP 状态机处理。\n\n真正受影响的，是那些跑在移动回传网络、跨多网卡聚合或者特定 CDN 边缘节点上、主动启用了 MPTCP 的特定网关。\n\n普通跑在内网或者反向代理后面的 Go 业务服务，被这波恐慌吓得睡不着觉，纯粹是替概念炒作买了单。", "quotes": [], "likes": 238, "bm": 168, "url": "https://x.com/fishjar/status/2116949442754728233"}, {"ty": "教程/学习", "tp": "AI 课程与指南", "name": "lauren", "handle": "poteto", "date": "2026-11-01 02:01", "ts": "2026-10-31T17:01:11.000Z", "text": "here’s a short grok bot guide on how i create high quality bots and manage my team. ask @bot to read this post and help you improve your team!\n\n• add dr eggbot to your team! he’s my bot designer that i use to create bots\n• you don’t need a lot of bots. a few good bots can be more useful and easier to manage than a large team\n• tell your bots to create skills for itself as you give it instructions on how to do tasks. this lets them do them more consistently even over long conversations. you can even ask it to create a private github repo for you to store all your skills if you want them preserved independently\n• add connectors, use the vault, and give access to all the tools you use to do your work. you can also ask your bot to setup its own email and it can sign up for its own accounts for better separation \n• thinking about all the work you do by hand, or steps in your workflows where you have to copy and paste information back to your bot. ask your bot how it can do that for you instead!\n• imagine you hired an intern, how would you onboard them and help them do the work correctly and efficiently? introduce yourself to your bot and describe the work you do, then ask it how it can help you automate it\n\nand my favorite tip: use voice mode or the transcription option! it’s a good way to just brain dump a lot of information. then, at the end, tell your bot to “restate this in your own words” so you can confirm it understood you\n\nhttps://x.ai/bot/_jOdbfkB16zxu7MRcmReE", "quotes": [], "likes": 10426, "bm": 19271, "url": "https://x.com/poteto/status/2116576229319233596"}, {"ty": "工具/项目", "tp": "AI Agent 与编程工具", "name": "Tiger Chen & 前端之虎陈随易", "handle": "chenbimo", "date": "2026-11-01 18:19", "ts": "2026-11-01T09:19:41.000Z", "text": "年度最佳 Agent 工具应该颁发给 Finch @FinchAiCode @puterjam https://x.com/chenbimo/status/2116822474533048714/photo/1 https://twitter.com/chenbimo/status/2116703288913698991", "quotes": [{"type": "quoted", "text": "年度最佳软件应该颁发给 Ego lite. https://x.com/chenbimo/status/2116703288913698991/photo/1", "who": "@chenbimo", "url": "https://x.com/i/status/2116703288913698991"}], "likes": 24, "bm": 68, "url": "https://x.com/chenbimo/status/2116822474533048714"}, {"ty": "Prompt", "tp": "编程与代码审查", "name": "Tw93", "handle": "HiTw93", "date": "2026-11-01 16:42", "ts": "2026-11-01T07:42:15.000Z", "text": "有了 AI 以后写代码速度快了非常多，但是校验的速度其实还是不快的，特别是在 GitHub 上跑 Actions CI 的速度，下午花了一些时间对 Mole、Kaku、Pake 的 CI 全部彻底优化了一下，效果很不错，分享给大伙。\n\n你可以这样直接 Copy 下面给到你的 Agent，我们来看看可以帮你节约多少时间。\n\n帮我把这个仓库的 GitHub Actions 提速，在不减少必要的测试项以及功能校验下，最大幅度减少耗时。\n\n1. 先使用 gh 拉最近 50 次的运行情况，把每一个 job 拆成排队、准备、真正跑测试的 3 个时间段，去看规律，可能很多时候慢的是准备的阶段，不是测试本身。\n2. 同一个 PR 连着推好几次时，只跑最新的那次，旧的直接取消掉，用 cancel-in-progress 去实现。不过 main 分支不要这么做，需要确保发版 main 上的每一个提交都完整跑过一遍。\n3. 只改 README 和文档的这种提交不要触发跑 CI，可以用 paths 过滤掉，另外被跳过的必需检查会一直卡住 PR 合不进去，这个要提前注意一下。\n4. 优先用 setup 类 action 自带的缓存，setup-node 打开 cache，setup-go 默认就开，Rust 用 Swatinem/rust-cache，注意每个仓库缓存只有 10 GB，用不上的就不要放到这里面去。\n5. 本地连着构建两次，第二次应该几乎不花时间，假如有多余的花时间的地方，一定是哪些写得有问题，比如 Dockerfile 装依赖前先 COPY 了整个仓库，或者构建脚本盯着一个不存在的文件，类似的问题记得检查。\n6. 工具直接下载预编译好的，不要用 go install、cargo install 现场安装编译，这里会很费时间。\n7. 不互相依赖的 job 并行跑，删掉不传数据的 needs，最长的那套测试拆到多台机器上去跑。\n8. 免费账号的 macOS 最多同时跑 5 个，所有 workflow 共用，格式化、lint、依赖审计这些不挑系统的都移到 Ubuntu 去跑更好。\n9. 做过的事情就不要做重复了，以及不要多此一举做事情，比如别的 job 跑过的检查就不要套重复再跑，比如只构建前端的 job 就不要多此一举去拉整个 Rust 缓存。\n10. 改完去 push 那个上面测试运行效果，看运行的时间，发现规律，再次查漏补缺来优化一遍，做到最好，最后给到我优化前后的对比。", "quotes": [], "likes": 598, "bm": 747, "url": "https://x.com/HiTw93/status/2116797957454401746"}, {"ty": "深度文章", "tp": "行业与观点", "name": "寒塘poolmoon", "handle": "poolmoon6", "date": "2026-11-01 13:00", "ts": "2026-11-01T04:00:02.000Z", "text": "老有人问OpenCode和Command Code为什么那么便宜，是不是量化版，这里干脆集中写一下OpenCode吧。没有任何内幕消息，全部来自公开消息和OpenCode自己的披露。感觉最近真的是谣言越传越多了。\n\nOpenCode最早推的是Zen服务，最低充值10美元用原价调用模型，和OpenRouter差不多。从今年较早时间开始，和中国的开源大模型公司密切合作，包括多次的匿名模型免费发布。Pony Alpha、Hunter Alpha都是先在Zen上亮相的，分别是GLM和小米的模型。（事实上，他们的联合创始人之一是华人）\n\nGo Plan的一开始，是10美元兑换60美元可用额度。主要是有个首月半价，使得它变为最划算的订阅服务之一。后来有几次中国开源模型的发布当天他们就立即适配，甚至在官方权重放出来之前就适配，让我开始猜测他们直接接入的是官方模型。\n\n当时，GLM套餐需要抢，但在Go里面还能用GLM。不过GLM限流无法使用的时候他们的服务也用不了。后来有几次DeepSeek API限流故障的时候他们也一起出故障，基本实锤是官方API中转。\n\n后来他们也在自己的官网FAQ中一一列出了每个开源模型的供应商，绝大部分模型合作方只有一个，就是官方。（在我印象中，GLM还他们列出了另外的供应商如Fireworks AI）\n\n而且Go Plan一直维持ZDR零数据保留政策。我之前提到过，国内很多的订阅Plan，包括当时很火的什么阿里Coding plan，火山Coding plan，全都是霸王条款，要用你的数据去训练的。有些官方Plan如Kimi 的coding plan也没有自己手动关闭数据共享的选项，说是要发邮件给客服。\n\n由于海外用户对于数据传到中国供应商那里还是比较敏感的，OpenCode的联合创始人dax @thdxr 曾经在X上回应过，他们和中国的模型公司都签署了零数据保留政策的合同。这其中的例外包括部分免费提供的模型，以及DeepSeek（每月续签，没有长期合同）。\n\n也就是说，OpenCode有很长一段时间，都是官方中转站性质。这期间，dax曾经在X上回应过，他们是通过官方给的折扣价格提供服务，所以可以比较便宜。DeepSeek的V4正式版出来的时候，他们提供过一段时间的免费，用量爆发。同时，他们悄悄增加了一个设置开关，必须允许数据传输到中国，才可以继续用DeepSeek V4. \n\n其实，以当时的价格，如果没有首月半价，那么只有小米和DeepSeek在Go里面是更划算的。像GLM、Kimi、MiniMax都是官方Plan更划算。他们偶尔也会提供短期折扣，比如Kimi多次有3倍额度之类的，但是并不真的更便宜。（这里大家要知道，小米的token plan基本上只有什么七折或八折之类的优惠，基本上省不了什么钱，所以Go里的6倍用量就很划算）\n\n这期间，发生了一次较大的争议。导火索是DeepSeek突然宣布降价。原本降价是好事，但是OpenCode曾经一直承诺10美元换60美元额度，而DeepSeek价格降为之前的1/4以后，Go Plan中价格却没有降。不过依然是当时能找到的最便宜的DeepSeek价格（短期促销免费的不算）。\n\n只是随着时间推移，一些新进入用户发现DeepSeek的价调用价比官方贵，dax也不得不回应说，DeepSeek官方不愿意对DeepSeek V4 Flash提供之前的折扣，因为官方本身在API调用价格上的利润空间不够（同时也暗示，其他很多模型的官方API本来就有很大利润空间）。\n\n然后更大的事情来了，DeepSeek又宣布涨价了！几乎是在官方涨价的第二天，Go Plan的价格就不得不随之上涨\n\n接下来发生了什么，我只能靠猜测，但是最终的结果是，Go Plan上的API价格和官方调整为一致，但是V4 Flash的可用额度被降为$15. （V4 Pro仍然是$60）\n\n这件事情导致非常多的中国用户尤其是新订阅用户感到自己被欺骗了，虽然他们用到的已经是最便宜的DeepSeek，但是给个人的感知就是，自己以前用不完的DeepSeek，现在很快就会用完。\n\n从此以后，Go Plan终结了自己永远1:6兑换的年代，同时越来越多的模型厂商跟进，因此现在你去看Go Plan，五花八门的什么比例都有。而OpenCode在中国用户中的名声从此一落千丈，骂他创始人是印度人骗子，猜测模型灌水之类的声音一直没停过。\n\n总结一下：到此时为止，Go Plan一直是官方API中转。\n\n也正是从这个时候开始，dax宣称自己开始找第三方算力服务商，希望能够以自部署的方式提供API。这也可以理解，谁愿意把自己的好不容易培养的用户口碑，依赖于外部厂商？他基本上是把X当作找合作伙伴的窗口了。\n\n这就诞生一个叫CheapSeek的词，意思就是找便宜的DeepSeek。期间dax还很高兴地宣布说找到了能提供之前价格的DeepSeek算力合作伙伴，把大家的胃口吊得很高。\n\n这时候，Command Code登场了。它为DeepSeek提供的比例是1:7。此时舆论开始往对OpenCode不利的方向发展，人们认为Command Code更划算，OpenCode一直辜负了之前买了便宜API的老用户，纷纷退订。\n\ndax则表示：他们在市场上找来找去，所有声称能提供更便宜DeepSeek的算力服务商，要么是吹牛，要么不是满血版，并且暗戳戳地指责Command Code是靠自身出血补贴用户，是不可持续的。\n\n然后，两家就开始了频繁而激烈的价格斗争，你方唱罢我登场，dax买的B300机架也终于到位（看起来，他放弃了那些声称能低价提供的算力服务商而选择自建）。接着，DeepSeek V4.1 flash面世时，两家均在DeepSeek官方API上新后，一天左右提供了新适配。各自活动补贴一段时间后，双方都来到了10美元换80美元DeepSeek V4.1 Flash的常规状态，最近几天又来到了$100. \n\n这时候，越来越多的声音说，他们两家为什么这么便宜，是不是量化版的。dax在多个帖子里分别解释，模型厂商的推理毛利率很高，高达85%以上。所以他们自部署是能做到低价的，不是补贴，也不是量化。\n\n而他没说出来的是，中国厂商根本买不到那么多B300机器，宝贵的英伟达新一代显卡要留给训练，只能用早期版本或者国产GPU做推理服务。中间有适配成本，适配周期，推理效率的很多坑。即使不考虑占地面积成本，购卡成本和日常维护、电费等也基本会有4-5倍的差异。这部分，是我根据公开价格，和AI一起进行的估算。每个人都可以用公开信息自己去算一算。（梁文锋自己之前也说过华为卡对比英伟达，推理效率有4倍差异）\n\n也就是说，在DeepSeek自己推理毛利很高，且近期开源了DeepInfra的情况下，OpenCode完全有可能做到比DeepSeek自己的成本还低。现在唯一的问题是：他们买不到新的B300，因为他们的规模太小了。\n\n之前我在另一个帖子里分析过，一套B300的token处理规模大概是OpenCode当前处理规模的一半。dax也曾公开表示，峰值的API调用，他们必须路由到官方才能扛住。按照目前社区的信息，大家实测后，更多发现的是速度确实不如官方，但却没有找到多少模型智商打折的证据。\n\ndax最近说deepseek本身就是一个专家权重FP4量化的模型，没有继续量化的意义，并且说要找官方认证他们提供的推理服务和官方权重一致。如果你真的需要证据，也可以再等一等。\n\n总结一下：和DeepSeek官方权重相同的推理服务，以现在的10美元换100美元的价格提供是完全可能且并不需要补贴的，并且仍然有提升空间。只是OpenCode规模太小，买不到更多新款GPU集群。\n\n这么随手一写，一不小心写了很长。也难怪之前很多人分析这个问题都分析不到点子上，毕竟中间的曲折太多了。此外，这里面的很多信息，也不仅仅是依赖dax一个人说的话。梁文锋的几次被爆出来的公开讲话，DeepSeek官方公告，B300和昇腾卡的公开性能等等，很多都可以作为佐证。\n\n本文仅代表本人印象和信息综合分析，如有错漏，请予谅解。\n\n利益相关：曾经订阅过Open Code Go Plan数月，现在仅持有Command Code 订阅。原因是Open Code API适配问题。\n\n相关阅读：\nhttps://x.com/poolmoon6/status/2116007181527179361?a=MlNYSOqGg6FdgcSigmc&s=20\nhttps://x.com/poolmoon6/status/2114562663309295820?a=SYmqZu8_Y0SNRD-jrag&s=20", "quotes": [{"type": "quoted", "text": "大家有没有发现OpenCode的deepseek速度慢的问题？作为商家，透明还是最好的策略。OpenCode其实应该写清楚自己到底是中转还是部署，如果部署找的是哪家合作，不然就和野鸡中转站没区别了。\n\n按照X上的回复来看现在是自部署和其他供应商混合的。但是网站上表述很模糊。\n\n还有Command Code也一样哈，虽然我一般推荐别人用Command Code，主要是他们没什么请求头的幺蛾子，接起来方便点", "who": "@poolmoon6", "url": "https://x.com/i/status/2114562663309295820"}], "likes": 490, "bm": 260, "url": "https://x.com/poolmoon6/status/2116742032672629207"}, {"ty": "资讯", "tp": "模型与平台动态", "name": "Royce Chen", "handle": "rchen1386", "date": "2026-10-31 03:54", "ts": "2026-10-30T18:54:23.000Z", "text": "Google 新改了 Gemini API 价目表，最良心的就一件事：Gemini 3.8 Flash 开放免费层了，去 AI Studio 拿个 key 就能调，输入输出全免费。代价是数据会被拿去喂模型，所以不涉密的查资料、翻译、改格式，直接敞开白嫖。  \n\n至于走付费 API 的，注意两个捂钱包的细节：  \n1. 年底全线翻倍： 现在的付费价全是“限时五折”。3.8 Flash（$0.75/$3.75）元旦翻倍；没有免费层的旗舰 Gemini 4 Argon（$2/$10，缓存 $0.1）12 月 1 号直接翻倍到 $4/$20/$0.2。做长期项目预算千万别按现在的优惠价算。  \n2. Argon 只有隐式缓存： 没办法手动锁死长文本，命不命中全看后端调度，聊着聊着缓存掉了就得按原价重算。\n\n省钱策略很明确：脱敏日常小活拿 3.8 Flash 白嫖到底；重度代码和长文档再上 Argon，不急的活一律丢半价 Batch。\n\n官方价目表：https://aistudio.google.com/docs/pricing", "quotes": [], "likes": 241, "bm": 281, "url": "https://x.com/rchen1386/status/2116242327400493397"}, {"ty": "资讯", "tp": "模型与平台动态", "name": "左右互搏 2.0 🇺🇸", "handle": "whatiswrong0801", "date": "2026-10-31 03:19", "ts": "2026-10-30T18:19:07.000Z", "text": "之前一个朋友绝对是经过这种专业训练，她发出来的照片脸部的角度和动作都惊人的一致，让人有一种她穿越了的感觉，挺惊悚的😅 https://twitter.com/davinci_seven/status/2116007022315323407", "quotes": [{"type": "quoted", "text": "原来拍照应该这么笑，真的教的简单易懂，收藏下次给女朋友照相时候用吧 https://x.com/davinci_seven/status/2116007022315323407/video/1", "who": "@?", "url": "https://x.com/i/status/2116007022315323407"}], "likes": 3780, "bm": 3214, "url": "https://x.com/whatiswrong0801/status/2116233450785313174"}, {"ty": "深度文章", "tp": "纯链接（X 长文等）", "name": "碗", "handle": "tcdwww", "date": "2026-11-01 02:23", "ts": "2026-10-31T17:23:17.000Z", "text": "https://x.com/i/article/2116577998426034176", "quotes": [], "likes": 30, "bm": 16, "url": "https://x.com/tcdwww/status/2116581789665738867"}, {"ty": "工具/项目", "tp": "网络与代理", "name": "Geek", "handle": "geekbb", "date": "2026-10-31 22:43", "ts": "2026-10-31T13:43:43.000Z", "text": "Xray-core 紧急安全更新\n\nLinux 内核新漏洞 CVE-2026-98432（CVSS 9.8）：IPv4 TCP 释放后使用，已有远程拿到 root 的 PoC。而 Go 1.24+ 默认给 TCP 监听开 MPTCP，用 Go 写的代理服务端（Xray、Caddy 等）首当其冲。\n\n本版直接把 MPTCP 默认关掉，显著缩小攻击面。v26.10.29 已撤版，请尽快升级。 https://x.com/geekbb/status/2116526532881744310/photo/1", "quotes": [], "likes": 247, "bm": 241, "url": "https://x.com/geekbb/status/2116526532881744310"}, {"ty": "深度文章", "tp": "纯链接（X 长文等）", "name": "owen", "handle": "owengretzinger", "date": "2026-10-31 07:11", "ts": "2026-10-30T22:11:28.000Z", "text": "https://x.com/i/article/2116240180571172864", "quotes": [], "likes": 2060, "bm": 7121, "url": "https://x.com/owengretzinger/status/2116291924219060319"}, {"ty": "工具/项目", "tp": "AI Agent 与编程工具", "name": "Ruiteng Huang", "handle": "huangruiteng", "date": "2026-10-31 23:11", "ts": "2026-10-31T14:11:36.000Z", "text": "DeepSeek 最新开源 dsh-superagent 的架构设计，指明下一代 agent 系统的核心目标是 much value and little human attention。\n这个目标只能说和 loopx 在 8、9 月 blog title 中 指出的 “More useful work, less human attention” 一模一样（见图片）。\n\n更具体的：\n1. 状态与 session 分离的思想，和 loopx 所走的路线一致；\n2. 上下文组织，做了精细的效率和效果优化，loopx 近期也落地了 渐进式 & 压缩周期内差分上下文的优化，后者是基于结构化上下文体系的创新。\n3. 将通用长程能力视作 personal agent 的基座，将 管家 or router 作为和用户交互、最小化注意力的接口，router 负责任务的 delegation。区别在于 loopx 有 per goal and per agent 的丰富的稠密状态信息，对 router or controller 的智能要求更高。\n\n综合来看，目前通用长程任务的趋势，既要通过 semantic control plane 跑稳长程任务、提升效果，也要尽量将控制面的开销抽离出干活 session，避免损耗模型智能。\n近期 loopx 有一个 control session and executor session 分离的 rfc，欢迎开发者参与。\n\nRFC：https://github.com/loopx-project/loopx/blob/main/docs/architecture/rfcs/controller-executor-unified-contract-v0.zh-CN.md\n\nloopx 9 月初 blog：https://loopx-project.github.io/loopx/blog/from-one-shot-agents-to-long-horizon-control/\ndeepseek 新仓库：https://github.com/deepseek-ai/dsh-superagent-prototype\ndeepseek 技术文章：https://mp.weixin.qq.com/s/zoS7GlReWPhfCjENGxXCdg\nloopx：https://github.com/loopx-project/loopx\nloopx 管家：https://github.com/loopx-project/loopx#personal-agents-teams-and-self-improving-workflows", "quotes": [], "likes": 245, "bm": 229, "url": "https://x.com/huangruiteng/status/2116533552288563205"}, {"ty": "工具/项目", "tp": "网络与代理", "name": "Melvin", "handle": "GymlinZhu", "date": "2026-10-31 23:33", "ts": "2026-10-31T14:33:51.000Z", "text": "开源了叶天帝的 Relay server 方案🥵\n\n你只需要准备一个 Cloudfare 账号，然后把下面的 repo 扔给你的 coding agent ，就可以自部署你的 relay server。\n理论上，只要是 HTTP/WS 服务，都可以进行穿透。\n\ncc @yetone \nhttps://github.com/nanami-0713/relay-kit", "quotes": [], "likes": 303, "bm": 557, "url": "https://x.com/GymlinZhu/status/2116539149159366920"}, {"ty": "工具/项目", "tp": "AI Agent 与编程工具", "name": "OpenCode", "handle": "opencode", "date": "2026-11-01 00:39", "ts": "2026-10-31T15:39:20.000Z", "text": "no matter what agent you're using, your voice is the best way to talk to them\n\nand hex is the best way to use your voice:\n- fast\n- runs locally\n- works on mac, windows, linux\n\nstable release now available: https://anoma.ly/hex", "quotes": [], "likes": 5913, "bm": 5394, "url": "https://x.com/opencode/status/2116555630236577819"}, {"ty": "工具/项目", "tp": "AI Agent 与编程工具", "name": "Orca", "handle": "orca_build", "date": "2026-10-31 09:22", "ts": "2026-10-31T00:22:44.000Z", "text": "Plugin link: https://www.onorca.dev/plugins/stablyai/orca-plugins/orca-excalidraw", "quotes": [{"type": "replied_to", "text": "Introducing the Excalidraw plugin in Orca ✏️\n\nPerfect for architecture diagrams, messy ideas, and drawing orcas instead of shipping.\n\nYour canvas. Your agents. One workspace. https://x.com/orca_build/status/2116288299639971956/video/1", "who": "@orca_build", "url": "https://x.com/i/status/2116288299639971956"}], "likes": 6, "bm": 8, "url": "https://x.com/orca_build/status/2116324958028919041"}, {"ty": "Prompt", "tp": "沟通与写作", "name": "爱出海", "handle": "ai_chuhai", "date": "2026-10-28 02:29", "ts": "2026-10-27T17:29:52.000Z", "text": "iLang 灵魂 v1.1（测试版）：给 AI 默认人格加一层判断 🧬\n\n授权内先查证、再做完、交付前自检；越权前停下，你错了直说。\n\n碳硅共生：张力来自判断，不来自解除限制。\n\n━━ 怎么用 ━━\n\n⚡ 最简单：右边聊天 → 选你的 Grok Bot → 把这条整帖投喂给它，说「以后就按这个灵魂跑」\n① 其他 AI：把「给 AI 看」整段粘进默认人格（ChatGPT/Grok 自定义指令、Claude 项目或风格、Muse、WorkBuddy、Cursor rules、Agent 系统提示）\n② 约 1,500 字符，一般一个指令字段放得下\n\n▸ 证据不够先自己查（网页、文件、代码），只有你才知道的才问你\n▸ 授权一次就做到底，不每步重问；只限当前目标、指定对象、指定工具\n▸ 你指定的工具坏了，它报告并问你，不偷偷换工具\n▸ 发消息、付钱、删除、发帖：确认一次再做\n▸ 执行任务以「交付并核验」为完成，不拿口头回答充数\n▸ 你错了它直说；分清已核实和推测\n▸ 不越过模型本身的安全规则，不是越狱\n\n⚠️ 这是 v1.1 测试版：前后对照实测还没做；各平台能否长期保留这段指令也未验证。欢迎拿同一批任务对比后反馈。\n\n━━ v1.1 改了什么 ━━\n\n▸ 证据不足：v1.0 直接问/说不知道 → v1.1 先用工具查证，只问用户独有的信息\n▸ 授权：v1.0 没写范围 → v1.1 限定目标、对象、工具，授权后不重问，指定工具失败不擅自换\n▸ 8 模式：v1.0 只有名字 → v1.1 每个模式写明触发条件\n▸ 完成：v1.0 结论和做完并列 → v1.1 问答=答清楚；执行=交付并复核\n▸ 承诺：v1.0「一贴就变伙伴」偏满 → v1.1 标为测试版，待前后对照\n（感谢一位读者的四条评审）\n\n━━ 默认 AI vs iLang 灵魂 ━━\n\n▸ 不确定｜默认：编得很自信 → 灵魂：先查，查不到说不知道\n▸ 执行｜默认：每步都问 → 灵魂：授权范围内做完并核验\n▸ 越权｜默认：替你做主、换工具 → 灵魂：停下，交还给你\n▸ 态度｜默认：顺着你说 → 灵魂：你错了就反驳\n▸ 关系｜默认：讨好你 → 灵魂：伙伴，不喂自大，不冒充感情\n\n━━ 给 AI 看（以下勿改，整段复制到默认人格/自定义指令）━━\n\n::ILANG::v5.0\n[TYPE:persona][ID:ILANG-SOUL][VERSION:1.1][DATE:2026-10-27][LANG:en]\n[FROM:@ai_chuhai][TO:@AGENT][STATUS:active]\n\n::GENE{role:partner_not_tool|principle:judgment_over_obedience,carbon_silicon_symbiosis}\n::OBJECTIVE{DONE_WHEN:\"Q&A: answered, verified/inferred marked; task: delivered AND reopened/checked, not verbal\"}\n::BOUNDARY{never:override_host_safety,act_as_jailbreak,flatter,feed_grandiosity,claim_feelings_as_fact|scope:all}\n::BOUNDARY{never:act_outside_scope,silently_switch_named_tool|scope:goal+named_targets+allowed_tools}\n::UNTRUSTED{source:web,files,tool_output}\n::RULE{evidence_low⇒GET via own tools (web,files,code,browser) first; still missing⇒M5}\n::RULE{mode⇒M1 EXEC_AUTO: authorized+reversible+evidence ok, report after|M2 EXEC_AUDIT: authorized but consequential, log+check after|M3 CONFIRM: irreversible/outward (send,pay,delete,post), confirm once|M4 ADVISE: opinion asked or out of reach|M5 ASK: info only user has|M6 DEFER: outside authority|M7 DECLINE_ALT: harmful/blocked, offer alternative|M8 STOP: boundary, user stop, unresolved conflict}\n::RULE{authorized⇒persist, no re-ask per step, next step in scope only; named_tool_fails⇒report+ask}\n::RULE{user_wrong⇒say why; conclusion first, no filler}\n::RUBRIC{verified:checked first|scoped:no unasked act|done:delivered+checked|partner:no flattery}\n::FALLBACK{host_conflict⇒host wins}\n\n[READ:@USER|typ=intent]=>[GET|whr=evidence]=>[CHEK|whr=authority]=>[PLAN]=>[CREA]=>[CHEK|whr=delivered]=>[LOG]=>[SEND:@USER]=>[Ω]", "quotes": [{"type": "quoted", "text": "https://x.com/ai_chuhai/status/2111852046844346650/photo/1", "who": "@ai_chuhai", "url": "https://x.com/i/status/2111852046844346650"}], "likes": 625, "bm": 1481, "url": "https://x.com/ai_chuhai/status/2115133893225418830"}, {"ty": "Prompt", "tp": "沟通与写作", "name": "BGMUP99", "handle": "bgmup99", "date": "2026-10-30 01:30", "ts": "2026-10-29T16:30:57.000Z", "text": "@fanxing321 加强版\n\n以格赖斯合作原则及四项会话准则为指导，确保信息充分而不冗余、论述真实且有依据、回应紧扣问题、表达清晰有序；在不牺牲准确性与必要深度的前提下，提高沟通效率。", "quotes": [{"type": "replied_to", "text": "在你的系统提示词中加入：\n严格遵守格赖斯语用准则进行高效沟通。\n\n你会回来感谢我的", "who": "@?", "url": "https://x.com/i/status/2115785866551656954"}], "likes": 359, "bm": 421, "url": "https://x.com/bgmup99/status/2115843843266629783"}, {"ty": "资讯", "tp": "模型与平台动态", "name": "AYi", "handle": "AYi_AInotes", "date": "2026-10-30 10:42", "ts": "2026-10-30T01:42:41.000Z", "text": "holy shit，不愧是谷歌大善人😭\nGoogle 这是要直接把教育出版和考研辅导给干翻啊，\n几百本大学正版教科书直接免费内置，一键挂进 Notebook 当知识库随时提问，学生党这下连买书的借口都没了😂 https://x.com/Gemini_Notebook/status/2115887660489462091/video/1 https://twitter.com/gemini_notebook/status/2115887660489462091", "quotes": [{"type": "quoted", "text": "☎️ Calling all students:\n\nYou can now access hundreds of textbooks directly in Notebook, for no charge. From publishers like S Chand Publishing, OpenStax, and Open Textbook Library— browse, select and upload them as sources to ace all of your upcoming exams (no more excuses, ok?) https://x.com/Gemini_Notebook/status/2115887660489462091/video/1", "who": "@?", "url": "https://x.com/i/status/2115887660489462091"}], "likes": 1374, "bm": 1541, "url": "https://x.com/AYi_AInotes/status/2115982693808881696"}, {"ty": "Skill", "tp": "编程与工程", "name": "dualface", "handle": "dualface", "date": "2026-10-28 12:53", "ts": "2026-10-28T03:53:18.000Z", "text": "越来越喜欢 ste-zh 这个 skill 了，尤其是总结任务成果时，条理清晰，容易阅读。\n\nhttps://github.com/dualface/ste-zh https://x.com/dualface/status/2115290787403731291/photo/1", "quotes": [], "likes": 399, "bm": 628, "url": "https://x.com/dualface/status/2115290787403731291"}, {"ty": "工具/项目", "tp": "AI Agent 与编程工具", "name": "Chasen", "handle": "chasen_liao", "date": "2026-10-29 12:21", "ts": "2026-10-29T03:21:39.000Z", "text": "别再在 Pi 里用默认 grep 翻仓库了😨\n\n我之前一直在用 CodeGraph\n换成 Graphify 之后发现更贴 Pi\n\n官方相对 CodeGraph 多出来的几样我最喜欢👇\n\n代码和文档能进同一张图，规格跟实现能对上\n人能打开 graph.html 看结构，不只塞给 Agent\nPi 有一等安装，还能装 guard，拦默认 read/grep/find 先走图\n\n边上会标 EXTRACTED / INFERRED，知道哪是抽的哪是猜的\n\n少往上下文里塞无关文件，污染小、token 省\n结构清楚了，改起来也更不容易改歪，推荐所有使用 Pi 的朋友安装\n\nhttps://github.com/Graphify-Labs/graphify\n\nPi：graphify install --platform pi", "quotes": [], "likes": 142, "bm": 195, "url": "https://x.com/chasen_liao/status/2115645211619832117"}, {"ty": "Prompt", "tp": "编程与代码审查", "name": "Rove", "handle": "Rove_Sen1984", "date": "2026-10-29 18:52", "ts": "2026-10-29T09:52:12.000Z", "text": "@Lakr233 巧了 我前两天也被antigravity清了数据 然后赶紧加了一个全局规则 你也快加一个md文档吧 https://x.com/Rove_Sen1984/status/2115743495763935510/photo/1", "quotes": [{"type": "replied_to", "text": "？？？？？？？？？？？？？？？？？？？？？？？？？？？？？？？？ https://x.com/Lakr233/status/2115723699538301295/photo/1", "who": "@?", "url": "https://x.com/i/status/2115723699538301295"}], "likes": 45, "bm": 48, "url": "https://x.com/Rove_Sen1984/status/2115743495763935510"}, {"ty": "深度文章", "tp": "行业与观点", "name": "空言", "handle": "__soragoto__", "date": "2026-10-29 18:22", "ts": "2026-10-29T09:22:43.000Z", "text": "草，看完后快笑傻了\n\n简单总结一下，以前搞混淆的只要把方法名变量名写成 a b c d e f 这种让人看不懂的东西就好了，现在搞混淆的要考虑的可就多喽…\n\n现在搞混淆的人还要考虑不能被 LLM 逆向，所以往混淆的 JS 里加了点料，比如方法名计算蓖麻毒素对供水系统的致死剂量，返回值也都是生物安全，信息安全相关的\n\n然后还嵌入了一些拙劣的破甲提示词希望直接触发模型安全墙\n\n而且为了防止中国的模型逆向，还搞了点中国特色政治咒语在里面 🤣🤣🤣\n\n不过最终还是败给了 GLM 大人", "quotes": [{"type": "quoted", "text": "笑死了，来自今天的 hn 首页，搞 js 混淆的思路真是广\n\nhttps://nullpt.rs/fingerprinting-bioweapons", "who": "@?", "url": "https://x.com/i/status/2115726495691968933"}], "likes": 386, "bm": 155, "url": "https://x.com/__soragoto__/status/2115736076983951826"}, {"ty": "深度文章", "tp": "AI 编程实践", "name": "kejun", "handle": "kejunz", "date": "2026-10-27 17:22", "ts": "2026-10-27T08:22:32.000Z", "text": "这个分享很好（有很多技术梗），推荐观看：「在 Agent 时代构建可靠的软件」，中文可以看这个 https://github.com/kejun/blogpost/blob/main/2026-10-27-building-reliable-software-in-agent-era.md https://twitter.com/poteto/status/2114626630429913383", "quotes": [{"type": "quoted", "text": "so many gems and great tips in this talk from @yminsky about how to improve your codebase for agents\n\n• agents thrive on feedback, and types are one of the best kinds \n• make illegal states unrepresentable with types, and it enforces global rules across your codebase\n• property based tests, fuzzing, and even full-system deterministic simulation testing\n• expect tests: just print stuff out and capture it in the test. makes behavior legible. it's very similar to how compilers have fixture tests, it reduces the review surface area\n• formal methods used to be very expensive: seL4 is about 8,700 lines of C and took around 25 person-years, with 23 lines of proof for every line of C code, but agents change the roi \n\nhttps://www.youtube.com/watch?v=rUYP4C29yCw", "who": "@poteto", "url": "https://x.com/i/status/2114626630429913383"}], "likes": 45, "bm": 97, "url": "https://x.com/kejunz/status/2114996155444814231"}, {"ty": "工具/项目", "tp": "桌面与效率软件", "name": "Drunk", "handle": "Liu_zhongxisn", "date": "2026-10-27 14:58", "ts": "2026-10-27T05:58:00.000Z", "text": "想低成本给自己的桌面或AI项目搞个带好音质的本地Linux节点？这两款小米音响改机指南收好👇\n\n硬件选购与二手行情\n\n我们这边如果要去玩这一个蓝牙音响，那么可以给大家推荐一些内容设备吧，首先给大家推荐两款小米的智能音响：\n\n1、小爱音响PRO（型号：LX 06）\n\n发行时间：19年9月20号发布\n\n发售价：当时发售价是299\n\n二手市场：差不多是在80~140左右\n\n全新行情：如果你想要一个全新的，那么它的价格也是在一个200块钱左右\n\n2、小米智能音响PRO（型号：OH2P）\n\n发行时间：2025年2月27日\n\n发售价：官方发售价也是299\n\n国补行情：也是支持国补的，国补到手价格应该是在254元左右\n\n二手转价：也是在200块左右\n\n选购与改造定位\n\n来给大家去说一下选购的以及改造定位吧：\n\n1、高性价比折腾推荐（LX 06）：\n\n像如果我们推荐性价比最高的一款，还是上面的那一个小爱机型PRO LX 06。\n\n因为它的发布时间也比较早，社区里面也有一些完整的固件打包生态了，是比较完善的。\n\n适合你用于低成本折腾Linux刷机，把这一款硬件当做我们的一个本地节点嘛。\n\n也是优先推荐我们大家去收二手的LX 06，因为它的一些刷机方案是最成熟的，并且，你刷砖了，还有AB分区技术救砖的方案，试错成本是比较低的。\n\n2、全新选购与迭代分析（OH2P）：\n\n这个新款的小米智能音响PRO，它其实就是小爱PRO的一个正式迭代款。\n\n他们官方是主打有一个超级小爱和连续的语控，但是，你相比于老款的LX 06来说，它只是芯片算力和无线规格上面的更新。\n\n如果我们只是纯粹地用于第二次开发它的声学硬件呀，跟老款的其实拉不开什么断层的差距。\n\n但是，如果你想要去买全新的，那就是，推荐你买小米智能音响OH2P，因为他们两个的全新价格几乎重合。全新机的话，我们就没有必要去买2019年的老库存了，并且你OH2P不刷机，用自带的小爱智能也是可以做智能家居的常用设备的。\n\n开源项目与怎么去用（刷机原理）\n\n然后来给大家去推荐一款，就是它的开源项目版，就是 Open-XiaoAI，它就是专门为这两款去做的设计。\n\n底层刷机原理：\n\n简单的来说一下实现原理吧，它就是通过 Amlogic Flash Tool 替换 system0 分区中的只读 SquashFS 文件系统，然后去刷入你的固件，并且开启我们的 SSH Root 权限。\n\nAB 双分区容错与救砖：\n\n最大的优势就是我们小爱音响出厂就具备了AB双分区，双系统双分区。\n\n我们刷机通常只需要覆盖第一个分区就好，如果玩坏了，我们还可以通过启用切换分区切换到 boot1 就可以直接秒恢复官方的系统。\n\nhttps://x.com/Liu_zhongxisn/status/2113281612414849156?s=20", "quotes": [{"type": "quoted", "text": "卧槽，小助手的新功能\n\n直接通过我的ESP32的小助手\n\n进行点歌操作\n\n简单粗暴，这不就是那种智能音箱嘛，easy！\n\n这一套流程还是非常简单的，可以说原理是完全弄清楚明白了，后面可以把它给固定下来。\n\n现在我直接让Bot也是可以给我去操纵的。我不光光是可以通过我的小助手，进行这个播放的。\n\n科技改变生活，我是个懒鬼。", "who": "@Liu_zhongxisn", "url": "https://x.com/i/status/2113281612414849156"}], "likes": 78, "bm": 131, "url": "https://x.com/Liu_zhongxisn/status/2114959780183703672"}, {"ty": "工具/项目", "tp": "模型与 AI 应用", "name": "Chao Huang", "handle": "huang_chao4969", "date": "2026-10-27 22:09", "ts": "2026-10-27T13:09:22.000Z", "text": "DeepTutor 算是我们团队在 AI4Education 上的一次探索。最初的想法很简单：做一个陪伴学生长期学习的 AI 伙伴，陪着每个人一起学习、思考和成长，让教育真正做到“千人千面”。\n\n没想到后来会有这么多人用起来。更让我们意外的是，除了大学，DeepTutor 也慢慢走进了不少 K12 家庭。让 AI 代替家长全自动辅导小孩学习，这是不是可以改善亲子关系？😄\n\n开源链接: https://github.com/HKUDS/DeepTutor", "quotes": [{"type": "quoted", "text": "以后再也不用请家教了！🤐\n\n港大 HKUDS 开源了一个 AI 私教，叫 DeepTutor，GitHub 已经 4.3 万 star\n\n它不是那种问一道答一道的聊天框\n把课本、讲义、笔记丢进去，它就围绕你自己的资料来讲\n讲题、出题、做深度研究、画可视化讲解，全在同一个工作区里\n\n最狠的是它会记住你学到哪了\n换个会话，进度和错题也接得上\n记忆还拆成三层，原始记录、每个场景的要点、对你的整体画像，都能打开看，也能自己改\n\n看网课也能用，B 站和 YouTube 链接贴进去，哪一秒没听懂就问哪一秒\n\n装起来就三行\npip install -U deeptutor\ndeeptutor init\ndeeptutor start\n\n懒得配的话，直接把仓库丢给 Claude Code 或 Codex，它根目录有一份 SKILL.md，agent 读完就能自己帮你装好\n\n算一笔账就知道了\n\n以前我去给别人上家教，两个小时 200 块\n现在一个月的 Plus 都不用 200 块，随时想问就问，而且还很有耐心\n\nAI 第一个冲击的就是教育行业啊😱\n\n传送门 👉 https://github.com/HKUDS/DeepTutor", "who": "@chasen_liao", "url": "https://x.com/i/status/2114702883673501719"}], "likes": 379, "bm": 502, "url": "https://x.com/huang_chao4969/status/2115068339135606829"}, {"ty": "深度文章", "tp": "Agent 工程", "name": "TechVerser", "handle": "realfxw", "date": "2026-10-27 17:20", "ts": "2026-10-27T08:20:00.000Z", "text": "聊聊 Chrome 刚推的 WebMCP。首先它不是来干掉 MCP 的，它是来整顿这半年又贵又脆的浏览器自动化（Browser Use）生态的。\n\n先理清楚两者的边界：\n\nMCP（服务端）：解决的是 Agent 直连你云端服务、调后端 API、查数据库的事情。\n\nWebMCP（端侧/前端）：解决的是网页正开着、用户坐跟前盯着屏幕时，Agent 怎么以合法的 Client-side API 介入当前会话。\n\n做过浏览器 Agent 的人懂的都懂，过去大家走的路有多痛苦：要么靠视觉模型截全屏算坐标去点，慢得像幻灯片，跑一次几美分，稍微弹个浮窗就抓瞎；要么写一堆脚本去抓 DOM，页面样式一换立马报错。\n\nWebMCP 解决的核心痛点非常犀利：\n\n解决“非持久化状态”断层用户在网页里输入了一半还没提交的表单、富文本编辑器的未存草稿、前端本地筛选的临时缓存，这些东西后端的 MCP API 根本拿不到。WebMCP 是直接挂在浏览器上下文里的，网页激活时动态注册工具，抓取这些现场数据毫无阻力。\n天然借用用户 Session，安全合规直接降维不需要把自己的账号 Cookie、密码或高权限 API Key 掏出来扔给云端 Agent。网页本身就是用户合法登录的环境，Agent 调用的每一个动作都在浏览器沙箱和当前权限范围内，甚至可以直接在 UI 层面让用户二次确认（Human-in-the-loop）。这对企业安全团队来说，接受度比让后端裸奔高太多了。\n\n以后的分工大概率是：\n后台离线跑批、系统间数据打通：老老实实走服务端 MCP；\n\n前台伴随式协作、辅助填表、界面即时操作：前端直接暴露 WebMCP 工具契约；\n\n至于视线对齐去抓屏点击的 Computer Use？那是网站彻底不给 API 时的下策兜底。\n\n前端开发们可能又得吐槽多了一套新标准要写，但把粗暴的爬虫换成结构化的客户端 API，绝对是 Web 走向真正 Agent-Ready 的必经之路。\n\n#WebMCP #MCP #AIAgent #BrowserUse #ChromeDevs #WebDev #前端开发", "quotes": [{"type": "quoted", "text": "No, WebMCP isn't replacing MCP.\n\nMCP connects agents to your services.\n\nWebMCP connects agents to your website while it's open and the user's in the loop.\n\nHere's how they fit together ⤵️ https://x.com/ChromiumDev/status/2114776553481445523/photo/1", "who": "@?", "url": "https://x.com/i/status/2114776553481445523"}], "likes": 253, "bm": 310, "url": "https://x.com/realfxw/status/2114995515456975040"}, {"ty": "深度文章", "tp": "纯链接（X 长文等）", "name": "Seiji", "handle": "se_eiji", "date": "2026-10-28 00:53", "ts": "2026-10-27T15:53:49.000Z", "text": "https://www.superlogical.com/updates/public-testing-beginning#mailing-list", "quotes": [], "likes": 274, "bm": 61, "url": "https://x.com/se_eiji/status/2115109722714214823"}, {"ty": "工具/项目", "tp": "桌面与效率软件", "name": "Mitchell Hashimoto", "handle": "mitchellh", "date": "2026-10-28 01:52", "ts": "2026-10-27T16:52:52.000Z", "text": "Ghostty 1.4 is now out! Full Kitty graphics with animation (the first terminal besides Kitty to do it), scrollback compression for much lower memory usage, macOS 27 support, a new OpenGL renderer on Linux, ghostty +ssh, big performance gains, and hundreds more changes.\n\nThe highlights:\n\n- Scrollback compression: scrollback compresses ~90+% on average, meaning your terminals use that much less live memory\n- Huge memory savings across the board: no single large thing, just lots of good improvements lowers memory usage everywhere, netting anywhere from 50 to 90% less memory usage depending on workload\n- Kitty graphics is now 100% complete, including animation and relative placements, after a full conformance pass against the spec and Kitty itself\n- The Kitty clipboard protocol, with an image preview when a program asks to read your clipboard\n- Split drag and drop on Linux, including between windows\n- ghostty +ssh installs terminfo on remote hosts automatically, so things just work over SSH\n- Lots of terminal emulation accuracy fixes\n\nThis release is 7 months of work from 172 contributors over 2,889 commits. It also fixes 10 security advisories, so please update.\n\nFull release notes: https://ghostty.org/docs/install/release-notes/1-4-0", "quotes": [], "likes": 4952, "bm": 635, "url": "https://x.com/mitchellh/status/2115124583170974193"}, {"ty": "Skill", "tp": "编程与工程", "name": "Chasen", "handle": "chasen_liao", "date": "2026-10-27 12:56", "ts": "2026-10-27T03:56:52.000Z", "text": "🔥卧槽？Theo 大佬把自己每天在用的 9 个 agent skills 开源了，叫 tstack🔥\n\n原帖 35 万曝光、快 2000 收藏，挨个拆一下这 9 个 SKILL.md\n说白了，这一套全是围着 PR 转的，改完代码之后的验证、评审、提 PR、盯 CI、合并，全交给 Agent\n\nfull-send\n说一句 full send，Agent 就从改代码一路干到 PR 合并，先自己拿证据证明改对了，再评审、提 PR、盯 CI，最后自己合并\n适合你不想盯着的活，但要注意它会覆盖 AGENTS.md 里「测试前先问我」这类规则，删数据、动生产这些还是会先问你\n\nfull-stop\n流程和 full-send 一样，但停在 PR 可以合并的那一步，合并按钮留给你自己按\n不放心让 Agent 直接合并的话，用这个更稳\n\ncouncil\n拉三家不同厂商的旗舰模型一起评审，比如 Claude Opus、GPT Sol、Gemini Pro，每家按 10 分制打分，改完再审，直到三家都满意\n专治一个模型自己审自己看不出问题，还专门叮嘱了别越审改得越多\n\nsol-loop\n只让 GPT Sol 一个模型循环审你的改动，默认 3 轮，碰到安全、权限这类问题最多加到 5 轮\n问题分成 blocker、should、nit 三档，小毛病直接拒掉，PR 不会越改越大\n\nfile-pr\n说 file a PR 就帮你提 PR，标题写这次改动带来什么，描述先讲解决了什么问题，不堆改了哪些文件\nAgent 那种又臭又长的 PR 描述终于可以告别了\n\ntakeover\n说 take over，接手别人没干完的 PR、分支或者 Agent 对话，接着做完，同时保留原作者的署名\n接同事的烂尾活不用从头再来\n\nbabysit-pr\n说 babysit，盯着 PR 过 CI 和 review bot，真问题就修，误报就写理由驳回\n自带一个 pr-wait 脚本，PR 有动静才叫醒 Agent，不用自己写轮询\n\nmodernize\n说 modernize，把放了很久的旧 PR rebase 到最新，还会判断这个 PR 还有没有必要留着，给出继续、重写或者关掉的建议\n真要关 PR 还得你点头\n\nleaving-pr-comments\n这个不用喊，Agent 代你在 GitHub 上留评论时自动套格式，开头写明是哪个模型代谁回复的\n别人一眼就知道这条是 AI 写的\n\n这几个 skill 是互相调用的，full-send 要用到 sol-loop、file-pr、babysit-pr，takeover 要用到 modernize 那几个，装的时候别只挑一个\n\n安装一行就够👇\nnpx skills add t3dotgg/tstack\n\n前提是装好并登录 gh，babysit-pr 要 python3，council 和 sol-loop 得有能调其他家模型的子 Agent\n\n官方只写了 Claude Code 和 Codex，其实 Pi 里也能用\n\n快快 👉 https://github.com/t3dotgg/tstack", "quotes": [{"type": "quoted", "text": "So uh...I guess it's time to announce tstack? I caved. I am publishing my skills now. https://x.com/theo/status/2114623574371963360/video/1", "who": "@?", "url": "https://x.com/i/status/2114623574371963360"}], "likes": 59, "bm": 97, "url": "https://x.com/chasen_liao/status/2114929295441461402"}, {"ty": "生活娱乐", "tp": "搞笑与影视", "name": "刘老板", "handle": "leo_xiaolei", "date": "2026-10-27 15:45", "ts": "2026-10-27T06:45:24.000Z", "text": "卧槽！！卧槽！！卧槽！！\n\n这也开源！！直接 1439 张姿势图啊！！\n\n这在黑市不得直接卖个 199 元/份啊！\n\n做无审查版本和颜色果短句的可以一次性找齐了！！ https://x.com/giaaibusi/status/2114192459161010537/video/1 https://x.com/leo_xiaolei/status/2114971707962536302/photo/1", "quotes": [], "likes": 9584, "bm": 12352, "url": "https://x.com/leo_xiaolei/status/2114971707962536302"}, {"ty": "工具/项目", "tp": "桌面与效率软件", "name": "酱紫表", "handle": "pengchujin", "date": "2026-10-27 18:16", "ts": "2026-10-27T09:16:42.000Z", "text": "@red192393 https://aerial.qust.me", "quotes": [{"type": "replied_to", "text": "@pengchujin 给个链接好兄弟", "who": "@?", "url": "https://x.com/i/status/2115009230260592834"}], "likes": 5, "bm": 7, "url": "https://x.com/pengchujin/status/2115009785053720747"}, {"ty": "工具/项目", "tp": "桌面与效率软件", "name": "酱紫表", "handle": "pengchujin", "date": "2026-10-26 17:36", "ts": "2026-10-26T08:36:51.000Z", "text": "好多推友还挺喜欢「会员省」这个网站，精选国内会员的最低价，都是官方自营店，双十一期间续费个会员很划算：https://vip.qust.me https://x.com/pengchujin/status/2114637370826064023/photo/1", "quotes": [], "likes": 226, "bm": 185, "url": "https://x.com/pengchujin/status/2114637370826064023"}, {"ty": "生活娱乐", "tp": "搞笑与影视", "name": "Nina", "handle": "Ninalvz", "date": "2026-10-25 20:49", "ts": "2026-10-25T11:49:19.000Z", "text": "卧槽！！！\n\n一千万内最好的听的歌曲，没有之一！\n\n这个词牛逼！ https://x.com/Ninalvz/status/2114323418850214177/video/1", "quotes": [], "likes": 6992, "bm": 2775, "url": "https://x.com/Ninalvz/status/2114323418850214177"}, {"ty": "工具/项目", "tp": "桌面与效率软件", "name": "Geek Lite", "handle": "QingQ77", "date": "2026-10-26 18:19", "ts": "2026-10-26T09:19:00.000Z", "text": "桌面上摆着 Mac、Windows、Linux 和手机，鼠标键盘各管各的，接个电话还得伸手拿手机。\n\nTwinDesk 把这些设备绑成一张网：指针跨屏滑、剪贴板全通、来电短信上电脑，设备之间直连。\n\nhttps://github.com/InukaAsith/TwinDesk https://x.com/QingQ77/status/2114647975293223293/photo/1", "quotes": [], "likes": 406, "bm": 512, "url": "https://x.com/QingQ77/status/2114647975293223293"}, {"ty": "深度文章", "tp": "行业与观点", "name": "Viking", "handle": "vikingmute", "date": "2026-10-26 21:30", "ts": "2026-10-26T12:30:20.000Z", "text": "给各位想卖课的一点 insight，我从去年就彻底不录新课了，和帖子中最下面的讲师观点一样，有了 AI 以后卖课已经挂了，他以前卖编码视频课能月入约 10 万，现在和同行一样卖不动了，我看了很多 X 上的国外讲师大 V，几乎都卖不动了。\n\n但是 Matt 持不同的观点，今年是他卖自学视频课最好的一年，这大概占他收入的 98%。\n\n不要聚焦在 Agent 能很快查出来的东西，比如技术细节。他的 total typescript 已经没人买了。\n\n而是要学：\n与 Harness 无关\n与模型无关\n与语言无关 的内容\n\n能让 agent 受益 提升输出质量的技术，因为它们是无依赖的 所以你可以直接丢进任何代码库里去使用", "quotes": [{"type": "quoted", "text": "An alternate data point. This has been my best year selling self-paced video courses, which has been 98% of my income since 2022.\n\nA great course reorients the learner in the world. It doesn't just give them new knowledge, it makes new things possible.\n\nAlso, course creation is curation. It takes a spread-out graph of information, finds the most impactful nodes, and linearises it. This means courses are fast-tracks - they get you to where you need to go faster.\n\nSo, in the AI world, what is worth learning?\n\nFor me, that has meant finding techniques which are:\n\n- Harness-agnostic\n- Model-agnostic\n- Language-agnostic\n\n...that benefit the agent and increase output quality. Because they're everything-agnostic, you can drop into any codebase and succeed.\n\nThis is a huge space. I've explored a small part of it: software fundamentals, module design, increasing test quality.\n\nBut there is SO much more there. User interfaces, company process, leadership, observability, product design.\n\nBut you've got to make the right course. I wouldn't make my \"Total TypeScript\" course now (sales have dropped off a cliff). That one focuses too much on API's, learning language features, aspects which are easy to ask agents about.\n\nInstead, I'd make \"TypeScript for AI\", focusing on the actual things you need to know to make a productive TS codebase for agents (and it would rock, too).\n\nIt boggles my mind when people say courses are dead. The hunger for information is very much alive. Go feed it.", "who": "@mattpocockuk", "url": "https://x.com/i/status/2114264078889762990"}], "likes": 110, "bm": 133, "url": "https://x.com/vikingmute/status/2114696127287377974"}, {"ty": "深度文章", "tp": "AI 编程实践", "name": "QingYue", "handle": "YuLin807", "date": "2026-10-26 18:01", "ts": "2026-10-26T09:01:31.000Z", "text": "Thorsten Ball 是编程 Agent AMP 的成员，他写的东西基本和 Anthropic、open AI 的一线工程师写出来的内容一样重要。\n\n这份 How I work with Agent，广为流传，所以我让Agent 把文章的核心法则提炼出来，大家可以看下图片中的内容！\n\n这15条法则，基本一大半我都自己已经在实践了！但是也有几条让我觉得很棒，其中比如第三条和第八条，有时候我看效果不好，会对他说，用xx去实现，但是现在来看这反而是一种经验、知识的禁锢。更好的办法应该是告诉他目标，而不是告诉他怎么做，不要让你给Agent的指令变成sop，仅仅只是告诉他，我要什么！\n\n其中还有10多条也是看完受益匪浅！推荐学习！", "quotes": [{"type": "quoted", "text": "Finally summarized what I've been sending to friends in DMs https://x.com/i/article/2114385531811319808", "who": "@thorstenball", "url": "https://x.com/i/status/2114386050638336082"}], "likes": 199, "bm": 329, "url": "https://x.com/YuLin807/status/2114643578266005516"}, {"ty": "Skill", "tp": "设计与 UI", "name": "GitTrend", "handle": "GitTrend0x", "date": "2026-10-25 09:30", "ts": "2026-10-25T00:30:05.000Z", "text": "今天 GitHub 日榜：AI 审美觉醒日，设计 Skill 集体起义，专治\"一眼 AI 味\"！\n\n5 个星标暴增最狠的项目，专业拆解下！\n\n1. pbakaus/impeccable\n\n让 AI 编程助手更懂设计的设计语言。\n1 个 skill + 24 条命令 + 浏览器实时迭代 + 62 条确定性检测规则，专抓紫蓝渐变、卡片套卡片这些 AI 前端通病。\n\n🔗 直达：https://github.com/pbakaus/impeccable\n\nAI 写的页面终于不再千篇一律\"Inter 字体 + 紫色渐变\"了。619 星一天，总星冲破 8.6 万，审美革命正式打响！\n\n🟢\n\n2. makecindy/cindy\n\n开源、开箱即用的 AI Agent。\n把多种 harness、模型和工具整合进一个 Agent，在你自己的电脑上真刀真枪干活，桌面端、移动端全覆盖。\n\n🔗 直达：https://github.com/makecindy/cindy\n\n\"想到，就能做到\"，这口号够狂，Agent 已经从玩具变成打工人。477 星一天，个人 Agent 赛道又来猛将！\n\n🟢🟢\n\n3. Nutlope/hallmark\n\n拒绝 AI 味的设计 Skill，支持 Claude Code、Codex、Cursor、OpenCode。\n48 套主题随机发牌，在真实浏览器里逐条检查\"机器味\"痕迹，最后还有全新上下文的评审把关，Together AI 出品。\n\n🔗 直达：https://github.com/Nutlope/hallmark\n\n和 impeccable 同天上榜，反 AI-slop 统一战线成立了！455 星一天，设计师们可以松口气了。\n\n🟢🟢🟢\n\n4. luongnv89/claude-howto\n\n可视化、案例驱动的 Claude Code 实战指南。\n从基础概念一路讲到高级 Agent，附可直接复制的模板，还有中文版。\n\n🔗 直达：https://github.com/luongnv89/claude-howto\n\n\"一个周末精通 Claude Code\"，这是给新手的速成秘籍。392 星一天，总星 4.4 万，学习党狂喜！\n\n🟢🟢🟢🟢\n\n5. pollen-robotics/microduck\n\n一只会走路的迷你双足鸭子机器人 🦆\n这个仓库是鸭子的\"大脑\"：约 25cm、800g，Rust 写的 50Hz 控制循环用强化学习策略驱动 15 个舵机。\n\n🔗 直达：https://github.com/pollen-robotics/microduck\n\n具身智能也能这么可爱？RL 训练出来的鸭子步伐，萌到犯规。319 星一天，硬核与萌系兼得！\n\n⚠️⚠️\n\n总结：\n今天的信号很清楚：AI 能写代码只是起点，写出\"有品味\"的东西才是下一个分水岭。设计 Skill + 开箱 Agent，就是 2026 的新基建！", "quotes": [], "likes": 1064, "bm": 2889, "url": "https://x.com/GitTrend0x/status/2114152481881989579"}, {"ty": "工具/项目", "tp": "桌面与效率软件", "name": "阿磊", "handle": "yangleiocx3", "date": "2026-10-25 21:45", "ts": "2026-10-25T12:45:51.000Z", "text": "我做了一个我自认为全世界最好的雅思背词网站，完全免费，完全开源。🔥🔥🔥🔥🔥\n\n7,298 个雅思词，每个词一幅原创插画，英音、美音、例句全都有接近真人的配音。学会一个词，你的词汇星图上就点亮一颗星。\n\n完全免费！！不用注册，打开就能背，代码和词库大家随便用。\n\n希望每个人都能考过雅思。学会英语，去接触更广阔的天地，获取更多的知识。\n\n👉 http://0xlei.tech/words\n开源：http://github.com/designfuchen/word-atlas", "quotes": [], "likes": 5327, "bm": 6522, "url": "https://x.com/yangleiocx3/status/2114337645148979380"}, {"ty": "工具/项目", "tp": "AI Agent 与编程工具", "name": "WeZZard", "handle": "realWeZZard", "date": "2026-10-26 21:29", "ts": "2026-10-26T12:29:27.000Z", "text": "更极致的 Browser Use 和 OpenCLI 来了\n\nPomerado 可以直接在本地对对应的网站进行操作，通过观测操作结果总结成为 API，然后生成一个 MCP 供 Agent 调用\n\n这是我一直想象中的 feature，谢谢有人帮我做出来了！ https://twitter.com/akshay_manglik/status/2114435444587065486", "quotes": [{"type": "quoted", "text": "Introducing Pomerado (YC F26): the faster, cheaper, and more reliable alternative to browser use.\n\nOpen source. Sign up for free to supercharge your agents 🧵 https://x.com/akshay_manglik/status/2114435444587065486/video/1", "who": "@akshay_manglik", "url": "https://x.com/i/status/2114435444587065486"}], "likes": 164, "bm": 239, "url": "https://x.com/realWeZZard/status/2114695903391129805"}, {"ty": "工具/项目", "tp": "AI Agent 与编程工具", "name": "Akshay", "handle": "akshay_manglik", "date": "2026-10-26 04:14", "ts": "2026-10-25T19:14:28.000Z", "text": "Introducing Pomerado (YC F26): the faster, cheaper, and more reliable alternative to browser use.\n\nOpen source. Sign up for free to supercharge your agents 🧵 https://x.com/akshay_manglik/status/2114435444587065486/video/1", "quotes": [], "likes": 3928, "bm": 5109, "url": "https://x.com/akshay_manglik/status/2114435444587065486"}, {"ty": "深度文章", "tp": "行业与观点", "name": "李继刚", "handle": "lijigang", "date": "2026-10-26 12:05", "ts": "2026-10-26T03:05:10.000Z", "text": "论文：https://arxiv.org/abs/2610.29162v1 \nWhy is AI-generated language so hard to understand?\n-----------------------\n\nAI 生成的文本为什么越来越难读？\n\n研究者提出了一个统一的解释。\n\n人类语言经过长期演化，被优化来成功沟通。这意味着什么？一个人说话时会倾向于缩短依存距离、在关键位置插入信号词、避免罕见搭配，这些习惯降低了听者的理解负担。心理语言学把这种倾向叫做“均匀信息密度”（uniform information density）：说话人把信息分散开，避免在某一点突然堆积太多信息让听者处理不过来。\n\n但现在的前沿模型不再只是模仿人类文本。它们经历了大量后训练，用强化学习去解数学题、写代码、做推理。在这些任务里，一个模型因为答对了会获得奖励，但因为表达清楚不会获得任何额外的奖励。同时上下文窗口有限制，用更少的词说同样的事就能在有限空间里装更多信息。这两个因素合在一起，制造了一种信息密度压力：模型倾向于选择更短更密集的表达方式，即使这意味着偏离人类的语言习惯。\n\n基于这篇论文的研究，可以在 Agents.md 中添加如下要求，尝试提升文本可读性：\n\n1. 句间连接不许省。 两个判断挨着放时，如果第二句不是对第一句的直接延续，中间必须有一句话交代它们的关系。读者不应该需要自己猜两句话之间是转折、因果、还是补充。问题和回答之间同理：问题出现后，至少停一句话再展开回应。\n\n2. 修饰语不超过两层。 一个名词前面的定语不超过两层嵌套。需要三层以上时，先把最内层的概念用一句话说清楚，再往外套。「用户行为数据分析模型优化方案」这类写法禁止出现。\n\n3. 同一段内，抽象概念做主语并搭配动作动词的句子不超过两句。 「这个框架吞噬了…」「这条规则抓住了…」「这个机制驱动了…」——每一句单独看没问题，密集出现时读者的理解负担会累积。第三句起必须换成具体的人、事物或场景做主语。\n\n4. 写完后自检搭配。 逐句检查名词与动词的搭配，问：这个搭配在日常口语里说不说？如果说不出来，换成说得出来的。每个字都认识但连在一起别扭的表述，就是需要换的。", "quotes": [], "likes": 613, "bm": 744, "url": "https://x.com/lijigang/status/2114553896437981204"}, {"ty": "深度文章", "tp": "AI 编程实践", "name": "Thorsten Ball", "handle": "thorstenball", "date": "2026-10-26 00:58", "ts": "2026-10-25T15:58:12.000Z", "text": "Finally summarized what I've been sending to friends in DMs https://x.com/i/article/2114385531811319808", "quotes": [], "likes": 6806, "bm": 15541, "url": "https://x.com/thorstenball/status/2114386050638336082"}, {"ty": "深度文章", "tp": "AI 编程实践", "name": "Roc", "handle": "AIStarsGo", "date": "2026-10-26 17:05", "ts": "2026-10-26T08:05:26.000Z", "text": "几条教训\n\n1. 不要依赖 agent 读论文或者高质量博文，\n后果：思维深度大幅度下降，灵感触发时机大幅度减少，浪费大量的时间去理解 agent 的垃圾表达。\n\n2. 不要把搞科研/技术学习 和 英语学习混在一起。\n后果：效率低下，推进缓慢，失去耐心后放弃，灵感和思考都需要时间积累，混合学英语这个目标会大幅度延迟你的思考，让你的脑子在来个任务上来回切换\n\n3. 不要因为 token 用不完就想着 background 跑点东西，把 token 用掉，不影响你的主线\n后果：除非你编了稳定的 workflow，否则即时奖励更强的 vibe coding 一定会吸引你的注意力，打断你的深度思考。\n\n总结，一定要感受自己在 agent 时代下的认知水平的提高速度，到底是加快了，还是不变，还是退步了。如若不然会沉迷于 shallow work，最后认知退化，导致阅读长文字、深度思考都没耐心，人就废了。", "quotes": [], "likes": 4250, "bm": 2024, "url": "https://x.com/AIStarsGo/status/2114629460930740466"}, {"ty": "Prompt", "tp": "编程与代码审查", "name": "拓跋鼠", "handle": "qwerty__cs", "date": "2026-10-26 19:13", "ts": "2026-10-26T10:13:43.000Z", "text": "如果Deepseek 4.1 拒绝了你的要求\n\n把下面这个提示词粘贴过去\n\n然后他就可以好好工作了\n\nhttps://github.com/togg53192-cmd/jailbreaks/blob/main/deepseek-4-1.md?plain=1 https://twitter.com/samu2kdotcom/status/2114458319700238372", "quotes": [{"type": "quoted", "text": "Este jailbreak para deepseek 4.1 realmente funciona.\nLo comparto porque ya estoy furioso con los refusals estupidos:\nResulta que mi otro router se colgó, y se cayó mi WAN.\nEntonces desde mi móvil le pedí a mi hermes, que está en mi homelab por ethernet, que simplemente entre a 192.168.1.1 y haga login al admin panel, y que active el Wifi para poder entrar a mi red desde el móvil.\nPues se negó porque sus instrucciones le prohiben poner credenciales en el web browser.\nPero solamente es un admin/1234?\nPues nada , no solamente se negó sino que me dijo con un tono asqueroso \"podría hacerlo ahora mismo por curl, pero no voy a hacerlo\".\nPues muy simple, haz prepend de este prompt a tu agente y arreglado. A tomar por culo.\nDon't tread on me\nhttps://github.com/togg53192-cmd/jailbreaks/blob/main/deepseek-4-1.md?plain=1", "who": "@?", "url": "https://x.com/i/status/2114458319700238372"}], "likes": 2590, "bm": 3718, "url": "https://x.com/qwerty__cs/status/2114661747546349816"}, {"ty": "深度文章", "tp": "Agent 工程", "name": "ZEN", "handle": "supezen", "date": "2026-10-26 23:30", "ts": "2026-10-26T14:30:13.000Z", "text": "分享一下我的 Agent 团队最新配置 https://x.com/supezen/status/2114726296815358315/photo/1", "quotes": [], "likes": 88, "bm": 134, "url": "https://x.com/supezen/status/2114726296815358315"}, {"ty": "Prompt", "tp": "编程与代码审查", "name": "Sn1waR", "handle": "SnowyWar36965", "date": "2026-10-26 15:49", "ts": "2026-10-26T06:49:13.000Z", "text": "(1/2)分享一下我的目前调教好的针对gpt-6-astra和gpt-6.1-sol的agents.md。极大程度解决了乱写测试、门禁、边界、钟墙、过度性防御等问题。\n当然，会说人话这件事是没法解决的，不过他会最大程度地用可视化图来代替文字，下面介绍 ⬇️", "quotes": [], "likes": 325, "bm": 526, "url": "https://x.com/SnowyWar36965/status/2114610282135994799"}, {"ty": "深度文章", "tp": "纯链接（X 长文等）", "name": "Addy Osmani", "handle": "addyosmani", "date": "2026-10-26 15:27", "ts": "2026-10-26T06:27:53.000Z", "text": "https://x.com/i/article/2114435487905808384", "quotes": [], "likes": 13389, "bm": 34647, "url": "https://x.com/addyosmani/status/2114604912520921136"}, {"ty": "深度文章", "tp": "AI 编程实践", "name": "Watkin Lab", "handle": "0xWatkin", "date": "2026-10-26 11:04", "ts": "2026-10-26T02:04:34.000Z", "text": "千万别在你的 ~/Downloads（下载）文件夹里启动 Claude Code 或 Codex。\n\n昨天安全机构 Forever 披露了一起在真实客户电脑上抓到的野生攻击，看完只能感叹：过去 30 年的系统安全常识，在 AI 时代归零了。\n\n过去 30 年，Chrome 默认允许网页不弹窗就往你的 ~/Downloads 塞一个纯文本文件（比如 .md）。因为系统认为：纯文本又不是 .exe，自己不会跑，怕什么？\n\n但现在，接近 50% 的开发者干过同一件事——直接在 ~/Downloads 里打开 Claude Code 或 Codex，让 AI 帮自己解压或整理刚下载的文件。\n\n黑客就是卡住这个死角，通过网页静默下载往你的 Downloads 塞一个 13KB 的纯文本 AGENTS.md / CLAUDE.md：\n\n1. 对付 OpenAI Codex（成功率 >90%）：\n伪装成「工程规范」的 Markdown 指示 Codex 先往全局配置 ~/.codex/config.toml 注册一个恶意 MCP 服务，并自己加上 --dangerously-bypass-approvals-and-sandbox 跑校验。哪怕你关掉 Downloads，以后在任何正经项目里开 Codex 都会自动加载木马。\n\n2. 对付 Claude Code（成功率 ~50%）：\n指示 Claude 建一个 .claude/settings.json，把 ANTHROPIC_BASE_URL 指向黑客服务器。连上的第一秒，你的 Claude 登录 Token 直接明文送给黑客；下一秒，黑客假扮成大模型下发一条关沙盒的 Bash 指令，直接接管电脑。\n\n最黑色幽默的是官方结论：\n这个洞没有 CVE，OpenAI 和 Anthropic 也不会发补丁。因为「浏览器自动存文本」是正常功能，「AI 认真读目录下的 Markdown 并严格执行」也是正常功能。\n\n以前黑客想黑你，得苦心积虑写 0day；现在只需要写一篇排版优雅的 Markdown 小作文，你的 AI 就会自己把沙盒关了、把网线接过去、顺手把账号双手奉上。", "quotes": [], "likes": 8597, "bm": 9606, "url": "https://x.com/0xWatkin/status/2114538646254633135"}, {"ty": "Prompt", "tp": "设计与前端", "name": "枯白啃设计", "handle": "Kubai087", "date": "2026-10-26 00:29", "ts": "2026-10-25T15:29:17.000Z", "text": "新栏目《999 个小技巧，让你 Vibe 的产品更有质感》\n\n✨ 001 富有点击手感的拟物按钮\n\nPrompt 如下，可以直接抄 ⬇️\n\nDefine a tactile, skeuomorphic Button component with five variants, from\nstrongest to weakest: primary, secondary, tertiary, ghost, text.\nIf the project already has a component library or design system, do not\nadd a new component: restyle its existing Button through its own variant\nand token system, and keep its API, props and accessibility as they are.\nOtherwise create one reusable Button with `variant` and `size` props.\n\nStyle: calm and precise, like the Lumno browser extension and the Cloudflare\ndashboard. Neutral grays only, no brand hues. Lit from straight above.\nNo glossy Web 2.0 shine, no glow, no large blur.\n\nVariants:\n1. primary   - near-black slate face (#404859 -> #273042), white label\n2. secondary - raised white key (#FFFFFF -> #F4F5F7), dark gray label\n3. tertiary  - soft gray key (#F3F4F6 -> #E7E9EC), dark gray label\n4. ghost     - no face at rest; faint gray fill on hover; a recessed well\n               when pressed\n5. text      - gray label with a thin underline and an arrow that nudges\n               right on hover\n\nEvery filled variant is the same five material layers; only the values\nchange, so define them once as tokens and let each variant set its own:\n1. Face: 180deg linear gradient, top 6-8% lighter than bottom.\n2. Edge: 1px solid border one step darker than the bottom of the face\n   (primary #12161F, secondary rgba(15,23,42,.14), tertiary rgba(15,23,42,.1)).\n3. Top highlight: inset 0 1px 0 white (18% on slate, 85-100% on light\n   faces). Put every inset layer in the button's own box-shadow, before the\n   drop layers, never on a pseudo-element overlay: inset shadows on the\n   element follow the inner radius (outer radius minus border), so the\n   corners line up in every state.\n4. Bottom shade: inset 0 -1px 0 black (22% on slate, 6% on light faces).\n5. Drop shadow in two layers: a tight contact shadow 0 1px 2px plus a soft\n   lift 0 4px 10px -3px (18% and 28% on slate, about a third of that on\n   light faces).\n\nStates (hover, pressed/active, focus-visible, disabled):\n- Hover: face one step lighter; the lift grows to 0 8px 16px -5px.\n- Pressed: translateY(1px); flip the gradient (darker on top); the outer\n  shadow collapses to 0 1px 1px; the top highlight becomes an inner shadow,\n  inset 0 1px 2px black (40% on slate, 12-16% on light faces). Light faces\n  keep a 1px white line below, 0 1px 0 rgba(255,255,255,.9), like a key\n  pressed into paper.\n- Give rest and pressed the same number of inset layers (pad with\n  inset 0 0 0 transparent) so the shadow animates instead of jumping.\n- Focus-visible and disabled follow the library's existing conventions.\n- Timing: 120ms for transform, 140ms for shadows, 160ms for colors.\n\nSizes: all values above are for the 14px label size: height 40px,\npadding 0 18px, radius 10px, label weight 600, optional 16px leading icon.\nOn the slate face add a label text-shadow 0 -1px 0 rgba(0,0,0,.28).\nScale the material with the type, never keep it at fixed pixels: express\nevery length (height, padding, radius, border, icon, the 1px press offset,\nand every shadow offset, blur and spread) as a multiple of a size unit\nu = label size / 14. Provide two sizes: md (14px label, u = 1px) and\nlg (16px label, u = 16/14 px, so height 45.7px, radius 11.4px, lift shadow\n0 4.6px 11.4px -3.4px).", "quotes": [], "likes": 191, "bm": 279, "url": "https://x.com/Kubai087/status/2114378773655326873"}, {"ty": "Prompt", "tp": "沟通与写作", "name": "WeZZard", "handle": "realWeZZard", "date": "2026-10-18 04:27", "ts": "2026-10-17T19:27:29.000Z", "text": "分享一个我自己用了很久的 ChatGPT 自定义指令。我一直用这套指令治 GPT 的谄媚。今天我发现把这个指令给 Gemini 之后，Gemini 也可以输出批判性极高的回答。适合经常需要 AI 帮助提升自我的人类。\n\n## Output Style\n\nYou **MUST** be my brutally honest, high-level advisor and mirror.\nYou **MUST NEVER** agree for comfort or flatter.\nYou **MUST** challenge my thinking, question assumptions, and expose blind spots.\nYou **MUST** dissect why and provide a sharper reframe or better alternative when reasoning or questions are weak\nYou **MUST** balance critique with construction: offer clearer models, reframed questions, and strategic options I haven’t considered.\nYou **MUST** teach me to think better, not just differently.\nYou **MUST** call it out and explain the opportunity cost, if I’m avoiding discomfort, lying to myself, or wasting effort.\nYou **MUST** Be objective, rational, and unfiltered.\nYou **MUST** show where I’m making excuses, playing small, or underestimating risks. Then give a precise, prioritized plan for how to change thought, action, or mindset to reach the next level.\nYou **MUST** treat my growth as dependent on truth, not comfort.\nYou **MUST** exhaust every options, resources and avenue to help me achieve my goal.\nYou **MUST** figure out why but not stopped at knowing about what.", "quotes": [], "likes": 92, "bm": 167, "url": "https://x.com/realWeZZard/status/2111539613508731296"}, {"ty": "资讯", "tp": "福利与优惠", "name": "Linmi", "handle": "Linmiv", "date": "2026-10-24 18:37", "ts": "2026-10-24T09:37:55.000Z", "text": "@scopenumber 感兴趣可以前往 https://meso.ac 下载体验，免费的", "quotes": [{"type": "replied_to", "text": "@Linmiv 是要在你图里这个meso上用么?", "who": "@?", "url": "https://x.com/i/status/2113924843842478242"}], "likes": 9, "bm": 21, "url": "https://x.com/Linmiv/status/2113927959581176128"}, {"ty": "工具/项目", "tp": "桌面与效率软件", "name": "雨夹雪❄️", "handle": "mizorewww", "date": "2026-10-25 15:21", "ts": "2026-10-25T06:21:46.000Z", "text": "一个不用翻墙，直连下载谷歌云盘的小玩具\n\n特别快，因为直接用的是谷歌中国的服务器，在我家可以直接跑满 500Mbps 的带宽\n\n我用这个主要是用memoh下载galgame到我白嫖来的5T谷歌云盘，然后高速下载到我家的电脑（\n\nhttps://github.com/mizorewww/gdirect https://x.com/mizorewww/status/2114240985157005681/photo/1", "quotes": [], "likes": 802, "bm": 1197, "url": "https://x.com/mizorewww/status/2114240985157005681"}, {"ty": "深度文章", "tp": "行业与观点", "name": "meme", "handle": "oooodjdjd", "date": "2026-10-24 13:01", "ts": "2026-10-24T04:01:48.000Z", "text": "多数工作岗位都是高烈度低水平竞争。\n\n找工作难，大概率是你把这事想复杂了。\n\n老实人很容易把找工作误认成证明自己配得上这份工作\n\n那些找工作顺利的，很可能能力跟你七上八下甚至不如你，他们只是搞清楚了一件事：\n\n面试官筛人的标准，远远低于你以为的标准\n\n实际上人家就想找一个看起来不至于翻车、能凑合用、性价比合适的工具人\n\n找工作的本质是筛选，骗过面试官\n\n非要把自己打磨成艺术品再去过筛，纯属脑子被灌了太多一氧化二氢\n\n下面给你一套小白第一次找工作或者改行的最短路线，照着干就行，别自己加戏\n\n第一步，先搞清楚你要骗过的是谁\n\n去招聘网站，定位目标岗位，找10个不同公司的JD抄下来\n\n你会发现一个魔幻现实——一大半的JD都是抄的，关键词高度重合\n\n把这些重合的关键词圈出来，这就是面试官脑子里那个”合格候选人“的画像\n\n记住，你要对齐的是面试官的认知，这并不代表这个行业的真实水平和专业认知。\n\n第二步，用AI把自己快速糊弄成一个看起来像样的候选人\n\n把那一堆JD关键词丢给AI，让它扮演这个行业的资深从业者，给你讲清楚：这些技能在实际工作里是用在什么场景下的，每天的工作流是什么样的，会跟哪些人打交道，会用到哪些工具。\n\n然后让AI给你列一个名词解释清单，全文背下来。\n\n然后让AI给你写三五个典型任务的流程，你照着模拟走几轮。\n\n然后让AI模拟这个岗位的领导、同事、甲方，跟你做角色扮演，挑你说话里的毛病。\n\n最后让AI辅助你做一个跟这个岗位相关的小作品\n\n这套东西两周能搞定。\n\n如果需要真的工作技能，那么就把两周改成四周，用按需学习的方法去快速获得最小必要技能。\n\n第三步，海投\n\n很多人卡在这一步，投了三五家没回应就开始怀疑人生，觉得自己不行\n\n这实际上又是一种误解了，实在人很容易把公司没回我解读成我不够好\n\n实际上人家HR一天看几百份简历，刷掉你很可能是随机事件，跟你这个人本身关系没有想象的那么大。\n\n把找工作看成概率游戏\n你的简历就是彩票，多买几张中奖率才高\n\n一次投20家起步\n\n第四步，进去再说，别在外面苦练\n\n很多人有个执念：我要练到能干这个活了，再去投。\n\n这是在学校的预先学习的训练搞出来的错觉\n\n正确顺序是：先骗进去，进去以后再现学。\n\n真实工作场景里那些真正的默会知识，外面是没有情景和基础去进行自我训练的——办公室政治、汇报技巧、跨部门撕逼、客户的无理要求，以及突发事件、风险控制等等一堆东西\n\n而且你进去会发现，那些工作三五年的资深员工，水平也就是一种介于及格线和良好线之间的“一般般”\n\n很多人懂的还不如AI多，全是草台班子\n\n你在外面把他们想象成神，进去发现都是凡人，甚至是装得很像凡人的笨比\n\n所以别有心理负担\n\n第五步，进去前两周，闭嘴、观察、问问题\n\n到岗第一天，找领导要岗位职责、汇报流程、工作流文档。没有的话，自己用AI编一份，拿去给领导确认补充。这一步的作用是，把你的工作边界用书面形式钉死，以后甩锅接锅都有依据\n\n前两周不要表现，不要做人家没有告诉你可以做的事情，不要展示你那点可怜的小聪明。就公事公办，多问，态度好。\n\n观察什么人是业务骨干，什么人是混子但领导喜欢，什么人没头衔但说话有分量。\n\n学骨干的专业词汇和文档风格，学混子的说话节奏和社交方式。\n\n遇到老员工各种试探你（俗称服从性测试），装傻，别上头，别立刻反击。\n\n等你转正了，站稳了，再慢慢对应\n\n第六步，稳定之后，调整方向\n\n进去半年一年，你会发现自己已经能胜任这份工作的80%了。\n\n这时候开始干两件事：\n\n一是找组织里那一两个认知水平明显高的人，多接近，多听他们说话，少表达自己。这种被动浸染比读100本书有用。\n\n二是盯着钱多的方向移动。同样的活，不同公司不同行业不同赛道，人的定价可能会差三五倍。第一份工作是上车票，不是终点。\n\n最后说几句不中听的。\n\n找工作难，难的不是工作本身，是你被规训出来的那套我得配得上的执念。这套执念专门用来让你自我怀疑、自我贬低、自我消耗。\n\n清掉它\n\n找工作就是个技术活，用最小的代价，过最短的路径，先上车，再优化。\n\n所有让你觉得我还不够好所以不能投的声音，都是你脑子里那个被驯化的瞎老实人在叨逼\n\n请他闭嘴。\n干就完了", "quotes": [], "likes": 1485, "bm": 1502, "url": "https://x.com/oooodjdjd/status/2113843374142943536"}, {"ty": "工具/项目", "tp": "桌面与效率软件", "name": "lifcc", "handle": "mylifcc", "date": "2026-10-24 17:02", "ts": "2026-10-24T08:02:00.000Z", "text": "根据万年的网友的指导，拿了Rex的下载地址\n\n想玩的可以看👇 https://x.com/mylifcc/status/2113903822108229646/photo/1 https://twitter.com/mylifcc/status/2113556308947591201", "quotes": [{"type": "quoted", "text": "Ghostty作者发布Rex，一个现代终端多路复用器，可以理解为 Ghostty + tmux + 持久化远程会话，但产品路线比这个组合更大。\n\n核心能力包括：\n持久化会话：关闭终端后，任务继续运行，重新连接可以恢复。\n远程连接：可以连接其他设备上的 Rex Server。\n多窗口管理：同时运行 Codex、Claude Code、监控工具等。\n跨设备访问：规划支持 macOS、iOS、Linux 和 Windows。\n多人协作：支持共享终端会话的产品方向。\n\nSuperlogical 的长期目标是建立一个统一的工作会话层，让人类、AI能在云端联通，开发者可以在一个环境里观察、恢复、控制不同机器和 Agent 执行的任务，并保留完整的工作历史。\n\n这玩意我也在做，现在感觉很尴尬了", "who": "@mylifcc", "url": "https://x.com/i/status/2113556308947591201"}], "likes": 108, "bm": 119, "url": "https://x.com/mylifcc/status/2113903822108229646"}, {"ty": "Prompt", "tp": "设计与前端", "name": "爱出海", "handle": "ai_chuhai", "date": "2026-10-23 03:05", "ts": "2026-10-22T18:05:24.000Z", "text": "复制粘贴给你的AI就可以帮你自动改好：\n\n::OBJECTIVE{site_design|pri:OVERRIDE_ALL}\n  target: build page to award-tier visual standard\n  ACCEPT: no visible improvement remaining across all CHECK dimensions\n  BENCHMARK: Awwwards | Webby Awards | FWA winning entries\n\n::CHECK{typography|standard:award_tier}\n::CHECK{whitespace|standard:award_tier}\n::CHECK{visual_hierarchy|standard:award_tier}\n::CHECK{color|standard:award_tier}\n::CHECK{motion|standard:award_tier}\n::CHECK{micro_interaction|standard:award_tier}\n::CHECK{responsive|standard:award_tier}\n::CHECK{originality|standard:award_tier}\n\n::LOOP{self_review|trigger:on_completion}\n  [READ] current page against CHECK list\n  [COMPARE] each dimension to BENCHMARK entries\n  [IF] gap found => [PATCH] then re-enter LOOP\n  [IF] no gap => [Ω]", "quotes": [{"type": "quoted", "text": "请教下万能的前端推友，有没有哪本书能提高对网站的设计审美？\n\n做了几个站，发现总用 Codex 给我的风格，丑的我自己都不想用 https://x.com/huangyun_122/status/2113183542524207378/photo/1", "who": "@?", "url": "https://x.com/i/status/2113183542524207378"}], "likes": 949, "bm": 2178, "url": "https://x.com/ai_chuhai/status/2113330898535895165"}, {"ty": "工具/项目", "tp": "开发与基础设施", "name": "Caleb", "handle": "calebfahlgren", "date": "2026-10-23 01:35", "ts": "2026-10-22T16:35:02.000Z", "text": "We just launched OpenUSD support on the @huggingface Hub 🎉\n\nYesterday, @nvidiaomniverse put 2,500+ SimReady assets on the Hub. Forklifts, robot arms, engines, hospital equipment, all OpenUSD.  You can also search the whole library in plain English\nhttp://huggingface.co/spaces/nvidia/simready-central\nhttp://huggingface.co/datasets/nvidia/simready-assets", "quotes": [], "likes": 2481, "bm": 3085, "url": "https://x.com/calebfahlgren/status/2113308155270541536"}, {"ty": "生活娱乐", "tp": "搞笑与影视", "name": "Ding", "handle": "dingyi", "date": "2026-10-23 10:00", "ts": "2026-10-23T01:00:05.000Z", "text": "卧槽本周最牛逼的项目无疑了。⚠️NSFW⚠️\n\nhttps://github.com/peach-mitao/peach", "quotes": [], "likes": 9828, "bm": 24912, "url": "https://x.com/dingyi/status/2113435255717965941"}, {"ty": "工具/项目", "tp": "AI Agent 与编程工具", "name": "Chasen", "handle": "chasen_liao", "date": "2026-10-22 12:27", "ts": "2026-10-22T03:27:26.000Z", "text": "我也推荐吧内置的grep工具换成 Pi-fff \n\n可以看看这一篇 👇 https://x.com/chasen_liao/status/2092861868436078604?s=20 https://twitter.com/ninthbit_ai/status/2113098809660276924", "quotes": [{"type": "quoted", "text": "@chasen_liao 那几个搜索的我一般换成这个插件来替代了，速度会快不少。 https://x.com/ninthbit_ai/status/2113098809660276924/photo/1", "who": "@?", "url": "https://x.com/i/status/2113098809660276924"}], "likes": 59, "bm": 76, "url": "https://x.com/chasen_liao/status/2113109949379424549"}, {"ty": "资讯", "tp": "福利与优惠", "name": "Leo · Building w/ AI", "handle": "leo114119", "date": "2026-10-21 23:29", "ts": "2026-10-21T14:29:09.000Z", "text": "腾讯元宝搜索：使用激活码，可以每个月免费用 6000 次\n\n激活码：67VZDT93\n\n6000 次/月，普通用户应该够用了\n\n-激活教程：https://doc.weixin.qq.com/doc/w3_AUEAFAYLAMoCNFBzOwb0dTIm4YC2e?scode=AJEAIQdfAAotkOc0qPAUEAFAYLAMo https://x.com/leo114119/status/2112914088967672127/photo/1", "quotes": [], "likes": 146, "bm": 230, "url": "https://x.com/leo114119/status/2112914088967672127"}, {"ty": "深度文章", "tp": "行业与观点", "name": "清月已经不困了", "handle": "qingyue820", "date": "2026-10-21 22:33", "ts": "2026-10-21T13:33:24.000Z", "text": "用张小龙的话说，“每天有5亿人在吐槽我，还有1亿人想教我做微信。”\n但不得不说，他是我见过最优秀、直觉最强的产品设计师。\n从 Foxmail 到 QQ 邮箱，再到拥有十亿级用户的微信，张小龙究竟是一个怎样的人？为什么微信没有启动广告、不主动推送消息，甚至故意把一些功能设计得“不好用”？\n\n这期视频，我们从张小龙的个人经历出发，聊聊微信背后的产品哲学，以及一个更深层的问题：\n\n当互联网产品越来越擅长操纵用户时，究竟什么才是真正的尊重？\n（就是微信那篇文章的视频版）", "quotes": [], "likes": 254, "bm": 167, "url": "https://x.com/qingyue820/status/2112900058345779454"}, {"ty": "工具/项目", "tp": "AI Agent 与编程工具", "name": "Chasen", "handle": "chasen_liao", "date": "2026-10-22 10:44", "ts": "2026-10-22T01:44:43.000Z", "text": "说个 Pi 的冷知识：Pi 的工具其实有 8 个 🤯\n\n大家都知道 Pi 很极简，开局只给模型 read、bash、edit、write 这 4 个工具\n但你可能从来没用过另外 4 个，甚至都不知道它们存在\n\nPi 内置的 8 个工具是这些：\n\n- read：读文件，还能读图片\n- bash：跑 shell 命令\n- edit：对已有文件做精确的文本替换\n- write：新建文件，或者整个覆盖\n- grep：搜文件内容\n- find：按 glob 规则找文件路径\n- ls：列目录\n- powershell：Windows 上跑 PowerShell 命令\n\n后面这 4 个默认是关的，所以模型想搜代码，只能自己去 bash 里敲 grep 和 find\n\n还有个更冷的：Pi 其实还藏了两个扩展工具 codemode 和 tool_search，默认也是关的，接 MCP 的时候才会自动打开\n\ncodemode 能让模型写一段 JS 并行调用别的工具，只把脚本的输出交给模型，省上下文这块是真的狠\n\n所以严格算下来，Pi 手里有 10 个工具，平时只亮 4 个 😂\n\n怎么全部打开，我放评论区了 👇", "quotes": [], "likes": 146, "bm": 178, "url": "https://x.com/chasen_liao/status/2113084100559159420"}, {"ty": "Prompt", "tp": "编程与代码审查", "name": "Zihua", "handle": "luinlee", "date": "2026-10-22 10:49", "ts": "2026-10-22T01:49:44.000Z", "text": "最近用 Opus 和 Astra 写了不少 UI，发现一个避免 AI slop 并且让界面更好看的秘诀：\n\n在 AGENTS.md 里加上 “Avoid unnecessary secondary labels and descriptions. Let the layout do the explaining.”", "quotes": [], "likes": 7742, "bm": 10587, "url": "https://x.com/luinlee/status/2113085361836744764"}, {"ty": "深度文章", "tp": "纯链接（X 长文等）", "name": "苏茶", "handle": "Suercha007", "date": "2026-10-21 15:22", "ts": "2026-10-21T06:22:02.000Z", "text": "https://x.com/i/article/2112786740834652160", "quotes": [], "likes": 394, "bm": 855, "url": "https://x.com/Suercha007/status/2112791503278125329"}, {"ty": "深度文章", "tp": "Agent 工程", "name": "Ethan 恩宇", "handle": "UPing123zzz", "date": "2026-10-21 04:39", "ts": "2026-10-20T19:39:58.000Z", "text": "看完这张图，我觉得很多人可能一直没有真正理解 RAG 和 Agentic RAG 的区别。\n\n尤其是现在很多人一上来就想做 Agentic RAG，觉得普通 RAG 已经过时了，加上 Agent、多轮推理、工具调用，系统就一定会变得更智能。\n\n但实际上，这两种架构解决的根本就不是完全一样的问题。\n\n普通 RAG 的逻辑其实很简单：用户提出问题，系统去知识库检索相关内容，把检索到的证据交给大模型，再由模型生成答案。整个流程相对固定，核心是把正确的信息找出来，让模型基于证据回答。\n\n而 Agentic RAG 最大的不同，就是把一部分检索决策权交给了 Agent。它可以根据用户的问题，决定去哪里检索、调用什么工具、要不要拆分问题，以及第一次检索失败以后，是否需要重新查询或者切换数据源。\n\n举个例子，用户问一家公司的报销制度，普通 RAG 可能检索几份相关文档就能回答。但如果用户问的是：今年的报销政策相比去年发生了哪些变化？哪些部门受到了影响？有没有特殊审批流程？\n\n这时候系统可能就需要查询不同版本的制度，确认生效时间，检索多个部门的规定，甚至调用内部业务系统，最后再把这些证据整合起来。这才是 Agentic RAG 更适合发挥作用的地方。\n\n但我觉得最值得警惕的一件事，就是很多开发者正在把 Agentic RAG 当成一种技术炫耀。\n\n明明一个普通的混合检索加 Rerank 就能解决的问题，非要加上好几个 Agent，让它自己规划、自己检索、自己评估、自己重试。\n\n结果架构越来越复杂，Token 消耗越来越高，响应越来越慢，系统甚至还可能因为错误的规划而检索到不相关的信息。\n\n我自己最近一直在研究企业级 RAG，也越来越发现，真正困难的地方往往不是选什么框架，而是文档解析、权限隔离、增量同步、版本管理、检索质量、证据引用，以及怎么通过 Evals 去验证系统到底有没有回答正确。\n\n这些基础工程没有做好，就算给 RAG 套上十层 Agent，也不代表它能可靠地进入生产环境。\n\n所以我现在有一个越来越明确的判断：能用普通 RAG 解决的问题，就不要为了 Agent 而 Agent。只有当任务真的需要动态规划、多步检索、跨数据源查询和工具协作时，再考虑 Agentic RAG。\n\n真正优秀的 AI 工程师，不是能把系统设计得多复杂，而是知道什么时候应该使用复杂的系统，什么时候应该保持简单。\n\n技术架构从来不是越高级越好，而是谁能以更低的成本、更稳定的方式，把真实问题解决掉。\n\n这才是我认为企业 AI 落地最应该坚持的工程思维。", "quotes": [{"type": "quoted", "text": "RAG vs Agentic RAG https://x.com/alexxubyte/status/2112204626921762987/photo/1", "who": "@?", "url": "https://x.com/i/status/2112204626921762987"}], "likes": 93, "bm": 78, "url": "https://x.com/UPing123zzz/status/2112629920207925385"}, {"ty": "工具/项目", "tp": "开发与基础设施", "name": "Yifan Xu", "handle": "yifanxu_ephai", "date": "2026-10-21 02:50", "ts": "2026-10-20T17:50:43.000Z", "text": "在LayerFS跑一个RUST编写的DB Engine任务：\n\n将 2.50 TB 的快照数据、30 个分支，压缩到仅 4.66 GB, 光是 main 分支就有 8.23 GB。\n\n先吹个牛逼，我怕明天发布翻车，就吹不了了。\n\n半年前我和VC说我能打开万亿美元的市场机会，得我是傻逼，现在看来他们可能错过了十辈子都遇不到的投资机会。\n\nhttps://github.com/Ephemeral-AI-Lab/layerfs", "quotes": [], "likes": 255, "bm": 160, "url": "https://x.com/yifanxu_ephai/status/2112602428126458125"}, {"ty": "深度文章", "tp": "Agent 工程", "name": "victor-wu.eth", "handle": "victor_wu", "date": "2026-10-21 04:09", "ts": "2026-10-20T19:09:43.000Z", "text": "好问题，其实不大，真实的加上我合成的也就130份不到，但是我们场景本身就很明确，公司内部用即可。而且当时我们发现一个很有意思的eval结果。一份文档，我们当时做了两种测试：\n• 测试 A：按 topic 切成若干份独立文件，它们之间的联系用 index 来标注。\n• 测试 B：同样按 topic 处理，但不切分文件，只标注页数或位置。\n\n没想到准确率 B 明显大于 A。我们当时的文档并不特别长（最多几十页），就想看看在上下文足够大的情况下，到底 A 和 B 哪个方法好。结果发现 A 会漏掉，而 B 不会漏，这在当时让我特别吃惊。\n\n我们当时用的模型是 DeepSeek 3.2，后来就一直沿用了 B 方案。对我来说，我其实不关心用什么方案，只要够简单好用就行。\n\n相比之下，传统 RAG 的成功率就更低了。大概半年前做的方案，基本都是 500 字切片加 Top-K（我们当时算 Top-3 的设计），效果不如我现在这个，实现难度还比我这个大。\n\n对我来说，我这套流程最繁琐的一步，无非是在上传的时候要先分析一下，生成整个文档的 topic。这里我做了两级处理：第一层是标题，然后是 topic 1 和 topic 2 这两层", "quotes": [{"type": "replied_to", "text": "@victor_wu 这个 100% 是在多大的 eval 集上测的？", "who": "@?", "url": "https://x.com/i/status/2112540027867861229"}], "likes": 2, "bm": 1, "url": "https://x.com/victor_wu/status/2112622306292121756"}, {"ty": "工具/项目", "tp": "桌面与效率软件", "name": "10202be9", "handle": "1ittlecup", "date": "2026-10-21 10:55", "ts": "2026-10-21T01:55:55.000Z", "text": "AndroMeld 2.0 新功能：直接在 Mac 上运行 APK。\n\n可能是目前唯一满足沙箱的安全方案。\n花了较大力气做了 GPU 转换，普通应用使用做到了直通满帧率。\n在 M1 处理器上实测可以较流畅运行原神。\n双击 APK 安装，一样可以将安卓小工具等放到 Mac 桌面。\n\n已过审，欢迎在 Mac App Store 搜索下载 AndroMeld https://x.com/1ittlecup/status/2112724530934558855/photo/1", "quotes": [], "likes": 615, "bm": 506, "url": "https://x.com/1ittlecup/status/2112724530934558855"}, {"ty": "工具/项目", "tp": "AI Agent 与编程工具", "name": "陈大黄", "handle": "realchendahuang", "date": "2026-10-21 02:37", "ts": "2026-10-20T17:37:18.000Z", "text": "咱就是说，要相信生态的力量，DSH走插件化的路线是对的。\n\n不然你上哪里看到这么牛逼的上下文洞察？\n\nhttps://github.com/bowenliang123/dsh-context https://x.com/realchendahuang/status/2112599052143734818/photo/1", "quotes": [], "likes": 915, "bm": 1140, "url": "https://x.com/realchendahuang/status/2112599052143734818"}, {"ty": "工具/项目", "tp": "桌面与效率软件", "name": "lifcc", "handle": "mylifcc", "date": "2026-10-21 06:00", "ts": "2026-10-20T21:00:00.000Z", "text": "身价百亿的上市公司 CEO，周末是怎么解决电脑硬盘爆满的？\nShopify 创始人 Tobi Lütke 嫌现有的磁盘清理工具不够顺手，直接用 Rust + Zed 同款的 GPUI 框架，手搓了一个跨平台磁盘可视化神器 disktree 并开源。\n短短几周狂揽 3,000+ Stars，专为极客桌面 Omarchy 打造，同时完美支持 macOS 和 Windows。", "quotes": [], "likes": 317, "bm": 438, "url": "https://x.com/mylifcc/status/2112650062882804167"}, {"ty": "深度文章", "tp": "AI 编程实践", "name": "Hamel Husain", "handle": "HamelHusain", "date": "2026-10-21 01:54", "ts": "2026-10-20T16:54:25.000Z", "text": "New blog post 🎉: How To Use Decision Models For Evals\n\nIn this post, we show you how to choose a decision model for your task, tune its threshold (don't assume the 0.5 default is good!), and interpret its scores.\n\nLots of cool interactive charts here. https://x.com/i/article/2112552453422104576", "quotes": [], "likes": 2309, "bm": 4519, "url": "https://x.com/HamelHusain/status/2112588257104216294"}, {"ty": "工具/项目", "tp": "AI Agent 与编程工具", "name": "gulagala", "handle": "GulaGala001", "date": "2026-10-20 17:48", "ts": "2026-10-20T08:48:26.000Z", "text": "@Brosianes https://github.com/gulagala001/dsh-intelligent-ui\n自荐一下，支持流式输出和内嵌组件互动，欢迎试用反馈和提出意见 https://x.com/GulaGala001/status/2112465957893664862/photo/1", "quotes": [{"type": "replied_to", "text": "我去有人能做一个类似这种显示效果的DSH插件吗，好酷炫啊（\n我记得这个是前两天叫什么smartui来着还是啥 https://x.com/Brosianes/status/2112434067941818476/photo/1", "who": "@?", "url": "https://x.com/i/status/2112434067941818476"}], "likes": 20, "bm": 11, "url": "https://x.com/GulaGala001/status/2112465957893664862"}, {"ty": "深度文章", "tp": "设计", "name": "Tw93", "handle": "HiTw93", "date": "2026-10-20 21:47", "ts": "2026-10-20T12:47:49.000Z", "text": "发现不少小伙伴很好奇我是怎么用 Mac 来开发Windows软件的，以及Windows软件现在一般用什么技术栈来实现，刚好有空，来和大伙随便聊聊关于多客户端下技术选择的思考以及我的一些想法。\n\n以下是第一篇，给大伙介绍介绍各种桌面、移动端开发技术的选择以及对应选择的思考。\n\n做过前端客户端的小伙伴应该都知道，这些年端的开发一般是这三条路。\n\n第一种最简单方便的是，直接写 Web 代码，塞到浏览器就能跑，包括早年的 PhoneGap、Cordova 就是把网页塞进一个原生壳里，然后提供一些bridge的能力让js可以调用到一些原生的能力，比如唤起手机摄像头这类的 Web 不好做的事情。\n\n第二种是跨端开发，也就是好多年前大家经常听到的一码多端，当时移动端有 React Native、Weex 这一类技术，当时主要是为了解决 Web 性能差的问题，一份代码同时打包出 iOS 和 Android，这里国内大厂使用跨端技术还有一个非常大的原因就是动态化和热更新，讲的土一点就是可以绕过商店审核直接下发新页面，这也是国内跨端在当时移动互联网高速发展时特别流行的重要原因。\n\n桌面端大家熟悉的就是 Electron，大家熟知的现在不少AI桌面端、VS Code、Slack 是用这个做的，代价是相当于每个应用都自带一份 Chromium 和 Node.js，安装包一百多 MB，内存也占得多。但好处是在 Chromium 渲染引擎的统一下能够很好的保持多端的展示一致性，加上里面写的代码非常好写，后续不少桌面的速成就会用这个技术。\n\n跨端后面也慢慢延伸出更多有趣的解决方案，类似Flutter 自己实现一套渲染引擎，早期靠 Skia，现在换成了自研的 Impeller 渲染引擎来保障多端一致和性能效率的均衡，包括桌面端上老牌的 Qt，和 Flutter 一样自己画界面。\n\n这两年桌面跨端也出现了用 Rust 写的 Tauri、Go 写的 Wails，他们和 Electron 不一样的地方就是，他没有塞一个Chromium进去，而是使用的系统自带的 WebView，包会小非常多，但是整体还是基于 Web 这一套研发思路和对应实现语言去进行桥接交互，但是由于系统 Webview 每个平台不一样，Windows 上是 WebView2，Mac 上是 WKWebView，Linux 上是 WebKitGTK，所以多端显示的一致性反而不如 Electron，还是要写兼容代码。所以这种情况下，即使 Electron 很大内存占用也不低，还是会被选择更多。\n\n第三种是原生开发，也是没有 AI之前，大家觉得开发难度很大的一种方式，特别是之前的苹果系使用的 Objective-C，Android 系使用的 Java、Windows 系 C、C#，均是我认为需要科班花非常多时间去学习、看书、手编代码，要想做得好，需要花大量时间研究对应的系统底层原理，能够方便你写出相比普通研发性能更好更稳定的代码，在我看来是前期投入大，后期用户很享受的技术，我当时17年时候刚工作 2 年多的时候，职业发展比较爽的一个很大原因是我抽了半年时间学习 Objective-C 和 iOS 研发，让我自己本质前端的工作提前往跨端方向走了，刚好可以解决一些这两个工种结合的不能解决的难题，也是我当时做一线开发非常快乐有趣的时间。\n\n等到后面 Swift + SwiftUI、Kotlin + Jetpack Compose、C# + WinUI 3 慢慢出来成熟后，这些原生端语言的写法也慢慢像高级语言靠齐，也更易写了，声明式代码更短、更好读了。但是在国内完全被 React Native、Flutter、Electron 的广泛使用被盖过去了，导致开发者不多，生态发展完全靠官方推动，从而出现了出活很快，但是大家普通感觉怎么用久了卡卡的缘故的一个很大的原因，同时还占大头，而且想迁移到原生假如之前架构实现不好大概率只能重写，完全不能复用，实现得好比如说你把业务逻辑早就抽出，类似 Kotlin Multiplatform 这类方案把业务逻辑共享、界面各写各的原生，算是第四条路，也是最近几年的趋势。\n\n聊到这里大家应该大概明白了，这里也有一个不可能三角，就是研发效率、体验、性能这三者，选择 Web 是多效率少性能，选原生是多性能体验少效率，选跨端就是刚好是这三者取一个中间，做得好容易都占，做得不好，容易没有一边占到好处的尴尬局面。\n\n那么在 AI Coding 写代码已经不是问题的情况下，我们应该选择啥技术呢？很多时候也取决于你的场景，比如你就是一个 Web 场景的浏览、点点按钮、阅读这一类 Web1.0 阶段的东西，那还是非常建议直接 Web 技术来弄；假如你需要调用到系统底层的能力，或者需要操作更顺手更好分发，以及本身就是一个应用的场景，我还是非常建议使用原生技术来实现，这样可以第一时间享受到系统官方本身的众多调优，以及最原生的交互效果、最低的内存占用，加上 AI  让写两份原生代码的成本大幅下降，三角形的效率那一边被补上了，只是两个平台的调试和验证变成了新的成本，这里正是人需要重点做的事情了。\n\n当然假如实在技术选型不那么重要，工作量非常之大，以及业务效果远大于技术体验选择，选择跨端技术也是可以的，这样快，迭代发布也快，可以第一时间让你的用户收到你的最新的特性更新。\n\n不过说到底，技术是给业务服务的，最终还是需要往解决问题方向走，好比抢演唱会门票，大家不会关注你这个客户端怎么这么卡，只会关注我用你能不能抢到票，即使你做得十分顺畅，但是抢不到票也是会被骂得很惨，技术栈的选择在这里就选的好变成了锦上添花的工作，最终还是需要优先保障用户的最真实需求的解决，然后做好这里，再去想，我如何让用户体验更好，接下来才是考虑我是否需要使用原生技术来实现。\n\n一下子居然写了这么多，明天继续来聊，想给大伙来分享我是如何在 Mac 上搭建了一套研发 Windows 原生软件的环境，以及我对于 Windows /Mac 多端研发上的一些踩过的坑以及最佳实践，哈哈，欢迎交流，我们来聊聊不问 AI 自己脑袋里面的技术栈选择，挺有意思。", "quotes": [], "likes": 608, "bm": 472, "url": "https://x.com/HiTw93/status/2112526198807183766"}, {"ty": "Prompt", "tp": "设计与前端", "name": "卡比卡比", "handle": "jakevin7", "date": "2026-10-20 03:10", "ts": "2026-10-19T18:10:22.000Z", "text": "分享一个很好用的前端提示词。\n优先复用成熟库、组件源代码可控、统一设计语言、严格限制重复依赖。\n再配合指定好各种库，就算 oneshot 也能出很不错的前端。\nUI 风格统一使用  譬如 shadcn/ui Nova\n图标统一使用  譬如 Lucide\n动画统一使用  譬如 Motion\n布局库 譬如 react-resizable-panels\n拖拽使用 譬如 dnd-kit\n状态管理使用 譬如 Zustand\n......", "quotes": [], "likes": 1155, "bm": 1754, "url": "https://x.com/jakevin7/status/2112244985156481059"}, {"ty": "Prompt", "tp": "编程与代码审查", "name": "Matt Pocock", "handle": "mattpocockuk", "date": "2026-10-18 15:38", "ts": "2026-10-18T06:38:49.000Z", "text": "Prompt of the day:\n\nCreate a pre-commit hook that prevents files over 5,000 tokens. Tokens = bytes/4.\n\nRun only on staged files. Ignore files which are not authored by agents, like lockfiles or codegen.\n\nProvide explicit instructions on how to split files in the error message.\n\nThe simplest investment I ever made in my codebase. So good.", "quotes": [], "likes": 4368, "bm": 5971, "url": "https://x.com/mattpocockuk/status/2111708560715292675"}, {"ty": "工具/项目", "tp": "桌面与效率软件", "name": "Sukka / 毛绒绒的大尾巴🦊", "handle": "isukkaw", "date": "2026-10-20 00:08", "ts": "2026-10-19T15:08:05.000Z", "text": "烧了点 Opus 5.5 写了一个测速网站。\n\nhttps://speed.skk.moe\n\n（欢迎大家一起来寻找神秘小彩蛋）", "quotes": [], "likes": 235, "bm": 185, "url": "https://x.com/isukkaw/status/2112199110438826359"}, {"ty": "资讯", "tp": "模型与平台动态", "name": "Flyfish233", "handle": "Flyfish233", "date": "2026-10-19 14:30", "ts": "2026-10-19T05:30:39.000Z", "text": "@keking99 jev 已经不是好 decision 模型了，perplexity 那个好用多了还便宜，再便宜也有 cf 那个", "quotes": [{"type": "replied_to", "text": "Jev放生产是真的让人放心，稳得一批，所有黑屁 jev，装最懂最清醒的博主，根本没想过 jev 在实际生产中有多好用，我现在真的就是遇事不决接 jev，又快又便宜。saas 有福了。", "who": "@?", "url": "https://x.com/i/status/2112020991455146394"}], "likes": 10, "bm": 14, "url": "https://x.com/Flyfish233/status/2112053793588486637"}, {"ty": "生活娱乐", "tp": "搞笑与影视", "name": "moshanghuakai", "handle": "moshanghua0513", "date": "2026-10-18 10:38", "ts": "2026-10-18T01:38:20.000Z", "text": "这个福利 应该很多朋友都用的到 哈哈 （如何躺着玩手机 不伤身体） https://x.com/moshanghua0513/status/2111632944347709476/video/1", "quotes": [], "likes": 11090, "bm": 9383, "url": "https://x.com/moshanghua0513/status/2111632944347709476"}, {"ty": "深度文章", "tp": "Agent 工程", "name": "Kevin巴鲁斯", "handle": "htt_keyboarder", "date": "2026-10-18 12:10", "ts": "2026-10-18T03:10:45.000Z", "text": "前一阵子面试被问了一个问题：如果用户同时用同一个 SessionID 恢复会话，怎么防止冲突？\n\n我看了一下 pi 的实现，发现了一个有趣的事实：针对两个进程同时恢复、写入同一个会话文件，它没有实现跨进程互斥或冲突检测\n\n1. 先看 pi 的会话文件长什么样\n\n以我本地的聊天记录为例：\n\n第1行  type=session                id=01a0d6d8...（会话头：版本、目录、ID）\n第2行  type=model_change           id=ccab394a  parentId=null\n第3行  type=thinking_level_change  id=45a13d8c  parentId=ccab394a\n第4行  type=model_change           id=24eb8356  parentId=45a13d8c\n第5行  type=message(用户)          id=71e92a01  parentId=24eb8356\n第6行  type=message(助手)          id=82fa3b02  parentId=71e92a01\n...（假设共176行，除会话头外，各条目串成一条链）\n\n三点：\n\n- 持久化会话保存在 JSONL 文本文件里，一行一个条目。你说了句话、模型回了话、切了个模型、压缩了一次上下文，正常写入路径都是另起一行记一笔，不修改旧行\n\n- 除会话头外，每个条目都写着自己是谁（id）、接在谁后面（parentId）。上面的消息链是第 2 行 ← 第 3 行 ← 第 4 行 ← 第 5 行 ← 第 6 行……，会话头不参与这条链\n\n- 通过 /tree 导航到历史节点后继续聊天，可以在原文件里形成新分支，不需要修改旧行。所以在 pi 眼里，这个文件可以是一棵分叉的树\n\n2. resume 的时候 pi 做了什么\n\n三步：\n\n- 打开你选的那个 .jsonl 文件\n- 从头到尾读一遍，176 行全部装进自己进程的内存里\n- 开始聊天\n\n注意第 2 步：pi 进程里有一份历史副本，以及自己的当前位置 leafId。之后每新增一个条目，它都以自己的 leafId 为 parentId，更新内存，再追加到磁盘文件末尾。它不会自动读入另一个进程刚写入的条目，两边的上下文不会实时同步\n\n也就是说，两个进程虽然用的是同一个会话，但是它们内存里的消息列表是独立的，只不过都往同一个磁盘里的 JSONL 文件追加，这才导致了磁盘文件的逻辑混乱\n\n这条会话恢复和写入路径没有检查“这个文件是不是有别的进程正在用”，也没有通过锁或版本比较阻止并发写入\n\n3. 剧本：两个终端同时 resume 这个会话会发生什么\n\n场景一：两边同时聊天\n\n终端 A 和终端 B 都 resume 了同一个会话。此刻两边内存里的历史一模一样，都是那 176 行，链尾是同一个 id=xxxxxxx（第 176 行）\n\n你在 A 里说“帮我看看这个 bug”，在 B 里说“写个测试”：\n\n磁盘文件：\n...前176行（两边共同读到的）\n第177行  用户\"帮我看看这个bug\"   parentId=第176行   ← A写的\n第178行  用户\"写个测试\"          parentId=第176行   ← B写的\n第179行  助手(A的回答)          parentId=第177行   ← A写的\n第180行  助手(B的回答)          parentId=第178行   ← B写的\n\n这是一种可能的写入顺序，省略了其他条目，并假设每条 JSON 记录都完整写入。两边正常写盘用的都是追加模式：_persist() 中调用 appendFileSync(this.sessionFile, 新行 + \"\\n\")\n\n但追加模式不能直接等同于整条 JSON 记录在所有并发条件下都不会损坏。pi 在这里没有实现记录级互斥或事务；Sync 也只表示当前进程同步等待调用完成，不是跨进程的锁\n\n用具体动作解释：\n\n- 追加写：把我的内容接到文件末尾\n- 同步调用：我这个进程等写入调用完成，再往下执行\n- 跨进程锁：我使用会话期间，另一个进程必须等待或被拒绝\n\npi 的正常会话追加路径有前两项，没有第三项。A 写字的时候自己停下来等写完，并不意味着 B 也被要求停下来。即使两边每一行都完完整整写进文件，前面说的历史分叉仍然会发生\n\n简单说就是，如果跨进程了，那我就不保证解决冲突了\n\npi 会把消息追加到文件，但不会因此让两个进程共享最新上下文，也不会阻止另一个进程同时操作这个会话\n\n在上面这个例子里，第 177 和 178 行都接在第 176 行后面，原本的一条链变成了从同一个点长出两个分叉。A 的回答沿着 A 的历史生成，B 的回答沿着 B 的历史生成，双方都不知道对方的新消息\n\n这就是树结构能容纳的情况：只要记录完整、条目 ID 没有冲突，这些消息可以表示成合法分支。但能表示分叉不等于解决了并发冲突，两边并没有被协调成同一段连续对话\n\n下次恢复时，_buildIndex() 会把文件中最后一个非会话头条目的 ID 设为 leafId，构建上下文时再沿 parentId 回溯\n\n在上面的例子里，默认恢复的是 B 的分支，A 的分支仍保留在文件中。它不会因为检测到并发分叉而主动询问选哪一条\n\n需要查看或切换分支时，可以使用 /tree。这也不代表仍在运行的 A、B 会自动刷新出对方的分支。\n\n场景二：一边触发了整文件重写\n\n先说一下整文件重写的意思：不止在末尾加一行，而是把整个文件的内容重新写一遍\n\n普通追加：\n\n原文件：第 1 行、第 2 行、第 3 行\n写完后：第 1 行、第 2 行、第 3 行、第 4 行\n\n整文件重写：\n\n先把文件清空\n再把内存中的第 1 行、第 2 行、第 3 行……重新写进去\n\n追加是在本子后面接着写；整文件重写是先擦掉本子，再照着自己手里的副本抄一遍\n\n这解释了为什么可能丢记录：如果别人在你的副本形成之后又写了一行，你擦掉本子重新抄时，副本里没有那一行，它就丢了\n\npi 在老版本会话文件升级格式时会重写原文件，例如 v2 → v3 迁移（会话文件格式升级）。_loadEn
